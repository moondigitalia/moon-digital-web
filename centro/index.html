<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<title>Tablero MOON</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3efe9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171b" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="prefetch" href="/prueba/nueva?dentro=1">
<style>
:root{
  --fondo:#f3efe9; --tarjeta:#f6f3ee; --campo:#ece7e0; --tinta:#1d1d22; --suave:#5d5d66; --tenue:#8b8a92; --linea:rgba(29,29,34,.08);
  --cobalto:#0b4fd6; --cobalto2:#0a44b8; --cielo:#5b9cf5; --niebla:#cfd6e2; --marfil:#ece4d8; --carbon:#2b2b30;
  --sombra:0 14px 28px -12px rgba(120,105,85,.35),0 2px 6px rgba(120,105,85,.10),inset 0 1px 0 rgba(255,255,255,.85);
  --sombra-chica:0 6px 14px -6px rgba(120,105,85,.35),inset 0 1px 0 rgba(255,255,255,.8);
  --hundido:inset 0 2px 5px rgba(120,105,85,.22),inset 0 -1px 0 rgba(255,255,255,.7);
  --naranja:#e8892f; --naranjaf:#fdf0e3; --verde:#2f9e5a; --verdef:#e6f4ea; --rojo:#d9534a; --rojof:#fbe9e7; --azulf:#e4ecfb; --moradof:#ece9fb; --morado:#6a55d8;
  --ease:cubic-bezier(.22,.8,.24,1); --r:28px;
}
@media (prefers-color-scheme:dark){:root{
  --fondo:#16171b; --tarjeta:#1d1e23; --campo:#25262c; --tinta:#efedea; --suave:#b3b1b8; --tenue:#85848c; --linea:rgba(255,255,255,.07);
  --cobalto:#3a78ff; --cobalto2:#2f69eb; --cielo:#78aefc; --niebla:#3a3f4a; --marfil:#3a3631; --carbon:#d9d7d3;
  --sombra:0 14px 28px -12px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);
  --sombra-chica:0 6px 14px -6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
  --hundido:inset 0 2px 5px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.04);
  --naranja:#f2a052; --naranjaf:#3a2a1a; --verde:#5cc283; --verdef:#183026; --rojo:#ef7b72; --rojof:#3a1f1d; --azulf:#1c2740; --moradof:#272241; --morado:#a493ff;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--fondo);color:var(--tinta);font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;border:0;background:none}
input,select,textarea{font-size:16px;min-width:0}
.buscador input{width:0}   /* 16px o más: el iPhone ya no hace zoom solo al tocar un campo */
button{cursor:pointer}
[hidden]{display:none!important}
/* La página nunca se mueve: el marco ocupa exactamente lo que se ve (y se encoge cuando sube el teclado). */
#marco{position:fixed;left:0;right:0;top:var(--vt,0px);height:var(--vh,100%);overflow:hidden}
.app{zoom:var(--z,1);height:calc(var(--vh,100vh) / var(--z,1));max-width:1180px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:clamp(10px,calc(1.8 * var(--u)),16px)}
.eti{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--suave)}
.top{display:flex;align-items:center;gap:12px;min-height:44px}
.marca{display:flex;align-items:center;gap:10px;font-size:clamp(12px,calc(3.4 * var(--w)),15px);font-weight:800;letter-spacing:.3em;white-space:nowrap}
.logo{display:inline-block;height:clamp(24px,calc(6.6 * var(--w)),32px);aspect-ratio:2496/682;background:currentColor;-webkit-mask:url(/centro/logo.svg) center/contain no-repeat;mask:url(/centro/logo.svg) center/contain no-repeat}
.marca i{font-style:normal;color:var(--cobalto);font-weight:600;letter-spacing:0}
.top .esp{flex:1}
.redondo{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:inherit;text-decoration:none;background:var(--tarjeta);box-shadow:var(--sombra-chica);flex:none;transition:transform .25s var(--ease)}
.redondo:active{transform:scale(.94)}
.redondo svg{width:20px;height:20px}
.ava{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:none;background:var(--c,var(--cobalto))}
.ava.chico{width:26px;height:26px;font-size:11px;border:2px solid var(--tarjeta)}
.avas{display:flex}.avas .ava.chico+.ava.chico{margin-left:-8px}
.vista{min-height:0;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:clamp(8px,calc(1.6 * var(--u)),14px)}
/* Cambio de pantalla con fundido cruzado (la anterior se desvanece mientras entra la nueva): igual con o sin "reducir movimiento". */
/* Fundido propio: la pantalla anterior queda ENCIMA y se desvanece sobre la nueva, que ya está completa debajo. */
.fantasma{position:absolute!important;top:0;left:0;right:0;pointer-events:none;z-index:5}

/* ---------- Inicio ---------- */
.hola{font-size:clamp(22px,calc(6.4 * var(--w)),34px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.hola small{display:block;font-size:13px;font-weight:600;color:var(--suave);letter-spacing:0;margin-top:4px}
.mosaico{min-height:0;display:grid;gap:clamp(9px,calc(1.5 * var(--u)),14px);grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:1.35fr 1fr 1fr .62fr;grid-template-areas:"tuyo tuyo" "crm proy" "equipo moon" "demo demo"}
.t{position:relative;min-height:0;border-radius:var(--r);background:var(--tarjeta);box-shadow:var(--sombra);padding:clamp(12px,calc(2 * var(--u)),18px) 16px;text-align:start;display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:transform .3s var(--ease)}
.t:active{transform:scale(.985)}
.t .num{font-size:clamp(24px,calc(5.2 * var(--u)),40px);font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:auto}
.t .sub{font-size:13px;line-height:1.25;color:var(--suave);font-weight:600}
.t .t-cifra{margin-top:auto;display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap;min-width:0}.t .t-cifra .num{margin-top:0}
.mini .largo{display:none}
.aviso-fila{font-style:normal;font-weight:800}
.t>.eti{padding-right:38px;line-height:1.15;font-size:clamp(16px,calc(2.6 * var(--u)),24px);font-weight:800;letter-spacing:-.01em;text-transform:none;color:var(--tinta)}
.t-tuyo>.eti{color:#fff}
.t .flecha{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--fondo);box-shadow:var(--hundido)}
.t .flecha svg{width:15px;height:15px}
.t-tuyo{grid-area:tuyo;background:var(--cobalto);color:#fff;box-shadow:0 18px 30px -14px rgba(11,79,214,.65),inset 0 1px 0 rgba(255,255,255,.25)}
.t-tuyo .eti,.t-tuyo .sub{color:rgba(255,255,255,.82)}
.t-tuyo .flecha{background:rgba(255,255,255,.16);box-shadow:none}
.t-crm{grid-area:crm}.t-proy{grid-area:proy}.t-equipo{grid-area:equipo}.t-moon{grid-area:moon}
/* Armar demo: la herramienta de venta de Dan, una franja con el micrófono a la vista. */
.t-demo{grid-area:demo;flex-direction:row;align-items:center;gap:14px;padding:10px 16px}
.t-demo .mic{flex:none;width:clamp(40px,calc(6 * var(--u)),52px);aspect-ratio:1;border-radius:50%;background:var(--cobalto);color:#fff;display:grid;place-items:center;box-shadow:0 10px 20px -10px rgba(11,79,214,.7)}
.t-demo .mic svg{width:46%;height:auto}
.t-demo .q{min-width:0;display:grid;gap:2px}
.t-demo .q b{font-size:clamp(16px,calc(2.6 * var(--u)),22px);font-weight:800;letter-spacing:-.01em;line-height:1.15}
.t-demo .q span{font-size:13px;line-height:1.25;color:var(--suave);font-weight:600}
/* Inicio del embajador: solo lo suyo, en una columna, sin scroll. */
.mosaico.emb{grid-template-columns:minmax(0,1fr);grid-template-rows:1fr 1.45fr .62fr .62fr .62fr;grid-template-areas:none}
.t-com{background:#1f6f43;color:#fff;box-shadow:0 18px 30px -16px rgba(31,111,67,.6),inset 0 1px 0 rgba(255,255,255,.2)}
.t-rec{background:var(--cobalto);color:#fff;box-shadow:0 18px 30px -14px rgba(11,79,214,.65),inset 0 1px 0 rgba(255,255,255,.25)}
.t-com>.eti,.t-rec>.eti{color:#fff}.t-com .sub,.t-rec .sub{color:rgba(255,255,255,.85)}.t-rec .sub.fuerte{color:#fff;font-weight:800}
.t-com .flecha,.t-rec .flecha{background:rgba(255,255,255,.16);box-shadow:none}
.t-rec .mic{width:clamp(38px,calc(6 * var(--u)),52px);aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none;margin-bottom:auto}
.t-rec .mic svg{width:46%;height:auto}
.t-fila{flex-direction:row;align-items:center;gap:12px;padding:8px 14px 8px 10px}
.t-fila .flecha{position:static;flex:none}
.t-fila .q{min-width:0;flex:1;display:grid;gap:1px}
.t-fila .q b{font-size:clamp(15px,calc(2.4 * var(--u)),19px);font-weight:800;line-height:1.2}
.bola{flex:none;width:clamp(36px,calc(5.6 * var(--u)),46px);aspect-ratio:1;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px}
.t-demo .flecha{position:static;margin-left:auto;flex:none}
.brilla{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:#fff;color:var(--cobalto);font-weight:800;font-size:12px;border-radius:99px;padding:5px 11px 5px 6px}
.brilla i{width:18px;height:18px;border-radius:50%;background:var(--cobalto);color:#fff;display:grid;place-items:center;font-style:normal;font-size:11px}
.latido{animation:latido 2.4s ease-in-out infinite}
@keyframes latido{0%,100%{opacity:1}50%{opacity:.55}}
.barrita{display:flex;gap:4px;height:6px;margin-top:4px}
.barrita i{flex:var(--n);border-radius:9px;background:var(--c)}

/* ---------- Capas ---------- */
.cabeza{display:flex;align-items:center;gap:12px;min-height:44px}
.cabeza h2{font-size:clamp(17px,calc(5 * var(--w)),26px);line-height:1.15;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0;overflow-wrap:anywhere}
.cabeza .accion{background:var(--cobalto);color:#fff;box-shadow:0 10px 18px -8px rgba(11,79,214,.6)}
.cuerpo{min-height:0;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:10px}
.pils{display:flex;gap:7px;flex-wrap:wrap}
.pil{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:7px 13px 7px 8px;font-size:13px;font-weight:700;background:var(--tarjeta);box-shadow:var(--sombra-chica);color:var(--suave);transition:background .25s,color .25s}
.pil i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--c,var(--tenue))}
.pil.on{background:var(--cf,var(--cobalto));color:var(--c,#fff)}
.pil.on i{background:var(--c,#fff);color:var(--cf,var(--cobalto))}
.pil.solo{padding:7px 13px}
.lista{min-height:0;display:grid;align-content:start;gap:var(--hueco,9px);grid-template-columns:minmax(0,1fr)}
.fila{min-height:var(--alto,64px);padding-top:10px!important;padding-bottom:10px!important;border-radius:22px;background:var(--tarjeta);box-shadow:var(--sombra-chica);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:0 14px;text-align:start;width:100%;transition:transform .25s var(--ease)}
.fila:active{transform:scale(.985)}
.fila .q{min-width:0}
.fila .q b{display:block;font-size:15px;line-height:1.25;font-weight:700;overflow-wrap:anywhere}
.fila .q span{display:block;font-size:12.5px;line-height:1.3;color:var(--suave);font-weight:600;overflow-wrap:anywhere;margin-top:2px}
.punto{width:12px;height:12px;border-radius:50%;background:var(--c,var(--niebla))}
.nueva{background:var(--azulf);box-shadow:var(--sombra-chica),inset 0 0 0 2px var(--cobalto)}
.estado{font-size:11.5px;font-weight:800;border-radius:99px;padding:4px 10px;background:var(--cf);color:var(--c);white-space:nowrap}
.pie{display:flex;align-items:center;justify-content:center;gap:12px;min-height:44px}
.pie .pag{font-size:13px;font-weight:700;color:var(--suave);min-width:56px;text-align:center}
.vacio{display:grid;place-items:center;text-align:center;color:var(--suave);font-weight:600;padding:20px;border-radius:var(--r);background:var(--tarjeta);box-shadow:var(--hundido);height:100%}
.vacio b{display:block;color:var(--tinta);font-size:17px;margin-bottom:4px}
.buscador{display:flex;align-items:center;gap:10px;height:44px;border-radius:99px;background:var(--campo);box-shadow:var(--hundido);padding:0 16px}
.buscador input{flex:1;min-width:0;outline:none;height:100%}
.buscador svg{width:18px;height:18px;color:var(--tenue)}

/* Ficha / formularios */
.hoja{min-height:0;border-radius:var(--r);background:var(--tarjeta);box-shadow:var(--sombra);padding:16px;display:grid;align-content:start;gap:12px;overflow:hidden}
.par{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center;font-size:14px}
.par>span{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--tenue)}
.par>b{font-weight:600;overflow-wrap:anywhere}
.campo{width:100%;height:46px;border-radius:99px;background:var(--campo);box-shadow:var(--hundido);padding:0 18px;outline:none}
textarea.campo{height:auto;border-radius:22px;padding:14px 18px;resize:none}
.campo:focus{box-shadow:var(--hundido),0 0 0 2px var(--cielo)}
.boton{height:50px;border-radius:99px;font-weight:800;font-size:15px;padding:0 24px;background:var(--cobalto);color:#fff;box-shadow:0 12px 20px -10px rgba(11,79,214,.7),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .25s var(--ease),opacity .25s}
.boton:active{transform:scale(.97)}
.boton.dos{background:var(--tarjeta);color:var(--tinta);box-shadow:var(--sombra-chica)}
.boton[disabled]{opacity:.55}
.botones{display:flex;gap:10px;flex-wrap:wrap}
.botones .boton{flex:1 1 140px;padding:0 16px}
.tope{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:10px;align-items:center;font-size:14px;font-weight:700}
.botones.apilados{display:grid;gap:8px}.botones.apilados .boton{height:44px}
.boton.rojo{color:var(--rojo)}
#tour{position:fixed;inset:0;z-index:80}
.tour-velo{position:absolute;inset:0}
.tour-aro{position:absolute;pointer-events:none;box-shadow:0 0 0 3px #fff,0 0 0 200vmax rgba(10,12,20,.58)}
.tour-globo{position:absolute;background:var(--tarjeta);color:var(--tinta);border-radius:24px;padding:16px;display:grid;gap:8px;box-shadow:0 20px 40px -12px rgba(0,0,0,.55)}
.tour-globo .botones{flex-wrap:nowrap}.tour-globo .boton{flex:1 1 0;min-width:0;height:46px}
.tour-globo b{font-size:19px;font-weight:800;line-height:1.2}.tour-globo p{font-size:15px;font-weight:600;color:var(--suave);line-height:1.35}
.boton.chico{height:38px;padding:0 14px;font-size:13.5px;flex:none}
/* Equipo */
.socios{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.socio{display:grid;align-content:start;justify-items:center;text-align:center;gap:3px;padding:10px 4px;border-radius:22px;background:var(--tarjeta);box-shadow:var(--sombra-chica);min-width:0}
.socio .ava{width:clamp(40px,calc(12 * var(--w)),58px);height:clamp(40px,calc(12 * var(--w)),58px);font-size:17px;margin-bottom:3px}
.socio b{font-size:15px;font-weight:800}.socio span{font-size:12px;font-weight:600;color:var(--suave);line-height:1.25;overflow-wrap:anywhere}.socio small{font-size:12px;font-weight:800;color:var(--cobalto)}
.eq-cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.eq-enlaces{display:flex;justify-content:center;gap:24px;flex-wrap:wrap}.eq-enlaces .enlace{min-height:36px}
.quien{display:flex;gap:10px;flex-wrap:wrap}
.quien button{display:flex;align-items:center;gap:8px;border-radius:99px;padding:5px 14px 5px 5px;background:var(--tarjeta);box-shadow:var(--sombra-chica);font-weight:700;font-size:14px;opacity:.6;transition:opacity .25s,box-shadow .25s}
.quien button .ava{width:30px;height:30px;font-size:12px}
.quien button.on{opacity:1;box-shadow:var(--sombra-chica),inset 0 0 0 2px var(--cobalto)}
/* Nueva tarea: una pregunta a la vez */
.pasos-cab{display:flex;justify-content:space-between;align-items:center;gap:10px}
.puntos{display:flex;gap:6px}.puntos i{width:9px;height:9px;border-radius:50%;background:var(--niebla)}.puntos i.on{background:var(--cobalto)}
.pasos-cuerpo{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:16px;overflow:hidden}.pasos>.botones,.pasos>.aviso,.pasos>.pasos-cab{flex:none}
.grupo{display:grid;gap:8px;min-width:0}
.preg{font-size:clamp(19px,calc(5 * var(--w)),24px);font-weight:800;line-height:1.2}
.quien.grande button{opacity:1;font-size:15px}.quien.grande button.on{background:var(--azulf)}
.segmento.fechas{display:grid;grid-template-columns:1fr 1fr;border-radius:24px}
.fecha-dice{font-weight:800;color:var(--cobalto);font-size:16px}
#sug{flex:1;min-height:0}
.sig-campo{display:none}.teclado form.pasos.no-ultimo .sig-campo{display:block;width:100%}.teclado form.pasos.no-ultimo>.botones{display:none}.teclado form.pasos.no-ultimo>.boton:not(.sig-campo){display:none}.teclado form.pasos .botones.apilados{display:none}
.ocupado .boton,.ocupado button{cursor:progress}
.redondo[disabled]{opacity:.35;pointer-events:none}
.lista.hay-mas{-webkit-mask-image:linear-gradient(#000 calc(100% - 46px),transparent);mask-image:linear-gradient(#000 calc(100% - 46px),transparent)}
.teclado .pasos-cab{display:none}.teclado form.pasos>:not(:focus-within):not(.botones):not(.boton):not(.aviso):not(.pasos-cuerpo){display:none}.teclado .pasos .grupo:not(:focus-within){display:none}.teclado .pasos .grupo .grupo{display:grid}.teclado .pasos .fecha-dice{display:none}
.fases{display:grid;gap:clamp(4px,calc(1 * var(--u)),10px);justify-self:center;width:min(100%,320px)}
.fases button{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700;color:var(--tenue);text-align:start}
.fases button i{width:30px;height:30px;border-radius:50%;background:var(--campo);box-shadow:var(--hundido);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800}
.fases button.hecha i{background:var(--cielo);color:#fff;box-shadow:none}
.fases button.on{color:var(--tinta)}
.fases button.on i{background:var(--cobalto);color:#fff;box-shadow:0 8px 14px -6px rgba(11,79,214,.7)}
.anillo{--p:0;width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--cobalto) calc(var(--p)*1%),var(--niebla) 0);display:grid;place-items:center;flex:none}
.anillo b{width:30px;height:30px;border-radius:50%;background:var(--tarjeta);display:grid;place-items:center;font-size:11px;font-weight:800}
.aviso{font-size:13px;font-weight:700;color:var(--rojo);min-height:18px}
.aviso.bien{color:var(--verde)}
.tabs{display:flex;gap:4px;background:var(--campo);box-shadow:var(--hundido);border-radius:99px;padding:4px}
.tabs button{flex:1 1 auto;min-width:0;padding:0 6px;min-height:36px;line-height:1.1;border-radius:99px;font-weight:700;font-size:13px;color:var(--suave);transition:background .25s,color .25s}
.tabs button.on{background:var(--tarjeta);color:var(--cobalto);box-shadow:var(--sombra-chica)}
.ancho{grid-column:1/-1}
.mini{font-size:12px;color:var(--suave);font-weight:600}

/* Entrada */
.entrada{height:100%;min-height:0;display:grid;place-items:center}
.entrada .caja{width:min(420px,100%);display:grid;gap:16px;justify-items:center;text-align:center}
.entrada h1{font-size:clamp(22px,calc(6 * var(--w)),28px);font-weight:800;letter-spacing:-.01em}
.entrada p{color:var(--suave);font-weight:600;font-size:14px}
.gente{display:flex;gap:clamp(12px,calc(4 * var(--w)),22px);justify-content:center}
.gente button{display:grid;justify-items:center;gap:8px;font-weight:800;font-size:15px}
.gente .ava{width:clamp(72px,calc(21 * var(--w)),92px);height:clamp(72px,calc(21 * var(--w)),92px);font-size:26px;box-shadow:var(--sombra);transition:transform .3s var(--ease)}
.gente button:active .ava{transform:scale(.95)}
.conojo{position:relative;display:block;width:100%}
.conojo .campo{padding-right:54px}
.ojo{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--suave)}
.ojo svg{width:20px;height:20px}
.codigo{letter-spacing:.5em;text-align:center;font-size:22px;font-weight:800}
.enlace{font-weight:700;color:var(--cobalto);font-size:14px}

/* Tarjetas del inicio que se llenan solas: lo que cabe se muestra; lo que no, se queda adentro de la capa */
.t{cursor:pointer}
.extra{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:hidden;margin-top:4px}
.xi{display:flex;align-items:center;gap:8px;text-align:start;font-size:13.5px;font-weight:700;line-height:1.25;padding:7px 10px;border-radius:14px;background:var(--fondo);box-shadow:var(--hundido);flex:none}
.xi small{font-weight:600;color:var(--suave);margin-left:auto;padding-left:6px;white-space:nowrap}
.xi .punto{flex:none;width:10px;height:10px}
.xi .q{min-width:0}
.t-tuyo .xi{background:rgba(255,255,255,.14);box-shadow:none;color:#fff}
.t-tuyo .xi small{color:rgba(255,255,255,.8)}
.t-tuyo .xi.nueva{background:#fff;color:var(--cobalto)}
.t-tuyo .xi.nueva small{color:var(--cobalto)}
.xmas{font-size:12px;font-weight:800;color:var(--suave);flex:none}
.t-tuyo .xmas{color:rgba(255,255,255,.85)}
.xtxt{font-size:clamp(13px,calc(1.9 * var(--u)),16px);font-weight:700;line-height:1.35;color:var(--suave);flex:none}
/* Anillo de fases */
.avance{display:grid;justify-items:center;gap:clamp(6px,calc(1.4 * var(--u)),12px);text-align:center}
.avance svg{width:min(230px,calc(52 * var(--w)),calc(26 * var(--u)));height:auto;overflow:visible}
.avance .fase-n{font-size:clamp(22px,calc(4 * var(--u)),30px);font-weight:800;letter-spacing:-.01em}
.avance{width:100%;min-width:0}.avance .fase-n,.avance .fase-m{width:min(34ch,100%)}
.avance .fase-m{font-weight:700;color:var(--suave)}
#fases{width:100%;min-width:0}
.actual{animation:latido 2.4s ease-in-out infinite}
/* Fases: el proyecto puede ir en varias a la vez. Al tocar, solo cambian los colores, suave (nada se vuelve a dibujar). */
.arco{stroke:var(--niebla);transition:stroke .2s}
.arco.hecho{stroke:var(--cielo)}
.arco.ahora{stroke:var(--cobalto);animation:respira 3.2s ease-in-out infinite}
@keyframes respira{0%,100%{opacity:1}50%{opacity:.7}}
.pil.fa{transition:background .2s,color .2s,box-shadow .2s}
.pil.fa i{background:transparent;box-shadow:inset 0 0 0 2px var(--niebla);color:transparent;transition:background .2s,color .2s,box-shadow .2s}
.pil.fa i svg{width:12px;height:12px}
.pil.fa.hecha{color:var(--cobalto)}
.pil.fa.hecha i{box-shadow:inset 0 0 0 2px var(--cobalto)}
.pil.fa.on{background:var(--cobalto);color:#fff}
.pil.fa.on i{background:#fff;color:var(--cobalto);box-shadow:none}
.enlaces{display:flex;gap:8px;justify-content:center;width:100%}
.enlaces .boton{flex:1 1 0;min-width:0;max-width:220px;height:44px;padding:0 12px;font-size:14px;white-space:nowrap;gap:6px}
.enlaces.sin-icono .boton svg{display:none}
.qr-caja{display:grid;justify-items:center;gap:clamp(8px,calc(1.6 * var(--u)),16px);text-align:center;width:100%}
.qr-caja .qr{background:#fff;border-radius:22px;padding:clamp(12px,calc(2 * var(--u)),20px);box-shadow:var(--sombra-chica);width:min(330px,calc(72 * var(--w)),calc(42 * var(--u)));aspect-ratio:1}
.qr-caja .qr svg{display:block;width:100%;height:100%}
.qr-caja .qr-url{font-weight:700;color:var(--suave);font-size:13.5px}
.icono{position:relative;flex:none;border-radius:50%;background:var(--c);color:#fff;font-weight:800;display:grid;place-items:center;overflow:hidden}
.icono img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.icono img.logo-c{object-fit:contain;padding:7%}.icono img.en-color{background:var(--c);padding:0}
.icono.duo{background:transparent;border-radius:0;overflow:visible;display:flex;align-items:flex-end;gap:2px;width:auto!important}
.icono.duo img{position:static;width:auto;height:100%;object-fit:contain;background:none}
.demo{position:relative;min-height:0;border-radius:var(--r);overflow:hidden;background:var(--c);box-shadow:var(--sombra);display:grid;grid-template-rows:auto auto;align-content:end;gap:10px;padding:clamp(16px,calc(2.6 * var(--u)),26px);color:#fff;container-type:size}
.demo-logo{--lg:min(40cqh,36cqw,230px);position:absolute;width:var(--lg);height:var(--lg);right:max(18px,8cqw);top:max(16px,7cqh)}
.ancho .demo-logo{--lg:min(56cqh,30cqw,260px);top:50%;margin-top:calc(var(--lg) * -.5);right:12cqw}
.demo-logo::before,.demo-logo::after{content:"";position:absolute;left:50%;top:50%;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);transform:translate(-50%,-50%);pointer-events:none}
.demo-logo::before{width:calc(var(--lg) * 1.55);height:calc(var(--lg) * 1.55)}
.demo-logo::after{width:calc(var(--lg) * 2.25);height:calc(var(--lg) * 2.25);border-color:rgba(255,255,255,.12)}
.demo-logo .icono{width:var(--lg);height:var(--lg);font-size:calc(var(--lg) * .42);box-shadow:0 0 0 5px rgba(255,255,255,.22)}
.demo-logo .icono.duo{box-shadow:none}
.demo-info{position:relative;display:grid;gap:2px}
.demo-info .eti{color:rgba(255,255,255,.78)}
.demo-info b{display:block;font-size:clamp(22px,calc(3.6 * var(--u)),34px);font-weight:800;line-height:1.1}
.demo-info span:last-child{font-size:13px;font-weight:700;opacity:.82}
.demo-botones{position:relative;display:flex;align-items:center;gap:10px}
.demo-boton{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#18204a}
.demo-boton svg{width:16px;height:16px}
.demo-enviar{background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
.rects>:last-child:nth-child(odd),.lista.dos>:last-child:nth-child(odd):not(:only-child),.casa-filas>:last-child:nth-child(odd){grid-column:1/-1}
.rects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ancho .rects{grid-template-columns:repeat(4,minmax(0,1fr))}
.bajo .rect{padding:9px 12px}
.rect{border-radius:22px;background:var(--tarjeta);box-shadow:var(--sombra-chica);padding:12px 14px;text-align:start;display:grid;gap:3px;align-content:start;transition:transform .25s var(--ease)}
.rect:active{transform:scale(.98)}
.rect b{font-size:15px;font-weight:800}
.rect span{font-size:12.5px;font-weight:600;color:var(--suave);line-height:1.3}
.rect.sin{background:transparent;box-shadow:inset 0 0 0 1.5px var(--linea)}
.rect.sin b{color:var(--suave)}.rect.sin span{color:var(--tenue)}
.flecha-f{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--fondo);box-shadow:var(--hundido)}.flecha-f svg{width:14px;height:14px}
.fila.chica{min-height:52px;padding-top:8px!important;padding-bottom:8px!important;gap:11px;border-radius:18px}
.fila.chica .q b{font-size:14.5px}
.fila.sin{opacity:.55;cursor:default}
html:not(.ancho) .agenda{gap:0!important}
html:not(.ancho) .agenda>.fila{border-radius:0;box-shadow:none;border-bottom:1px solid var(--linea)}
html:not(.ancho) .agenda>.fila:first-child{border-radius:20px 20px 0 0}
html:not(.ancho) .agenda>.fila:last-child{border-radius:0 0 20px 20px;border-bottom:0}
html:not(.ancho) .agenda>.fila:only-child{border-radius:20px}
.casa .vision{border-radius:22px;background:linear-gradient(150deg,#22306a,#141a3c);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--sombra-chica)}
.casa .vision .logo{height:22px;flex:none;color:#fff}
.casa .vision p{font-size:13.5px;font-weight:700;line-height:1.35;opacity:.92}
.jason{position:relative;min-height:0;overflow:hidden;border-radius:var(--r);background:#141a3c;background:radial-gradient(120% 100% at 100% 0%,#33449a 0%,#1b2457 45%,#11163a 100%);color:#fff;padding:clamp(14px,calc(2.4 * var(--u)),22px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;box-shadow:var(--sombra)}
.jason::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-110px;top:-120px;border:1.5px solid rgba(201,214,255,.16);pointer-events:none}
.j-cab{position:relative;display:flex;align-items:center;gap:12px}
.j-cab .eti{color:#c9d6ff}
.j-cab b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.j-cab div>span:last-child{display:block;font-size:13px;font-weight:600;opacity:.82;line-height:1.3;margin-top:2px}
.j-centro{position:relative;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto auto;align-content:center;justify-items:center;gap:10px;text-align:center;container-type:size}
.j-orbe{position:relative;align-self:center;height:min(100%,170px);aspect-ratio:1;min-height:0;border-radius:50%;background:radial-gradient(circle at 38% 36%,#fff 0%,#e4eaff 30%,#8fa3d9 66%,#2a3b70 100%);box-shadow:0 0 0 12px rgba(201,214,255,.07),0 0 0 26px rgba(201,214,255,.04)}
.j-probar{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#141a3c;text-decoration:none;font-size:17px;min-height:56px;padding:0 28px}
.j-probar svg{width:20px;height:20px}
.j-num{font-size:12.5px;font-weight:700;opacity:.8;line-height:1.35}
.j-mas{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.j-mas button{border-radius:99px;background:rgba(255,255,255,.13);color:#fff;font-weight:800;font-size:13.5px;padding:11px 6px;transition:transform .25s var(--ease)}
.j-mas button:active{transform:scale(.96)}.j-mas button:disabled{opacity:.4}
.etapas[hidden],#resultados[hidden]{display:none!important}
.etapas{min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(64px,auto);align-content:start;gap:10px}
.ancho .etapas{grid-template-columns:repeat(4,minmax(0,1fr))}
.etapa{min-height:0;overflow:hidden;border-radius:22px;background:var(--tarjeta);box-shadow:var(--sombra-chica);padding:12px 14px;text-align:start;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:4px;position:relative;transition:transform .25s var(--ease)}
.etapa::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.etapa:active{transform:scale(.98)}
.et-cab{display:flex;align-items:center;justify-content:space-between;gap:8px}
.et-cab{flex:1;min-width:0;gap:8px!important}.et-cab b{min-width:0;overflow-wrap:normal;hyphens:none;font-size:clamp(15px,calc(4.4 * var(--w)),21px);font-weight:800;color:var(--tinta);line-height:1.15}
.et-cab i{flex:none;font-style:normal;min-width:34px;height:34px;padding:0 9px;font-size:16px!important;border-radius:99px;display:grid;place-items:center;background:var(--cf);color:var(--c);font-weight:800;font-size:15px}
.et-d{font-size:12.5px;font-weight:600;color:var(--suave);line-height:1.3;align-self:start}
.etapa{display:flex!important;align-items:center;padding:14px 12px 14px 18px!important}
.et-lista{min-height:0;overflow:hidden;display:grid;align-content:start;gap:5px;margin-top:4px}
.et-fila{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--tinta);line-height:1.25}
.et-fila>span:last-child{overflow-wrap:anywhere}
.et-fila .icono{background:var(--cf);color:var(--c)}
.et-mas{font-style:normal;font-size:12px;font-weight:800;color:var(--suave)}.et-mas:empty{display:none}
.etapas.sin-d .et-d{display:none}
.lista.desliza>*{flex:none}
.ancho .lista.dos.desliza{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:max-content;align-content:start}
.lista.desliza{display:flex;flex-direction:column;gap:var(--hueco,9px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;align-content:start;border-radius:20px}
.boton svg{width:18px;height:18px;flex:none}.boton:has(svg){display:inline-flex;align-items:center;justify-content:center;gap:8px}
.bajo .campo-foto{padding:6px 10px}.bajo .cf-vista{width:40px;height:40px}
.campo-foto{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;background:var(--campo);cursor:pointer}
.cf-vista{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--tarjeta);color:var(--suave);box-shadow:var(--sombra-chica)}
.cf-vista img{width:100%;height:100%;object-fit:contain;background:#fff}.cf-vista svg{width:22px;height:22px}
.campo-foto b{display:block;font-size:14.5px;font-weight:800;overflow-wrap:anywhere}.campo-foto small{display:block;font-size:12px;font-weight:600;color:var(--suave)}
.et-campo{display:grid;gap:5px;font-size:12px;font-weight:800;color:var(--suave);letter-spacing:.04em}
/* Celulares bajitos: los formularios se compactan (nunca se salen de la pantalla) */
.bajo2 form.pasos.hoja{gap:8px;padding:12px}.bajo2 .et-campo{gap:3px}.bajo2 form.pasos .campo{min-height:42px;height:42px}.bajo2 form.pasos textarea.campo{height:auto}.bajo2 .campo-foto{padding:6px 10px}form .aviso:empty{display:none}.bajo2 form.pasos .quien button .ava{width:26px;height:26px}.bajo2 form.pasos .quien button{padding-top:3px;padding-bottom:3px}
.doc-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--azulf);color:var(--cobalto);flex:none}.doc-ic svg{width:18px;height:18px}
.casa-filas{display:grid;gap:8px}
.casa-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(150deg,#22306a,#141a3c);color:#fff;flex:none}.casa-ic svg{width:18px;height:18px}
.ancho .casa{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)!important}
.ancho .casa .vision{grid-column:2;grid-row:1}
.ancho .casa .jason{grid-column:1;grid-row:1/3}
.ancho .casa .casa-filas{grid-column:2;grid-row:2;grid-auto-rows:minmax(0,1fr)}
.ancho .casa-filas>.fila{min-height:0}
.ancho .casa-filas .q b{font-size:17px}.ancho .casa-filas .casa-ic{width:46px;height:46px}
.hoja.visor{position:relative;padding:0!important;overflow:hidden}
.doc-html{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;display:block}
/* Un marco (página de adentro) no se enseña hasta que ya tiene su contenido: el celular nunca muestra su hoja en blanco
   mientras carga. Si algo tarda de más, a los 3 s se enseña igual. */
.doc-html:not(.listo){visibility:hidden;animation:marcoTarde 0s 3s forwards}
@keyframes marcoTarde{to{visibility:visible}}
#flotante{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,8px);opacity:0;pointer-events:none;z-index:60;background:#1d1d22;color:#fff;padding:12px 16px;border-radius:18px;font-weight:700;font-size:14px;line-height:1.35;width:max-content;max-width:min(92%,420px);text-align:center;overflow-wrap:anywhere;transition:opacity .25s var(--ease),transform .25s var(--ease)}

.hoja.md{display:block;overflow:hidden;line-height:1.5;font-weight:500}

.ficha1{display:flex;flex-direction:column;gap:clamp(10px,calc(1.8 * var(--u)),16px)}
.f-quien{display:flex;align-items:center;gap:12px;min-width:0}.f-quien .q{min-width:0;display:grid;gap:2px}.f-quien b{font-size:clamp(18px,calc(4.8 * var(--w)),22px);font-weight:800;line-height:1.2;overflow-wrap:anywhere}.f-quien span{font-size:13px;font-weight:600;color:var(--suave)}

.p-acciones{display:flex;gap:6px;flex-wrap:nowrap;min-width:0}
.pilita{flex:1 1 auto;justify-content:center;min-width:0;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:99px;background:var(--tarjeta);box-shadow:var(--sombra-chica);font-size:13px;font-weight:800;color:var(--tinta);white-space:nowrap}

<script>
'use strict';
const API = '/api/centro';
const LLAVE = 'centro.moon.sesion';
const GENTE = { daniel: { n: 'Daniel', c: '#2b2b30', i: 'D' }, dan: { n: 'Dan', c: '#3f86ee', i: 'Dn' }, kid: { n: 'Kid', c: '#0b4fd6', i: 'K' } };
const ETAPA = {
  'pendiente':  { n: 'Pendientes', c: 'var(--naranja)', cf: 'var(--naranjaf)', ic: '◷', d: 'Nos buscaron o los buscamos, pero todavía no hay trato.' },
  'en proceso': { n: 'En proceso', c: 'var(--cobalto)', cf: 'var(--azulf)',   ic: '↻', d: 'Ya estamos platicando una propuesta con ellos.' },
  'cerrado':    { n: 'Cerrados',   c: 'var(--verde)',   cf: 'var(--verdef)',  ic: '✓', d: 'Ya firmaron y pagaron. Estamos construyendo lo suyo.' },
  'en órbita':  { n: 'En órbita',  c: 'var(--morado)',  cf: 'var(--moradof)', ic: '◎', d: 'Ya se lo entregamos y nos pagan mantenimiento cada mes. Hay que cuidarlos de cerca.' },
  'portafolio': { n: 'Portafolio', c: 'var(--suave)',   cf: 'var(--campo)',   ic: '★', d: 'Ya se lo entregamos y no lleva mantenimiento. Es el registro de lo que hemos hecho.' },
  'archivo':    { n: 'Archivo',    c: 'var(--rojo)',    cf: 'var(--rojof)',   ic: '×', d: 'Dijeron que no, por ahora. Se guardan por si regresan.' },
};
const GRUPO_TODOS = { n: 'Todos', c: 'var(--tinta)', cf: 'var(--campo)', ic: '●', d: 'Todas las personas y negocios que tenemos, estén en la etapa que estén.' };
const GRUPO_PRUEBAS = { n: 'Pruebas', c: 'var(--suave)', cf: 'var(--campo)', ic: '⚙', d: 'Llamadas de prueba de nosotros mismos. No cuentan como clientes.' };
const ROL = { daniel: 'Ideas y dirección', dan: 'Ventas y llamadas', kid: 'Construye y diseña' };
const FASE_TXT = {
  'por arrancar': 'Todo listo para arrancar. Lo primero: juntar la información.',
  'información': 'Estamos entendiendo al cliente. Lo que sigue: el diseño.',
  'diseño': 'Ya se está viendo cómo va a quedar. Lo que sigue: construirlo.',
  'construcción': 'Manos a la obra. Lo que sigue: probarlo.',
  'pruebas': '¡Ya casi! Solo falta entregarlo.',
  'entregado': '¡Entregado! Uno más para MOON.',
};
// Un proyecto puede ir en varias fases a la vez: se guardan juntas, separadas por coma ("construcción,pruebas").
const fasesDe = p => { const l = String((p && p.fase) || '').split(',').filter(f => D.listas.fases.includes(f)); return l.length ? l : ['por arrancar']; };
const entregado = p => fasesDe(p).includes('entregado');
const activo = p => fasesDe(p).some(f => f !== 'entregado');
const nombreFases = l => { const t = l.map((f, i) => i ? f : f[0].toUpperCase() + f.slice(1)); return t.length < 2 ? t[0] : t.slice(0, -1).join(', ') + ' y ' + t[t.length - 1]; };
const textoFases = l => { const ult = l[l.length - 1], otras = l.slice(0, -1); return (FASE_TXT[ult] || '') + (otras.length ? ` También va en ${nombreFases(otras).toLowerCase()}.` : ''); };
// El título de la fase es siempre una sola palabra (la más avanzada); las demás van en el texto de abajo. Así nunca cambia de tamaño.
const tituloFases = l => { const f = l[l.length - 1]; return f[0].toUpperCase() + f.slice(1); };
const TEMP = { caliente: 'var(--rojo)', tibio: 'var(--naranja)', frio: 'var(--cielo)' };
const I = {
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  atras: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  basura: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  mas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  abre: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>',
  izq: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  der: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  tel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  wa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.4L3 21"/></svg>',
  ojo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  ojoNo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7c1.9 0 3.6-.6 5-1.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
  subir: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>',
  lapiz: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>',
  enviar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 10 14"/><path d="M21 3l-6.5 18-4.5-7-7-4.5z"/></svg>',
  palomita: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  liga: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  qr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="6" height="6" rx="1"/><rect x="14.5" y="3.5" width="6" height="6" rx="1"/><rect x="3.5" y="14.5" width="6" height="6" rx="1"/><path d="M14.5 14.5h2v2h-2zM18.5 18.5h2v2h-2zM18.5 14.5h2M14.5 18.5v2"/></svg>',
  lupa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
};

let D = null;           // todo lo que manda el servidor
let pila = [];          // capas abiertas: [{tipo, ...}]
let estado = { tareas: 'mias', crm: 'pendiente', proy: 'todos', busca: '' };
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sesionGuardada = () => { try { return localStorage.getItem(LLAVE) || ''; } catch (e) { return ''; } };
const guardarSesion = v => { try { v ? localStorage.setItem(LLAVE, v) : (localStorage.removeItem(LLAVE), localStorage.removeItem(COPIA)); } catch (e) {} };
// Copia de lo último que se vio (solo en este aparato y solo para esta sesión): al abrir, el tablero aparece al instante con ella
// y se pone al día solo en cuanto llega lo nuevo. Al cerrar sesión se borra.
const COPIA = 'centro.moon.copia';
const firmaSesion = () => { const v = sesionGuardada(); let h = 0; for (let i = 0; i < v.length; i++) h = (h * 31 + v.charCodeAt(i)) | 0; return String(h); };
function leerCopia() { try { const c = JSON.parse(localStorage.getItem(COPIA) || 'null'); return c && c.s === firmaSesion() && c.d ? c : null; } catch (e) { return null; } }
function guardarCopia(d, f) { try { const c = leerCopia() || {}; localStorage.setItem(COPIA, JSON.stringify({ s: firmaSesion(), d: d || c.d, f: f || c.f })); } catch (e) {} }

// Mientras se guarda algo, ningún otro toque cuenta: un doble toque nunca guarda dos veces ni regresa dos pantallas.
const LECTURAS = new Set(['inicio', 'ficha', 'documento', 'archivo_parte', 'fotos', 'equipo', 'bitacora', 'papelera', 'uso', 'quienes', 'invitacion', 'tarea_vista', 'subir_parte', 'salir']);
let ocupado = false, sueltaReloj = null;
function soltar() { ocupado = false; pendientes = 0; clearTimeout(sueltaReloj); document.documentElement.classList.remove('ocupado'); }
function bloquear() { ocupado = true; clearTimeout(sueltaReloj); sueltaReloj = setTimeout(soltar, 8000); document.documentElement.classList.add('ocupado'); }
// Solo se frenan los toques que guardan o cambian de pantalla (botones grandes, regresar, filas); los interruptores (fases, etapas) siguen libres.
const bloqueaToque = e => { if (ocupado && e.target.closest && (e.type === 'submit' || e.target.closest('.boton,#volver,.redondo,.enlace,.fila,.t,[data-ir]'))) { e.preventDefault(); e.stopImmediatePropagation(); } };
// Solo bloquea un guardado que salió de tocar un botón de guardar o de regresar (no los interruptores que guardan solos).
let toqueGuardar = 0;
const marcaToque = e => { if (!ocupado && e.target.closest && (e.type === 'submit' || e.target.closest('.boton,#volver,.redondo,.enlace'))) toqueGuardar = performance.now(); };
document.addEventListener('click', bloqueaToque, true);
document.addEventListener('submit', bloqueaToque, true);
document.addEventListener('click', marcaToque, true);
document.addEventListener('submit', marcaToque, true);
let pendientes = 0;
async function api(accion, datos) {
  const escribe = !LECTURAS.has(accion);
  if (escribe && performance.now() - toqueGuardar < 400) bloquear();
  if (ocupado) { pendientes++; clearTimeout(sueltaReloj); }   // lo que se pide justo después de guardar es parte del mismo toque
  const contado = ocupado;
  const j = await api0(accion, datos);
  if (contado) pendientes = Math.max(0, pendientes - 1);
  // Si falló, se suelta luego luego (para reintentar). Si salió bien, se suelta al dibujar la pantalla siguiente,
  // o en un instante si el toque ya no hace nada más (por ejemplo, "Mandar su link").
  if (contado && escribe && !j.ok && !pendientes) soltar();
  else if (ocupado && !pendientes) { clearTimeout(sueltaReloj); sueltaReloj = setTimeout(soltar, 80); }
  return j;
}
async function api0(accion, datos) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-sesion': sesionGuardada() }, body: JSON.stringify(Object.assign({ accion }, datos || {})) })
    .catch(() => null);
  if (!r) return { ok: false, error: 'red' };
  const j = await r.json().catch(() => ({ ok: false, error: 'red' }));
  if (r.status === 401 && j.error === 'sesion') { guardarSesion(''); D = null; pila = []; pantallaQuien(); }
  return j;
}

const CLAUDE = { n: 'Claude', c: '#c96442', i: 'C' };
let FOTOS = {};   // caras del equipo: llegan solo después de entrar
const FOTOS_LISTAS = [];   // se guardan aquí ya decodificadas para que cada pantalla nueva las muestre al instante
async function prepararFotos(mapa) {
  const out = {};

  c.guardar = guarda;
  const ir = n => { guarda(); c.paso = n; pinta(true); const e = app.querySelector('.pasos-cuerpo .campo:not([type=date])'); if (e) e.focus(); };

  if (paso === 2) app.querySelectorAll('#para button').forEach(b => b.onclick = () => { t.para = b.dataset.u; ir(3); });
  if (paso === 3) {
    const q = document.getElementById('q3'), sug = document.getElementById('sug');

    const pinta3 = () => {
      const k = sinAcento(q.value), l = (k ? nombres.filter(n => sinAcento(n).includes(k)) : nombres).slice(0, 30);

    app.querySelectorAll('#cuando button').forEach(b => b.onclick = () => pon(b.dataset.v, !b.dataset.v));

    if (paso === 4 && !t.vence && !t.sinFecha) { av.textContent = 'Elige para cuándo (o "Sin fecha").'; return; }
    if (paso === 7 && t.enlace && !/^https?:\/\/\S+$/i.test(t.enlace)) { av.textContent = 'El link debe empezar con https://'; return; }
    if (paso < N) return ir(paso + 1);

/* ---------- CRM ---------- */
function grupoDe(k) { return k === 'todos' ? GRUPO_TODOS : k === 'pruebas' ? GRUPO_PRUEBAS : ETAPA[k]; }
function capaCRM(c) {

  const grupos = ['todos'].concat(Object.keys(ETAPA).filter(e => e !== 'archivo' || base.some(p => p.etapa === e))).concat(pruebas.length ? ['pruebas'] : []);
  const de = k => k === 'todos' ? base : k === 'pruebas' ? pruebas : base.filter(p => (p.etapa || 'pendiente') === k);
  marco('CRM de MOON', 'Nuevo cliente', `<div class="cuerpo" style="grid-template-rows:auto minmax(0,1fr)">
    <label class="buscador">${I.lupa}<input id="busca" placeholder="Buscar cliente, teléfono o nota" enterkeyhint="search"></label>
    <div class="lista agenda desliza" id="resultados" hidden></div>
    <div class="etapas">${grupos.map(k => { const G = grupoDe(k), l = de(k); return `<button class="etapa" data-g="${k}" style="--c:${G.c};--cf:${G.cf}"><span class="et-cab"><b>${G.n}</b><i>${l.length}</i></span></button>`; }).join('')}</div></div>`);
  app.querySelectorAll('.etapa').forEach(b => b.onclick = () => abrir({ tipo: 'crmLista', g: b.dataset.g }));
  document.getElementById('accion').onclick = () => abrir({ tipo: 'nuevoCliente', etapa: 'pendiente' });
  const busca = document.getElementById('busca');
  // Busca desde la primera letra (nombre, negocio, teléfono, correo o nota) y sin importar acentos ni mayúsculas.
  const sinAc = x => String(x || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const res = document.getElementById('resultados'), cartas = app.querySelector('.etapas');
  const buscar = () => {
    const q = sinAc(busca.value.trim()); c.busca = busca.value;
    if (!q) { res.hidden = true; cartas.hidden = false; return; }
    const digitos = q.replace(/\D/g, '');
    const hay = base.concat(pruebas).filter(p => sinAc([p.nombre, p.negocio, p.correo, p.giro, p.necesidad, p.notas_equipo].join(' ')).includes(q) || (digitos.length >= 3 && String(p.telefono || '').replace(/\D/g, '').includes(digitos)));
    res.innerHTML = hay.length ? hay.map(p => filaPersona(p, true)).join('') : `<div class="vacio"><div><b>Nadie con “${esc(busca.value.trim())}”</b>Prueba con otra parte del nombre.</div></div>`;
    res.querySelectorAll('[data-p]').forEach(b => { b.onpointerdown = () => traerFicha(b.dataset.p); b.onclick = () => abrir({ tipo: 'ficha', tel: b.dataset.p }); });
    res.hidden = false; cartas.hidden = true;
  };
  busca.oninput = buscar; busca.onkeydown = e => { if (e.key === 'Enter') busca.blur(); };
  if (c.busca) { busca.value = c.busca; buscar(); }
  // Si una descripción no cabe completa en su tarjeta, se quita en todas (la descripción completa sale al abrirla). Nunca texto cortado.
  const acomoda = () => { const g = app.querySelector('.etapas'); if (!g) return;
    // Ninguna palabra se parte: si la más larga no cabe, la letra de TODAS las tarjetas baja igual hasta que quepa.
    const bs = [...g.querySelectorAll('.et-cab b')]; bs.forEach(b => b.style.fontSize = '');
    let t = parseFloat(getComputedStyle(bs[0]).fontSize);
    while (t > 12 && bs.some(b => b.scrollWidth > b.clientWidth + 1)) { t -= 1; bs.forEach(b => b.style.fontSize = t + 'px'); }
    // La última tarjeta se estira para cerrar su fila: nunca queda un hueco.
    const cols = getComputedStyle(g).gridTemplateColumns.split(' ').length, n = g.children.length, resto = n % cols;
    [...g.children].forEach(x => x.style.gridColumn = ''); if (resto) g.lastElementChild.style.gridColumn = `span ${cols - resto + 1}`;
 };
  acomoda(); alCambiarTamano = acomoda;
}

function activarFoto(alListo) {
  const inp = document.getElementById('fotoArchivo'); if (!inp) return;
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const L = 200, cv = document.createElement('canvas'); cv.width = cv.height = L; const x = cv.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, L, L);
      const k = Math.min(L / img.width, L / img.height), w = img.width * k, h = img.height * k; x.drawImage(img, (L - w) / 2, (L - h) / 2, w, h);
      const dato = cv.toDataURL('image/jpeg', .85); URL.revokeObjectURL(url);
      document.getElementById('fotoVista').innerHTML = `<img src="${dato}" alt="">`; alListo(dato);
    };
    img.onerror = () => { URL.revokeObjectURL(url); avisoFlotante('Esa imagen no se pudo abrir. Prueba con otra.'); };

// sel: las fases en las que va (posiciones). Las de antes de la más avanzada salen como hechas.
function estadoArcos(sel, n) { const max = Math.max(...sel); return Array.from({ length: n }, (_, i) => sel.includes(i) ? 'ahora' : i < max ? 'hecho' : ''); }
function textoAnillo(sel, n) { const max = Math.max(...sel); return { pct: Math.round(max / (n - 1) * 100), sub: sel.length > 1 ? `${sel.length} fases a la vez` : `fase ${max + 1} de ${n}` }; }
function anilloFases(sel) {
  const n = 6, R = 80, cx = 100, cy = 100, hueco = 0.12, arcos = [], est = estadoArcos(sel, n), tx = textoAnillo(sel, n);
  for (let i = 0; i < n; i++) {
    const a0 = -Math.PI / 2 + i * 2 * Math.PI / n + hueco / 2, a1 = a0 + 2 * Math.PI / n - hueco;
    const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0), x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    arcos.push(`<path class="arco ${est[i]}" d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke-width="18" fill="none" stroke-linecap="round"/>`);
  }
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Avance ${tx.pct}%">${arcos.join('')}<text id="anPct" x="100" y="98" text-anchor="middle" font-size="40" font-weight="800" fill="var(--tinta)" font-family="inherit">${tx.pct}%</text><text id="anSub" x="100" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="var(--suave)" font-family="inherit">${tx.sub}</text></svg>`;
}
let ajustaFases = null;
// Cambia las fases en la pantalla sin volver a dibujarla: todo al instante, en su mismo lugar.
function moverFases(sel, fases) {
  const n = fases.length, est = estadoArcos(sel, n), tx = textoAnillo(sel, n), suave = 'cubic-bezier(.4,0,.2,1)';

  if (svg) svg.setAttribute('aria-label', `Avance ${tx.pct}%`);
  if (pct) pct.textContent = tx.pct + '%';   // al instante: nada cuenta ni se desvanece
  if (sub) sub.textContent = tx.sub;
  const l = sel.map(i => fases[i]), nombre = app.querySelector('.avance .fase-n'), msg = app.querySelector('.avance .fase-m');

/* ---------- QR del enlace de un proyecto: se ve grande, se descarga o se manda ---------- */
let qrCargando = null;
function cargarQR() {
  if (window.qrcode) return Promise.resolve();
  return qrCargando || (qrCargando = new Promise((ok, mal) => { const s = document.createElement('script'); s.src = '/centro/qrcode.min.js'; s.onload = ok; s.onerror = () => { qrCargando = null; mal(new Error('qr')); }; document.head.appendChild(s); }));
}

  const n = q.getModuleCount(), m = 2; let d = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) d += `M${x + m} ${y + m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n + m * 2} ${n + m * 2}" shape-rendering="crispEdges" role="img" aria-label="Código QR"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#111"/></svg>`;
}
// Imagen lista para imprimir o mandar: el QR grande y el nombre del proyecto abajo.
function pngQR(q, titulo) {
  const n = q.getModuleCount(), cel = Math.floor(960 / (n + 8)), lado = cel * (n + 8), alto = lado + 150;
  const cv = document.createElement('canvas'); cv.width = lado; cv.height = alto; const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, lado, alto); g.fillStyle = '#111';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) g.fillRect((x + 4) * cel, (y + 4) * cel, cel, cel);
  g.textAlign = 'center'; g.font = '700 40px system-ui,-apple-system,sans-serif';
  let t = titulo; while (g.measureText(t).width > lado - 80 && t.length > 4) t = t.slice(0, -2).trim() + '…';
  g.fillText(t, lado / 2, lado + 40); g.font = '600 26px system-ui,-apple-system,sans-serif'; g.fillStyle = '#777'; g.fillText('MOON Digital', lado / 2, lado + 90);
  return new Promise(ok => cv.toBlob(ok, 'image/png'));
}
function capaQR(c) {
  if (!window.qrcode) { marco('QR', '', '<div class="vacio"><div><b>No se pudo preparar el QR</b>Revisa tu internet y vuelve a intentar.</div></div>'); return; }
  const q = matrizQR(c.url), archivo = `QR ${c.titulo}.png`.replace(/[\\/:*?"<>|]/g, '');
  marco(c.titulo, '', `<div class="hoja" style="grid-template-columns:minmax(0,1fr);align-content:center;justify-items:center">
    <div class="qr-caja"><div class="qr">${svgQR(q)}</div><span class="qr-url">${esc(c.url.replace(/^https:\/\//, ''))}</span>
    <div class="enlaces"><button class="boton" id="qrBajar">${I.subir.replace('<svg', '<svg style="transform:rotate(180deg)"')}Descargar</button><button class="boton dos" id="qrMandar">${I.enviar}Enviar</button></div>
    <span class="mini pista">Escanéalo con la cámara del celular para abrirlo</span></div></div>`);
  const bajar = async () => { const b = await pngQR(q, c.titulo), u = URL.createObjectURL(b), a = document.createElement('a'); a.href = u; a.download = archivo; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); };
  document.getElementById('qrBajar').onclick = bajar;

/* ---------- Documento guardado: se lee aquí, sin necesitar Claude ---------- */
let markedListo = null;
function cargarMarked() {
  if (window.marked) return Promise.resolve();
  return markedListo || (markedListo = new Promise((ok, mal) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js'; s.onload = ok; s.onerror = mal; document.head.appendChild(s); }));
}
function capaDocumento(c) {
  const d = c.doc;
  if (!d) { marco(c.titulo || 'Documento', '', '<div class="vacio"><div><b>No se pudo abrir</b>Revisa tu internet y vuelve a intentar.</div></div>'); return; }
  const enviar = d.compartir ? 'Enviar' : '';
  if (d.formato === 'html' || d.formato === 'link') {
    // Su propio diseño, aislado del Centro (no puede leer ni tocar nada de aquí). El servidor ya lo dejó listo para verse completo:
    // láminas y hojas una a la vez, del tamaño de la pantalla; lo demás ajustado al ancho (nunca deslizar a los lados).
    const pasos = d.formato === 'html' && d.modo && d.modo !== 'ancho';
    marco(d.titulo, enviar, `<div class="cuerpo" style="grid-template-rows:minmax(0,1fr)${pasos ? ' auto' : ''}"><div class="hoja visor" style="background:${d.formato === 'html' ? esc(d.fondo || '#fff') : '#fff'}"><iframe class="doc-html" title="${esc(d.titulo)}" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox${d.formato === 'link' ? ' allow-same-origin allow-forms' : ''}"></iframe></div>${pasos ? '<div class="pie"></div>' : ''}</div>`, I.enviar);
    const fr = app.querySelector('.doc-html'), pie = app.querySelector('.vista .pie');
    if (d.formato === 'link') fr.src = d.url; else fr.srcdoc = d.contenido;
    if (pasos) {
      c.lamina = c.lamina || 0;
      const ir = n => fr.contentWindow && fr.contentWindow.postMessage({ lamina: n }, '*');
      onmessage = e => {
        if (e.source !== fr.contentWindow || !e.data || typeof e.data.total !== 'number') return;
        c.lamina = e.data.lamina; const n = e.data.total;
        pieHojas(pie, c.lamina, n, ir);
      };
      fr.onload = () => ir(c.lamina);
    }
  } else if (d.formato === 'archivo') {
    const esPdf = /pdf/i.test(d.mime || '') || /\.pdf$/i.test(d.nombre || ''), esImg = /^image\//.test(d.mime || '');
    marco(d.titulo, enviar, `<div class="cuerpo" style="grid-template-rows:minmax(0,1fr)${esPdf ? ' auto' : ''}"><div class="hoja visor" id="hojaArch" style="background:#dfe2ea"></div>${esPdf ? '<div class="pie"></div>' : ''}</div>`, I.enviar);
    const hoja = document.getElementById('hojaArch'), pie = app.querySelector('.vista .pie');
    const mostrar = async () => {
      if (pila[pila.length - 1] !== c) return;
      if (esImg) { hoja.innerHTML = `<img src="${c.url}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain">`; return; }
      if (esPdf) {
        try {
          const v = await VisorArchivo.pdf(hoja, c.bytes, (i, n) => { c.hojaPdf = i; pie.innerHTML = n > 1 ? `<button class="redondo" data-pag="-1" aria-label="Anterior">${I.izq}</button><span class="pag">${i} de ${n}</span><button class="redondo" data-pag="1" aria-label="Siguiente">${I.der}</button>` : ''; pie.querySelectorAll('[data-pag]').forEach(b => b.onclick = () => v.ver(i + Number(b.dataset.pag))); });
          if (c.hojaPdf > 1) v.ver(c.hojaPdf); alCambiarTamano = () => v.redibuja();
        } catch (e) { hoja.innerHTML = '<div class="vacio"><div><b>No se pudo mostrar el PDF</b>Revisa tu internet y vuelve a abrirlo.</div></div>'; }
        return;
      }
      hoja.innerHTML = `<div class="vacio"><div><b>${esc(d.nombre || d.titulo)}</b>Este tipo de archivo no se puede ver aquí.<br><a class="boton" style="margin-top:12px;display:inline-flex" href="${c.url}" download="${esc(d.nombre || 'archivo')}">Descargar</a></div></div>`;
    };
    if (c.bytes) mostrar();
    else {
      hoja.innerHTML = '<div class="vacio"><div><b id="bajando">Abriendo…</b></div></div>';
      VisorArchivo.bajar(d.partes, n => api('archivo_parte', { id: d.id, n }).then(r => r.ok ? r.datos : Promise.reject()), (k, n) => { const b = document.getElementById('bajando'); if (b && n > 1) b.textContent = `Abriendo… ${Math.round(k / n * 100)}%`; })
        .then(bytes => { c.bytes = bytes; c.url = URL.createObjectURL(new Blob([bytes], { type: d.mime || 'application/octet-stream' })); mostrar(); })
        .catch(() => { if (pila[pila.length - 1] === c) hoja.innerHTML = '<div class="vacio"><div><b>No se pudo abrir</b>Revisa tu internet y vuelve a intentar.</div></div>'; });
    }
  } else {
    marco(d.titulo, enviar, `<div class="cuerpo" style="grid-template-rows:minmax(0,1fr) auto"><div class="hoja md" id="hojaMd"></div><div class="pie"></div></div>`, I.enviar);
    const hoja = document.getElementById('hojaMd'), pie = app.querySelector('.vista .pie');
    cargarMarked().then(() => {
      const temp = document.createElement('div'); temp.innerHTML = window.marked.parse(String(d.contenido || ''));
      temp.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
      const bloques = [...temp.children].map(e => e.outerHTML);
      function dibuja() {
        // Páginas por bloques completos: un párrafo o una tabla nunca se cortan a la mitad.
        const paginas = []; let actual = [];
        hoja.innerHTML = '';
        for (const b of bloques) {
          hoja.insertAdjacentHTML('beforeend', b);
          if (hoja.scrollHeight > hoja.clientHeight + 1 && actual.length) { hoja.lastElementChild.remove(); paginas.push(actual); actual = []; hoja.innerHTML = b; }
          actual.push(b);
        }
        if (actual.length) paginas.push(actual);
        c.p = Math.min(c.p || 0, paginas.length - 1);
        hoja.innerHTML = paginas[c.p].join('');
        pieHojas(pie, c.p, paginas.length, k => { c.p = k; dibuja(); });
        let x0 = null; hoja.ontouchstart = e => { x0 = e.touches[0].clientX; };
        hoja.ontouchend = e => { if (x0 == null || paginas.length < 2) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) { const k = c.p + (dx < 0 ? 1 : -1); if (k >= 0 && k < paginas.length) { c.p = k; dibuja(); } } };
      }
      dibuja(); alCambiarTamano = dibuja;
    }, () => { hoja.innerHTML = '<p>No se pudo mostrar el documento. Revisa tu internet.</p>'; });
  }
  if (enviar) document.getElementById('accion').onclick = () => compartir(d.titulo, d.compartir);
}

// Sombra de pantalla completa con un hueco exacto donde está el marco de adentro (ese hueco lo oscurece la página de adentro).
function veloFuera(ver, fr, color, alTocar) {
  let v = document.getElementById('veloFuera');
  if (!ver) { if (v) { v.style.opacity = '0'; v.style.pointerEvents = 'none'; setTimeout(() => { if (v.style.opacity === '0') v.remove(); }, 320); } return; }
  if (!v) { v = document.createElement('div'); v.id = 'veloFuera'; v.style.cssText = 'position:fixed;inset:0;z-index:50;opacity:0;transition:opacity .3s cubic-bezier(.22,.8,.24,1)'; document.body.appendChild(v); }
  const r = fr.getBoundingClientRect(), W = innerWidth, H = innerHeight;
  v.style.background = color || 'rgba(0,0,0,.4)';
  v.style.clipPath = `polygon(evenodd, 0 0, ${W}px 0, ${W}px ${H}px, 0 ${H}px, 0 0, ${r.left}px ${r.top}px, ${r.right}px ${r.top}px, ${r.right}px ${r.bottom}px, ${r.left}px ${r.bottom}px, ${r.left}px ${r.top}px)`;
  v.style.pointerEvents = 'auto'; v.onclick = alTocar;
  requestAnimationFrame(() => { v.style.opacity = '1'; });
}

// Acomoda las credenciales al tamaño más grande que quepa completo, sin scroll (1, 2 o 3 por renglón).
function acomodarCreds(cont) {
  const n = cont.children.length, gap = 12, W = cont.clientWidth, H = cont.clientHeight;
  let mejor = 0;
  for (let cols = 1; cols <= n; cols++) {
    const filas = Math.ceil(n / cols);
    const w = Math.min((W - (cols - 1) * gap) / cols, (H - (filas - 1) * gap) / filas * 86 / 54, 560);

  cont.style.setProperty('--hc', gap + 'px');
}

// Acomodar la foto nueva: se arrastra con un dedo y se acerca pellizcando o con la barrita.
function capaFoto(c) {
  marco('Acomoda tu foto', '', `<div class="cuerpo" style="grid-template-rows:minmax(0,1fr) auto auto auto">
    <div class="recorte" id="rec"><img id="img" alt="Tu foto nueva"></div>
    <label class="mini" style="display:flex;align-items:center;gap:10px">Acercar<input type="range" id="zoom" min="1" max="3" step="0.01" value="${c.s || 1}" style="flex:1;accent-color:var(--cobalto)"></label>
    <div class="botones"><button class="boton dos" id="cancelar">Cancelar</button><button class="boton" id="guardar">Usar esta foto</button></div>
    <div class="aviso" id="aviso" style="text-align:center"></div></div>`);
  const rec = document.getElementById('rec'), img = document.getElementById('img'), zoom = document.getElementById('zoom');
  c.s = c.s || 1; c.x = c.x || 0; c.y = c.y || 0;
  let base = 1;
  function limites() {
    const fw = rec.clientWidth, fh = rec.clientHeight, iw = img.naturalWidth * base * c.s, ih = img.naturalHeight * base * c.s;
    c.x = Math.max(-(iw - fw) / 2, Math.min((iw - fw) / 2, c.x));
    c.y = Math.max(-(ih - fh) / 2, Math.min((ih - fh) / 2, c.y));
  }
  function dibuja() {
    if (!img.naturalWidth) return;
    base = Math.max(rec.clientWidth / img.naturalWidth, rec.clientHeight / img.naturalHeight);
    limites();
    img.style.width = img.naturalWidth + 'px';
    img.style.transform = `translate(-50%,-50%) translate(${c.x}px,${c.y}px) scale(${base * c.s})`;
    zoom.value = c.s;
  }
  img.onload = dibuja; img.src = c.src;
  alCambiarTamano = dibuja;
  zoom.oninput = () => { c.s = Number(zoom.value); dibuja(); };
  const dedos = new Map(); let inicio = null;
  const escala = () => rec.offsetWidth / rec.getBoundingClientRect().width;   // de la pantalla al tamaño elegido
  rec.onpointerdown = e => { rec.setPointerCapture(e.pointerId); dedos.set(e.pointerId, [e.clientX, e.clientY]); inicio = null; };
  rec.onpointermove = e => {
    if (!dedos.has(e.pointerId)) return;
    const antes = dedos.get(e.pointerId); dedos.set(e.pointerId, [e.clientX, e.clientY]);
    const k = escala();
    if (dedos.size === 1) { c.x += (e.clientX - antes[0]) * k; c.y += (e.clientY - antes[1]) * k; }
    else if (dedos.size === 2) {
      const [a, b] = [...dedos.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (!inicio) inicio = { d, s: c.s }; else c.s = Math.max(1, Math.min(3, inicio.s * d / inicio.d));
    }
    dibuja();
  };
  rec.onpointerup = rec.onpointercancel = e => { dedos.delete(e.pointerId); inicio = null; };
  rec.onwheel = e => { e.preventDefault(); c.s = Math.max(1, Math.min(3, c.s * (e.deltaY < 0 ? 1.06 : 0.94))); dibuja(); };
  document.getElementById('cancelar').onclick = cerrar;
  document.getElementById('guardar').onclick = async () => {
    if (!img.naturalWidth) return;
    const b = document.getElementById('guardar'); b.disabled = true; b.textContent = 'Guardando…';
    const cv = document.createElement('canvas'); cv.width = 360; cv.height = 450;
    const k = 360 / rec.clientWidth, dw = img.naturalWidth * base * c.s * k, dh = img.naturalHeight * base * c.s * k;
    cv.getContext('2d').drawImage(img, 180 + c.x * k - dw / 2, 225 + c.y * k - dh / 2, dw, dh);
    const foto = cv.toDataURL('image/jpeg', 0.85);
    const r = await api('mi_perfil', { foto });
    if (r.ok) { Object.assign(FOTOS, await prepararFotos({ [yo()]: foto })); URL.revokeObjectURL(c.src); cerrar(); }
    else { b.disabled = false; b.textContent = 'Usar esta foto'; document.getElementById('aviso').textContent = 'No se pudo guardar. Intenta de nuevo.'; }
  };
}

  app.querySelectorAll('[data-ir]').forEach(b => { b.onclick = () => abrir({ tipo: b.dataset.ir }); b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); b.click(); } }; });

/* ---------- Recorrido de la primera vez: cada sección se explica en una línea, una a la vez ---------- */
const RECORRIDO = 'centro.moon.recorrido';
const PASOS_SOCIO = [
  ['[data-ir="tareas"]', 'Tareas', 'Lo que te toca a ti y lo de todo el equipo. Aquí también dejas una tarea nueva.'],
  ['[data-ir="crm"]', 'CRM', 'Todas las personas que nos han buscado, ordenadas por en qué van.'],
  ['[data-ir="clientes"]', 'Clientes', 'Solo los que ya nos pagan, y los que estamos por cerrar ("En camino").'],
  ['[data-ir="equipo"]', 'Equipo', 'Quién es quién, los embajadores, quién movió qué y la papelera.'],
  ['[data-ir="casa"]', 'Hecho en casa', 'Lo nuestro: la visión, Jason, la presentación y la página de MOON.'],
  ['[data-ir="demo"]', 'Crea tu recepcionista', 'Ármale un recepcionista a un cliente y mándale el link para que le hable.'],
  ['#salir', 'Tu credencial', 'Tu foto, tu frase y el tamaño de la letra. Aquí puedes volver a ver este recorrido.'],
];
const PASOS_EMB = [
  ['[data-ir="emComisiones"]', 'Mis comisiones', 'Los clientes que cerraste y cuánto ganas.'],
  ['[data-ir="demo"]', 'Crea tu recepcionista', 'Ármale uno a tu prospecto y mándale el link para que le hable.'],
  ['[data-ir="emProspectos"]', 'Mis prospectos', 'Los que probaron un recepcionista tuyo y en qué van.'],
  ['[data-ir="tareas"]', 'Mis tareas', 'Lo que te toca hacer; aparece aquí cuando un prospecto tuyo pide algo.'],
  ['[data-ir="emMaterial"]', 'Material de MOON', 'La presentación y la página para enseñarle a tu prospecto.'],
  ['#salir', 'Tu cuenta', 'El tamaño de la letra, cerrar sesión y volver a ver este recorrido.'],
];
const recorridoVisto = () => { try { const v = localStorage.getItem(RECORRIDO) || ''; return v === 'todos' || v.split(',').includes(yo()); } catch (e) { return true; } };
function marcarRecorrido() { try { const v = (localStorage.getItem(RECORRIDO) || '').split(',').filter(Boolean); if (!v.includes(yo())) v.push(yo()); localStorage.setItem(RECORRIDO, v.join(',')); } catch (e) {} }
function recorrido(desdeCero) {
  if (pila.length || document.getElementById('tour')) return;
  if (!desdeCero && recorridoVisto()) return;
  const pasos = (esEmb() ? PASOS_EMB : PASOS_SOCIO).filter(p => app.querySelector(p[0]));
  if (!pasos.length) return;
  let i = 0;
  const t = document.createElement('div'); t.id = 'tour'; t.setAttribute('role', 'dialog'); t.setAttribute('aria-label', 'Recorrido del tablero');
  t.innerHTML = '<div class="tour-velo"></div><div class="tour-aro"></div><div class="tour-globo"><span class="mini" id="tourPaso"></span><b id="tourTit"></b><p id="tourTxt"></p><div class="botones"><button class="boton dos" id="tourSalir">Ya entendí</button><button class="boton" id="tourSig">Siguiente</button></div></div>';
  document.body.appendChild(t);
  const velo = t.querySelector('.tour-velo'), aro = t.querySelector('.tour-aro'), globo = t.querySelector('.tour-globo');
  const fin = () => { marcarRecorrido(); t.remove(); removeEventListener('resize', dibuja); };
  function dibuja() {
    let el = app.querySelector(pasos[i][0]); if (!el) return fin();
    if (!parseFloat(getComputedStyle(el).borderTopLeftRadius) && el.children.length === 1) el = el.firstElementChild;   // la foto redonda dentro del botón
    const r = el.getBoundingClientRect(), W = innerWidth, H = (window.visualViewport ? visualViewport.height : innerHeight), m = 6;
    const x0 = Math.max(4, r.left - m), y0 = Math.max(4, r.top - m), x1 = Math.min(W - 4, r.right + m), y1 = Math.min(H - 4, r.bottom + m);
    // El hueco tiene la misma forma que lo que marca (redondo si es redondo): nunca un rectángulo de esquinas duras.
    const z = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--z')) || 1;
    const rad = parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0, redondo = Math.abs(r.width - r.height) < 2 && rad * z >= r.width / 2 - 1;
    Object.assign(aro.style, { left: x0 + 'px', top: y0 + 'px', width: (x1 - x0) + 'px', height: (y1 - y0) + 'px', borderRadius: redondo ? '50%' : (rad * z + m) + 'px' });
    document.getElementById('tourPaso').textContent = `${i + 1} de ${pasos.length}`;
    document.getElementById('tourTit').textContent = pasos[i][1];
    document.getElementById('tourTxt').textContent = pasos[i][2];
    document.getElementById('tourSig').textContent = i === pasos.length - 1 ? 'Listo' : 'Siguiente';
    // El globo va donde haya más espacio (abajo o arriba del recuadro), siempre completo dentro de la pantalla.
    const gw = Math.min(W - 24, 380); globo.style.width = gw + 'px'; globo.style.left = Math.round((W - gw) / 2) + 'px';
    const gh = globo.offsetHeight, abajo = H - y1, arriba = y0;
    let top = abajo >= gh + 12 ? y1 + 10 : arriba >= gh + 12 ? y0 - gh - 10 : Math.max(8, H - gh - 8);
    globo.style.top = Math.round(Math.max(8, Math.min(H - gh - 8, top))) + 'px';
  }
  t.querySelector('#tourSig').onclick = () => { if (i < pasos.length - 1) { i++; dibuja(); } else fin(); };
  t.querySelector('#tourSalir').onclick = fin;
  t.onclick = e => { if (e.target === t || e.target === velo) e.stopPropagation(); };   // tocar afuera no hace nada raro
  addEventListener('resize', dibuja);
  dibuja();
}
