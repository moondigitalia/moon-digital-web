<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<title>Centro MOON</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3efe9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171b" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#f3efe9; --tarjeta:#f6f3ee; --campo:#ece7e0; --tinta:#1d1d22; --suave:#5d5d66; --tenue:#8b8a92; --linea:rgba(29,29,34,.08);
  --cobalto:#0b4fd6; --cobalto2:#0a44b8; --cielo:#5b9cf5; --niebla:#cfd6e2; --marfil:#ece4d8; --carbon:#2b2b30;
  --sombra:0 14px 28px -12px rgba(120,105,85,.35),0 2px 6px rgba(120,105,85,.10),inset 0 1px 0 rgba(255,255,255,.85);
  --sombra-chica:0 6px 14px -6px rgba(120,105,85,.35),inset 0 1px 0 rgba(255,255,255,.8);
  --hundido:inset 0 2px 5px rgba(120,105,85,.22),inset 0 -1px 0 rgba(255,255,255,.7);
  --naranja:#e8892f; --naranjaf:#fdf0e3; --verde:#2f9e5a; --verdef:#e6f4ea; --rojo:#d9534a; --rojof:#fbe9e7; --azulf:#e4ecfb; --moradof:#ece9fb; --morado:#6a55d8;
  --ease:cubic-bezier(.22,.8,.24,1); --r:28px;
}
@media (prefers-color-scheme:dark){:root{
  --fondo:#16171b; --tarjeta:#1d1e23; --campo:#25262c; --tinta:#efedea; --suave:#b3b1b8; --tenue:#85848c; --linea:rgba(255,255,255,.07);
  --cobalto:#3a78ff; --cobalto2:#2f69eb; --cielo:#78aefc; --niebla:#3a3f4a; --marfil:#3a3631; --carbon:#d9d7d3;
  --sombra:0 14px 28px -12px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);
  --sombra-chica:0 6px 14px -6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
  --hundido:inset 0 2px 5px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.04);
  --naranja:#f2a052; --naranjaf:#3a2a1a; --verde:#5cc283; --verdef:#183026; --rojo:#ef7b72; --rojof:#3a1f1d; --azulf:#1c2740; --moradof:#272241; --morado:#a493ff;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--fondo);color:var(--tinta);font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;border:0;background:none}
input,select,textarea{font-size:16px;min-width:0}
.buscador input{width:0}   /* 16px o más: el iPhone ya no hace zoom solo al tocar un campo */
button{cursor:pointer}
[hidden]{display:none!important}
/* La página nunca se mueve: el marco ocupa exactamente lo que se ve (y se encoge cuando sube el teclado). */
#marco{position:fixed;left:0;right:0;top:var(--vt,0px);height:var(--vh,100%);overflow:hidden}
.app{zoom:var(--z,1);height:calc(var(--vh,100vh) / var(--z,1));max-width:1180px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:clamp(10px,calc(1.8 * var(--u)),16px)}
.eti{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--suave)}
.top{display:flex;align-items:center;gap:12px;min-height:44px}
.marca{display:flex;align-items:center;gap:10px;font-size:clamp(12px,calc(3.4 * var(--w)),15px);font-weight:800;letter-spacing:.3em;white-space:nowrap}
.logo{display:inline-block;height:clamp(24px,calc(6.6 * var(--w)),32px);aspect-ratio:2496/682;background:currentColor;-webkit-mask:url(logo.svg) center/contain no-repeat;mask:url(logo.svg) center/contain no-repeat}
.marca i{font-style:normal;color:var(--cobalto);font-weight:600;letter-spacing:0}
.top .esp{flex:1}
.redondo{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:inherit;text-decoration:none;background:var(--tarjeta);box-shadow:var(--sombra-chica);flex:none;transition:transform .25s var(--ease)}
.redondo:active{transform:scale(.94)}
.redondo svg{width:20px;height:20px}
.ava{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:none;background:var(--c,var(--cobalto))}
.ava.chico{width:26px;height:26px;font-size:11px;border:2px solid var(--tarjeta)}
.avas{display:flex}.avas .ava.chico+.ava.chico{margin-left:-8px}
.vista{min-height:0;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:clamp(8px,calc(1.6 * var(--u)),14px)}
/* Cambio de pantalla con fundido cruzado (la anterior se desvanece mientras entra la nueva): igual con o sin "reducir movimiento". */
/* Fundido propio: la pantalla anterior queda ENCIMA y se desvanece sobre la nueva, que ya está completa debajo. */
.fantasma{position:absolute!important;top:0;left:0;right:0;pointer-events:none;z-index:5}

/* ---------- Inicio ---------- */
.hola{font-size:clamp(22px,calc(6.4 * var(--w)),34px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.hola small{display:block;font-size:13px;font-weight:600;color:var(--suave);letter-spacing:0;margin-top:4px}
.mosaico{min-height:0;display:grid;gap:clamp(9px,calc(1.5 * var(--u)),14px);grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:1.35fr 1fr 1fr .5fr;grid-template-areas:"tuyo tuyo" "crm proy" "equipo moon" "ultimo ultimo"}
.t{position:relative;min-height:0;border-radius:var(--r);background:var(--tarjeta);box-shadow:var(--sombra);padding:clamp(12px,calc(2 * var(--u)),18px) 16px;text-align:start;display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:transform .3s var(--ease)}
.t:active{transform:scale(.985)}
.t .num{font-size:clamp(28px,calc(7.5 * var(--u)),52px);font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:auto}
.t .sub{font-size:13px;line-height:1.25;color:var(--suave);font-weight:600}
.t>.eti{padding-right:34px;line-height:1.3}
.t .flecha{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--fondo);box-shadow:var(--hundido)}
.t .flecha svg{width:15px;height:15px}
.t-tuyo{grid-area:tuyo;background:var(--cobalto);color:#fff;box-shadow:0 18px 30px -14px rgba(11,79,214,.65),inset 0 1px 0 rgba(255,255,255,.25)}
.t-tuyo .eti,.t-tuyo .sub{color:rgba(255,255,255,.82)}
.t-tuyo .flecha{background:rgba(255,255,255,.16);box-shadow:none}
.t-crm{grid-area:crm}.t-proy{grid-area:proy}.t-equipo{grid-area:equipo}.t-moon{grid-area:moon}
.t-ultimo{grid-area:ultimo;flex-direction:row;align-items:center;gap:12px;padding:10px 16px}
.t-ultimo .txt{min-width:0;font-size:13px;line-height:1.3;font-weight:600;color:var(--suave)}
.t-ultimo .txt b{color:var(--tinta)}
.brilla{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:#fff;color:var(--cobalto);font-weight:800;font-size:12px;border-radius:99px;padding:5px 11px 5px 6px}
.brilla i{width:18px;height:18px;border-radius:50%;background:var(--cobalto);color:#fff;display:grid;place-items:center;font-style:normal;font-size:11px}
.latido{animation:latido 2.4s ease-in-out infinite}
@keyframes latido{0%,100%{opacity:1}50%{opacity:.55}}
.barrita{display:flex;gap:4px;height:6px;margin-top:4px}
.barrita i{flex:var(--n);border-radius:9px;background:var(--c)}

/* ---------- Capas ---------- */
.cabeza{display:flex;align-items:center;gap:12px;min-height:44px}
.cabeza h2{font-size:clamp(17px,calc(5 * var(--w)),26px);line-height:1.15;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0;overflow-wrap:anywhere}
.cabeza .accion{background:var(--cobalto);color:#fff;box-shadow:0 10px 18px -8px rgba(11,79,214,.6)}
.cuerpo{min-height:0;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:10px}
.pils{display:flex;gap:7px;flex-wrap:wrap}
.pil{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:7px 13px 7px 8px;font-size:13px;font-weight:700;background:var(--tarjeta);box-shadow:var(--sombra-chica);color:var(--suave);transition:background .25s,color .25s}
.pil i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--c,var(--tenue))}
.pil.on{background:var(--cf,var(--cobalto));color:var(--c,#fff)}
.pil.on i{background:var(--c,#fff);color:var(--cf,var(--cobalto))}
.pil.solo{padding:7px 13px}
.lista{min-height:0;display:grid;align-content:start;gap:var(--hueco,9px);grid-template-columns:minmax(0,1fr)}
.fila{min-height:var(--alto,64px);padding-top:10px!important;padding-bottom:10px!important;border-radius:22px;background:var(--tarjeta);box-shadow:var(--sombra-chica);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:0 14px;text-align:start;width:100%;transition:transform .25s var(--ease)}
.fila:active{transform:scale(.985)}
.fila .q{min-width:0}
.fila .q b{display:block;font-size:15px;line-height:1.25;font-weight:700;overflow-wrap:anywhere}
.fila .q span{display:block;font-size:12.5px;line-height:1.3;color:var(--suave);font-weight:600;overflow-wrap:anywhere;margin-top:2px}
.punto{width:12px;height:12px;border-radius:50%;background:var(--c,var(--niebla))}
.nueva{background:var(--azulf);box-shadow:var(--sombra-chica),inset 0 0 0 2px var(--cobalto)}
.estado{font-size:11.5px;font-weight:800;border-radius:99px;padding:4px 10px;background:var(--cf);color:var(--c);white-space:nowrap}
.pie{display:flex;align-items:center;justify-content:center;gap:12px;min-height:44px}
.pie .pag{font-size:13px;font-weight:700;color:var(--suave);min-width:56px;text-align:center}
.vacio{display:grid;place-items:center;text-align:center;color:var(--suave);font-weight:600;padding:20px;border-radius:var(--r);background:var(--tarjeta);box-shadow:var(--hundido);height:100%}
.vacio b{display:block;color:var(--tinta);font-size:17px;margin-bottom:4px}
.buscador{display:flex;align-items:center;gap:10px;height:44px;border-radius:99px;background:var(--campo);box-shadow:var(--hundido);padding:0 16px}
.buscador input{flex:1;min-width:0;outline:none;height:100%}
.buscador svg{width:18px;height:18px;color:var(--tenue)}

/* Ficha / formularios */
.hoja{min-height:0;border-radius:var(--r);background:var(--tarjeta);box-shadow:var(--sombra);padding:16px;display:grid;align-content:start;gap:12px;overflow:hidden}
.par{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center;font-size:14px}
.par>span{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--tenue)}
.par>b{font-weight:600;overflow-wrap:anywhere}
.campo{width:100%;height:46px;border-radius:99px;background:var(--campo);box-shadow:var(--hundido);padding:0 18px;outline:none}
textarea.campo{height:auto;border-radius:22px;padding:14px 18px;resize:none}
.campo:focus{box-shadow:var(--hundido),0 0 0 2px var(--cielo)}
.boton{height:50px;border-radius:99px;font-weight:800;font-size:15px;padding:0 24px;background:var(--cobalto);color:#fff;box-shadow:0 12px 20px -10px rgba(11,79,214,.7),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .25s var(--ease),opacity .25s}
.boton:active{transform:scale(.97)}
.boton.dos{background:var(--tarjeta);color:var(--tinta);box-shadow:var(--sombra-chica)}
.boton[disabled]{opacity:.55}
.botones{display:flex;gap:10px;flex-wrap:wrap}
.botones .boton{flex:1 1 140px}
.quien{display:flex;gap:10px;flex-wrap:wrap}
.quien button{display:flex;align-items:center;gap:8px;border-radius:99px;padding:5px 14px 5px 5px;background:var(--tarjeta);box-shadow:var(--sombra-chica);font-weight:700;font-size:14px;opacity:.6;transition:opacity .25s,box-shadow .25s}
.quien button .ava{width:30px;height:30px;font-size:12px}
.quien button.on{opacity:1;box-shadow:var(--sombra-chica),inset 0 0 0 2px var(--cobalto)}
.fases{display:grid;gap:clamp(4px,calc(1 * var(--u)),10px);justify-self:center;width:min(100%,320px)}
.fases button{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700;color:var(--tenue);text-align:start}
.fases button i{width:30px;height:30px;border-radius:50%;background:var(--campo);box-shadow:var(--hundido);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800}
.fases button.hecha i{background:var(--cielo);color:#fff;box-shadow:none}
.fases button.on{color:var(--tinta)}
.fases button.on i{background:var(--cobalto);color:#fff;box-shadow:0 8px 14px -6px rgba(11,79,214,.7)}
.anillo{--p:0;width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--cobalto) calc(var(--p)*1%),var(--niebla) 0);display:grid;place-items:center;flex:none}
.anillo b{width:30px;height:30px;border-radius:50%;background:var(--tarjeta);display:grid;place-items:center;font-size:11px;font-weight:800}
.aviso{font-size:13px;font-weight:700;color:var(--rojo);min-height:18px}
.aviso.bien{color:var(--verde)}
.tabs{display:flex;gap:4px;background:var(--campo);box-shadow:var(--hundido);border-radius:99px;padding:4px}
.tabs button{flex:1 1 auto;min-width:0;padding:0 6px;min-height:36px;line-height:1.1;border-radius:99px;font-weight:700;font-size:13px;color:var(--suave);transition:background .25s,color .25s}
.tabs button.on{background:var(--tarjeta);color:var(--cobalto);box-shadow:var(--sombra-chica)}
.ancho{grid-column:1/-1}
.mini{font-size:12px;color:var(--suave);font-weight:600}

/* Entrada */
.entrada{height:100%;min-height:0;display:grid;place-items:center}
.entrada .caja{width:min(420px,100%);display:grid;gap:16px;justify-items:center;text-align:center}
.entrada h1{font-size:clamp(22px,calc(6 * var(--w)),28px);font-weight:800;letter-spacing:-.01em}
.entrada p{color:var(--suave);font-weight:600;font-size:14px}
.gente{display:flex;gap:clamp(12px,calc(4 * var(--w)),22px);justify-content:center}
.gente button{display:grid;justify-items:center;gap:8px;font-weight:800;font-size:15px}
.gente .ava{width:clamp(72px,calc(21 * var(--w)),92px);height:clamp(72px,calc(21 * var(--w)),92px);font-size:26px;box-shadow:var(--sombra);transition:transform .3s var(--ease)}
.gente button:active .ava{transform:scale(.95)}
.conojo{position:relative;display:block;width:100%}
.conojo .campo{padding-right:54px}
.ojo{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--suave)}
.ojo svg{width:20px;height:20px}
.codigo{letter-spacing:.5em;text-align:center;font-size:22px;font-weight:800}
.enlace{font-weight:700;color:var(--cobalto);font-size:14px}

/* Tarjetas del inicio que se llenan solas: lo que cabe se muestra; lo que no, se queda adentro de la capa */
.t{cursor:pointer}
.extra{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:hidden;margin-top:4px}
.xi{display:flex;align-items:center;gap:8px;text-align:start;font-size:13.5px;font-weight:700;line-height:1.25;padding:7px 10px;border-radius:14px;background:var(--fondo);box-shadow:var(--hundido);flex:none}
.xi small{font-weight:600;color:var(--suave);margin-left:auto;padding-left:6px;white-space:nowrap}
.xi .punto{flex:none;width:10px;height:10px}
.xi .q{min-width:0}
.t-tuyo .xi{background:rgba(255,255,255,.14);box-shadow:none;color:#fff}
.t-tuyo .xi small{color:rgba(255,255,255,.8)}
.t-tuyo .xi.nueva{background:#fff;color:var(--cobalto)}
.t-tuyo .xi.nueva small{color:var(--cobalto)}
.xmas{font-size:12px;font-weight:800;color:var(--suave);flex:none}
.t-tuyo .xmas{color:rgba(255,255,255,.85)}
.xtxt{font-size:clamp(13px,calc(1.9 * var(--u)),16px);font-weight:700;line-height:1.35;color:var(--suave);flex:none}
/* Anillo de fases */
.avance{display:grid;justify-items:center;gap:clamp(6px,calc(1.4 * var(--u)),12px);text-align:center}
.avance svg{width:min(230px,calc(52 * var(--w)),calc(26 * var(--u)));height:auto;overflow:visible}
.avance .fase-n{font-size:clamp(22px,calc(4 * var(--u)),30px);font-weight:800;letter-spacing:-.01em}
.avance .fase-m{font-weight:700;color:var(--suave);max-width:34ch}
.actual{animation:latido 2.4s ease-in-out infinite}
.icono{position:relative;flex:none;border-radius:50%;background:var(--c);color:#fff;font-weight:800;display:grid;place-items:center;overflow:hidden}
.icono img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.icono img.logo-c{object-fit:contain;padding:7%}.icono img.en-color{background:var(--c);padding:0}
.icono.duo{background:transparent;border-radius:0;overflow:visible;display:flex;align-items:flex-end;gap:2px;width:auto!important}
.icono.duo img{position:static;width:auto;height:100%;object-fit:contain;background:none}
.demo{position:relative;min-height:0;border-radius:var(--r);overflow:hidden;background:var(--c);box-shadow:var(--sombra);display:grid;grid-template-rows:auto auto;align-content:end;gap:10px;padding:clamp(16px,calc(2.6 * var(--u)),26px);color:#fff;container-type:size}
.demo-logo{--lg:min(40cqh,36cqw,230px);position:absolute;width:var(--lg);height:var(--lg);right:max(18px,8cqw);top:max(16px,7cqh)}
.ancho .demo-logo{--lg:min(56cqh,30cqw,260px);top:50%;margin-top:calc(var(--lg) * -.5);right:12cqw}
.demo-logo::before,.demo-logo::after{content:"";position:absolute;left:50%;top:50%;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);transform:translate(-50%,-50%);pointer-events:none}
.demo-logo::before{width:calc(var(--lg) * 1.55);height:calc(var(--lg) * 1.55)}
.demo-logo::after{width:calc(var(--lg) * 2.25);height:calc(var(--lg) * 2.25);border-color:rgba(255,255,255,.12)}
.demo-logo .icono{width:var(--lg);height:var(--lg);font-size:calc(var(--lg) * .42);box-shadow:0 0 0 5px rgba(255,255,255,.22)}
.demo-logo .icono.duo{box-shadow:none}
.demo-info{position:relative;display:grid;gap:2px}
.demo-info .eti{color:rgba(255,255,255,.78)}
.demo-info b{display:block;font-size:clamp(22px,calc(3.6 * var(--u)),34px);font-weight:800;line-height:1.1}
.demo-info span:last-child{font-size:13px;font-weight:700;opacity:.82}
.demo-botones{position:relative;display:flex;align-items:center;gap:10px}
.demo-boton{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#18204a}
.demo-boton svg{width:16px;height:16px}
.demo-enviar{background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
.rects>:last-child:nth-child(odd),.lista.dos>:last-child:nth-child(odd):not(:only-child),.casa-filas>:last-child:nth-child(odd){grid-column:1/-1}
.rects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ancho .rects{grid-template-columns:repeat(4,minmax(0,1fr))}
.bajo .rect{padding:9px 12px}
.rect{border-radius:22px;background:var(--tarjeta);box-shadow:var(--sombra-chica);padding:12px 14px;text-align:start;display:grid;gap:3px;align-content:start;transition:transform .25s var(--ease)}
.rect:active{transform:scale(.98)}
.rect b{font-size:15px;font-weight:800}
.rect span{font-size:12.5px;font-weight:600;color:var(--suave);line-height:1.3}

<script>
'use strict';
const API = '/api/centro';
const LLAVE = 'centro.moon.sesion';
const GENTE = { daniel: { n: 'Daniel', c: '#2b2b30', i: 'D' }, dan: { n: 'Dan', c: '#3f86ee', i: 'Dn' }, kid: { n: 'Kid', c: '#0b4fd6', i: 'K' } };
const ETAPA = {
  'pendiente':  { n: 'Pendientes', c: 'var(--naranja)', cf: 'var(--naranjaf)', ic: '◷', d: 'Nos buscaron o los buscamos, pero todavía no hay trato.' },
  'en proceso': { n: 'En proceso', c: 'var(--cobalto)', cf: 'var(--azulf)',   ic: '↻', d: 'Ya estamos platicando una propuesta con ellos.' },
  'cerrado':    { n: 'Cerrados',   c: 'var(--verde)',   cf: 'var(--verdef)',  ic: '✓', d: 'Ya firmaron y pagaron. Estamos construyendo lo suyo.' },
  'en órbita':  { n: 'En órbita',  c: 'var(--morado)',  cf: 'var(--moradof)', ic: '◎', d: 'Ya se lo entregamos y nos pagan mantenimiento cada mes. Hay que cuidarlos de cerca.' },
  'portafolio': { n: 'Portafolio', c: 'var(--suave)',   cf: 'var(--campo)',   ic: '★', d: 'Ya se lo entregamos y no lleva mantenimiento. Es el registro de lo que hemos hecho.' },
  'archivo':    { n: 'Archivo',    c: 'var(--rojo)',    cf: 'var(--rojof)',   ic: '×', d: 'Dijeron que no, por ahora. Se guardan por si regresan.' },
};
const GRUPO_TODOS = { n: 'Todos', c: 'var(--tinta)', cf: 'var(--campo)', ic: '●', d: 'Todas las personas y negocios que tenemos, estén en la etapa que estén.' };
const GRUPO_PRUEBAS = { n: 'Pruebas', c: 'var(--suave)', cf: 'var(--campo)', ic: '⚙', d: 'Llamadas de prueba de nosotros mismos. No cuentan como clientes.' };
const ROL = { daniel: 'Ideas y dirección', dan: 'Ventas y llamadas', kid: 'Construye y diseña' };
const FASE_TXT = {
  'por arrancar': 'Todo listo para arrancar. Lo primero: juntar la información.',
  'información': 'Estamos entendiendo al cliente. Lo que sigue: el diseño.',
  'diseño': 'Ya se está viendo cómo va a quedar. Lo que sigue: construirlo.',
  'construcción': 'Manos a la obra. Lo que sigue: probarlo.',
  'pruebas': '¡Ya casi! Solo falta entregarlo.',
  'entregado': '¡Entregado! Uno más para MOON.',
};
const TEMP = { caliente: 'var(--rojo)', tibio: 'var(--naranja)', frio: 'var(--cielo)' };
const I = {
  atras: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  mas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  abre: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>',
  izq: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  der: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  tel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',

  ojoNo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7c1.9 0 3.6-.6 5-1.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',

  lupa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
};

let D = null;           // todo lo que manda el servidor
let pila = [];          // capas abiertas: [{tipo, ...}]
let estado = { tareas: 'mias', crm: 'pendiente', proy: 'todos', busca: '' };
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sesionGuardada = () => { try { return localStorage.getItem(LLAVE) || ''; } catch (e) { return ''; } };
const guardarSesion = v => { try { v ? localStorage.setItem(LLAVE, v) : localStorage.removeItem(LLAVE); } catch (e) {} };

async function api(accion, datos) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-sesion': sesionGuardada() }, body: JSON.stringify(Object.assign({ accion }, datos || {})) })
    .catch(() => null);
  if (!r) return { ok: false, error: 'red' };
  const j = await r.json().catch(() => ({ ok: false, error: 'red' }));
  if (r.status === 401 && j.error === 'sesion') { guardarSesion(''); D = null; pila = []; pantallaQuien(); }
  return j;
}

const CLAUDE = { n: 'Claude', c: '#c96442', i: 'C' };
let FOTOS = {};   // caras del equipo: llegan solo después de entrar
const FOTOS_LISTAS = [];   // se guardan aquí ya decodificadas para que cada pantalla nueva las muestre al instante
async function prepararFotos(mapa) {
  const out = {};
  await Promise.all(Object.entries(mapa).map(async ([id, src]) => {
    try {
      const url = URL.createObjectURL(await (await fetch(src)).blob());
      const im = new Image(); im.src = url; await im.decode(); FOTOS_LISTAS.push(im); out[id] = url;
    } catch (e) { out[id] = src; }
  }));

/* ---------- Paginado: nunca scroll. Lo que no cabe pasa a la siguiente página. ---------- */
function paginar(cont, items, pinta, opciones) {
  const o = Object.assign({ alto: 64, hueco: 9, vacio: '<b>Nada por aquí</b>Todo en orden.' }, opciones || {});
  const lista = cont.querySelector('.lista'), pie = cont.querySelector('.pie');
  lista.style.setProperty('--alto', o.alto + 'px'); lista.style.setProperty('--hueco', o.hueco + 'px');
  const clave = o.clave || 'p';
  let pagina = o.pagina || 0;
  function dibuja() {
    if (!items.length) { lista.innerHTML = `<div class="vacio"><div>${o.vacio}</div></div>`; pie.innerHTML = ''; return; }
    lista.innerHTML = '';
    const H = lista.clientHeight;
    const cols = getComputedStyle(lista).gridTemplateColumns.split(' ').length || 1;
    // Se mide cada renglón ya con su texto completo (nada se corta) y se reparten en páginas que sí caben.
    const m = document.createElement('div');
    m.className = lista.className;
    m.style.cssText = `position:absolute;left:0;top:0;visibility:hidden;width:${lista.clientWidth}px;height:auto;--alto:${o.alto}px;--hueco:${o.hueco}px`;
    m.innerHTML = items.map(pinta).join('');
    cont.style.position = 'relative';
    cont.appendChild(m);
    const altos = [...m.children].map(e => e.offsetHeight);
    m.remove();
    const paginas = []; let actual = [], usado = 0;
    for (let i = 0; i < items.length; i += cols) {
      const fila = altos.slice(i, i + cols), alto = Math.max(...fila);
      let suma = alto + (actual.length ? o.hueco : 0);
      if (actual.length && usado + suma > H + 0.5) { paginas.push(actual); actual = []; usado = 0; suma = alto; }
      for (let k = i; k < Math.min(i + cols, items.length); k++) actual.push(k);
      usado += suma;
    }
    if (actual.length) paginas.push(actual);
    const total = paginas.length;
    pagina = Math.min(pagina, total - 1);
    lista.innerHTML = paginas[pagina].map(k => pinta(items[k])).join('');
    const aqui = paginas[pagina], rango = aqui.length > 1 ? `${aqui[0] + 1}–${aqui[aqui.length - 1] + 1}` : `${aqui[0] + 1}`;
    pie.innerHTML = total > 1 ? `<button class="redondo" data-pag="-1" aria-label="Anterior">${I.izq}</button><span class="pag">${rango} de ${items.length}</span><button class="redondo" data-pag="1" aria-label="Siguiente">${I.der}</button>` : '';
    pie.querySelectorAll('[data-pag]').forEach(b => b.onclick = () => { pagina = (pagina + Number(b.dataset.pag) + total) % total; recordar(); dibuja(); });
    let x0 = null;
    lista.ontouchstart = e => { x0 = e.touches[0].clientX; };
    lista.ontouchend = e => { if (x0 == null || total < 2) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) { pagina = (pagina + (dx < 0 ? 1 : -1) + total) % total; recordar(); dibuja(); } };
    o.alPintar && o.alPintar(lista);

}

// Cada tarjeta muestra los renglones que le caben completos; los demás se resumen en "+N más" (están adentro de la tarjeta).
function llenarExtras() {
  app.querySelectorAll('.extra').forEach(x => {
    const total = x.children.length; let quitados = 0;
    while (x.lastElementChild && x.scrollHeight > x.clientHeight + 1) { x.lastElementChild.remove(); quitados++; }
    if (quitados && total) {
      const mas = document.createElement('span'); mas.className = 'xmas'; x.appendChild(mas);
      const pon = () => { mas.textContent = `+ ${quitados} más adentro`; };
      pon();
      while (x.scrollHeight > x.clientHeight + 1 && x.children.length > 1) { x.children[x.children.length - 2].remove(); quitados++; pon(); }
      if (x.scrollHeight > x.clientHeight + 1) mas.remove();
    }
    if (!x.children.length) x.style.display = 'none';   // vacía no ocupa lugar
  });
  app.querySelectorAll('.mosaico .t').forEach(t => {
    for (const sel of ['.extra', '.barrita', '.sub', '.brilla']) {
      if (t.scrollHeight <= t.clientHeight + 1) break;
      const e = t.querySelector(sel); if (e) e.style.display = 'none';
    }
  });
}

function anilloFases(fi) {
  const n = 6, R = 80, cx = 100, cy = 100, hueco = 0.12, arcos = [];
  for (let i = 0; i < n; i++) {
    const a0 = -Math.PI / 2 + i * 2 * Math.PI / n + hueco / 2, a1 = a0 + 2 * Math.PI / n - hueco;
    const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0), x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    const col = i < fi ? 'var(--cobalto)' : i === fi ? 'var(--cielo)' : 'var(--niebla)';
    arcos.push(`<path${i === fi ? ' class="actual"' : ''} d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${col}" stroke-width="18" fill="none" stroke-linecap="round"/>`);
  }
  const pct = Math.round(fi / (n - 1) * 100);
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Avance ${pct}%">${arcos.join('')}<text x="100" y="98" text-anchor="middle" font-size="40" font-weight="800" fill="var(--tinta)" font-family="inherit">${pct}%</text><text x="100" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="var(--suave)" font-family="inherit">fase ${fi + 1} de ${n}</text></svg>`;
}

const CANAL = { llamada: 'Llamada', whatsapp: 'WhatsApp', chat: 'Chat', voz: 'Voz', avatar: 'Avatar', cuestionario: 'Cuestionario', web: 'Página', otro: 'Uso' };
function pintaUso(c, p) {
  const cont = app.querySelector('.vista .cuerpo .cuerpo');
  if (!c.uso) {
    cont.querySelector('.lista').innerHTML = '<div class="vacio"><div>Cargando…</div></div>';
    api('uso', { id: p.id }).then(r => { if (r.ok && pila[pila.length - 1] === c) { c.uso = r; pinta(true); } });
    return;
  }
  const U = c.uso, k = U.cifras || {};
  cont.querySelector('#cifras').innerHTML = [['Hoy', k.hoy], ['7 días', k.semana], ['30 días', k.mes], ['Personas', k.personas]]
    .map(([n, v]) => `<div class="cifra"><b>${v || 0}</b><span>${n}</span></div>`).join('');
  // Una barrita por día de las últimas 4 semanas (hora de Cancún); la de hoy va en cobalto.
  const mapa = Object.fromEntries((U.porDia || []).map(x => [x.d, x.n]));
  const dias = [];
  for (let i = 27; i >= 0; i--) { const d = new Date(Date.now() - 5 * 36e5 - i * 864e5).toISOString().slice(0, 10); dias.push([d, mapa[d] || 0]); }
  const max = Math.max(1, ...dias.map(x => x[1]));
  cont.querySelector('#barras').innerHTML = `<div class="barras-in">${dias.map(([d, n], i) => `<i title="${d}: ${n}" style="--h:${Math.max(4, Math.round(n / max * 100))}%${i === 27 ? ';--c:var(--cobalto)' : n ? '' : ';--c:var(--niebla)'}"></i>`).join('')}</div><div class="barras-pie"><span>hace 4 semanas</span><span>hoy</span></div>`;
  const vacio = U.conectado
    ? '<b>Todavía nadie lo ha usado</b>En cuanto alguien lo use, aparece aquí al momento.'
    : '<b>Este proyecto todavía no avisa cuando alguien lo usa</b>Pídele a Claude: "conecta el uso de este proyecto". Es una sola vez.';
  alCambiarTamano = paginar(cont, U.ultimos || [], x => {
    const per = personaDe(x.quien);
    const quien = per ? nombreDe(per) : x.quien && /^\d{10}$/.test(x.quien) ? x.quien : 'Alguien';
    return `<button class="fila" data-u="${x.id}"><span class="estado" style="--c:var(--cobalto);--cf:var(--azulf)">${esc(CANAL[x.canal] || x.canal || 'Uso')}</span><span class="q"><b style="font-weight:700">${esc(quien)}</b><span>${esc(x.resumen || 'Sin resumen')} · ${cuando(x.fecha)}</span></span><span></span></button>`;
  }, { pagina: c.p, vacio, alPintar: l => l.querySelectorAll('[data-u]').forEach(b => b.onclick = () => {
    const x = U.ultimos.find(y => y.id == b.dataset.u); if (!x) return;
    let det = ''; try { const o = JSON.parse(x.datos || '{}'); det = Object.entries(o).filter(([, v]) => v !== '' && v != null).map(([k2, v]) => `${k2[0].toUpperCase() + k2.slice(1)}: ${v}`).join('\n'); } catch (e) { det = x.datos || ''; }
    abrir({ tipo: 'lector', titulo: `${CANAL[x.canal] || 'Uso'} · ${cuando(x.fecha)}`, texto: [x.resumen, det].filter(Boolean).join('\n\n') || 'Sin detalle.' });
  }) });
}

function nombreCorto(per) { return per ? (per.negocio || per.nombre || '').replace(/\s*\(.*\)\s*/g, ' ').trim() : ''; }
function panelesCliente() { return (D.paneles || []).filter(p => p.tel !== 'moon').map(p => ({ p, per: personaDe(p.tel) })).filter(x => x.per); }
const docsDe = (tel, sec) => (D.documentos || []).filter(d => d.tel === tel && (!sec || d.seccion === sec));
const dominio = u => { try { return new URL(u).host.replace(/^www\./, ''); } catch (e) { return u; } };
function icono(p, per, tam) {
  const ini = esc(nombreCorto(per).slice(0, 1)), imgs = String(p.icono || '').split('|').filter(Boolean);
  const med = tam ? `width:${tam}px;height:${tam}px;font-size:${Math.round(tam * .42)}px` : '';
  if (imgs.length > 1) return `<span class="icono duo" style="--c:${p.color};${med}">${imgs.map(u => `<img src="${esc(u)}" alt="" onerror="this.remove()">`).join('')}</span>`;
  // Los logos de empresa se ven completos (nunca recortados): sobre blanco, o sobre su propio color si el logo ya lo trae (#color).
  // #color = el logo trae su propio fondo y el círculo es de ese mismo color (se ve como una sola pieza); #llena = el logo llena el círculo.
  const u = imgs[0] || '', clase = !/^\/centro\/logos\//.test(u) ? '' : /#color$/.test(u) ? ' class="logo-c en-color"' : /#llena$/.test(u) ? '' : ' class="logo-c"';
  return `<span class="icono" style="--c:${p.color};${med}">${u ? `<img${clase} src="${esc(u.replace(/#(color|llena)$/, ''))}" alt="" onerror="this.remove()">` : ''}${ini}</span>`;
}
// Se puede mandar fuera lo del cliente y lo público de MOON; lo interno del equipo, no (la misma regla vive en el servidor).
const sePuedeEnviar = d => d && d.formato === 'link' && /^https:\/\//.test(d.url || '') && !(d.tel === 'moon' && ['bienvenida', 'jason'].includes(d.seccion));
function abrirDoc(d) {
  if (d.formato === 'link' && !/^https?:\/\//.test(d.url || '')) { location.href = d.url; return; }   // tel: (llamar a Jason)
  if (d.formato === 'centro') {   // algo que vive dentro del Centro (ej. las llamadas de Jason)
    const [, clave, tab] = String(d.url).split(':');

    if (pr) abrir({ tipo: 'proyecto', id: pr.id, tab: tab || 'fase' });

  abrir({ tipo: 'documento', id: d.id, titulo: d.titulo, doc: d.formato === 'link' ? Object.assign({}, d, { compartir: sePuedeEnviar(d) ? d.url : '' }) : null });

/* ---------- Documento guardado: se lee aquí, sin necesitar Claude ---------- */
let markedListo = null;
function cargarMarked() {
  if (window.marked) return Promise.resolve();
  return markedListo || (markedListo = new Promise((ok, mal) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js'; s.onload = ok; s.onerror = mal; document.head.appendChild(s); }));
}
function capaDocumento(c) {
  const d = c.doc;
  if (!d) { marco(c.titulo || 'Documento', '', '<div class="vacio"><div><b>No se pudo abrir</b>Revisa tu internet y vuelve a intentar.</div></div>'); return; }
  const enviar = d.compartir ? 'Enviar' : '';
  if (d.formato === 'html' || d.formato === 'link') {
    // Su propio diseño, aislado del Centro (no puede leer ni tocar nada de aquí). El servidor ya lo dejó listo para verse completo:
    // láminas y hojas una a la vez, del tamaño de la pantalla; lo demás ajustado al ancho (nunca deslizar a los lados).
    const pasos = d.formato === 'html' && d.modo && d.modo !== 'ancho';
    marco(d.titulo, enviar, `<div class="cuerpo" style="grid-template-rows:minmax(0,1fr)${pasos ? ' auto' : ''}"><div class="hoja visor" style="background:${d.formato === 'html' ? esc(d.fondo || '#fff') : '#fff'}"><iframe class="doc-html" title="${esc(d.titulo)}" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox${d.formato === 'link' ? ' allow-same-origin allow-forms' : ''}"></iframe></div>${pasos ? '<div class="pie"></div>' : ''}</div>`, I.enviar);
    const fr = app.querySelector('.doc-html'), pie = app.querySelector('.vista .pie');
    if (d.formato === 'link') fr.src = d.url; else fr.srcdoc = d.contenido;
    if (pasos) {
      c.lamina = c.lamina || 0;
      const ir = n => fr.contentWindow && fr.contentWindow.postMessage({ lamina: n }, '*');
      onmessage = e => {
        if (e.source !== fr.contentWindow || !e.data || typeof e.data.total !== 'number') return;
        c.lamina = e.data.lamina; const n = e.data.total;
        pie.innerHTML = n > 1 ? `<button class="redondo" data-pag="-1" aria-label="Anterior">${I.izq}</button><span class="pag">${c.lamina + 1} de ${n}</span><button class="redondo" data-pag="1" aria-label="Siguiente">${I.der}</button>` : '';
        pie.querySelectorAll('[data-pag]').forEach(b => b.onclick = () => ir((c.lamina + Number(b.dataset.pag) + n) % n));
      };
      fr.onload = () => ir(c.lamina);
    }
  } else {
    marco(d.titulo, enviar, `<div class="cuerpo" style="grid-template-rows:minmax(0,1fr) auto"><div class="hoja md" id="hojaMd"></div><div class="pie"></div></div>`, I.enviar);
    const hoja = document.getElementById('hojaMd'), pie = app.querySelector('.vista .pie');
    cargarMarked().then(() => {
      const temp = document.createElement('div'); temp.innerHTML = window.marked.parse(String(d.contenido || ''));
      temp.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
      const bloques = [...temp.children].map(e => e.outerHTML);
      function dibuja() {
        // Páginas por bloques completos: un párrafo o una tabla nunca se cortan a la mitad.
        const paginas = []; let actual = [];
        hoja.innerHTML = '';
        for (const b of bloques) {
          hoja.insertAdjacentHTML('beforeend', b);
          if (hoja.scrollHeight > hoja.clientHeight + 1 && actual.length) { hoja.lastElementChild.remove(); paginas.push(actual); actual = []; hoja.innerHTML = b; }
          actual.push(b);
        }
        if (actual.length) paginas.push(actual);
        c.p = Math.min(c.p || 0, paginas.length - 1);
        hoja.innerHTML = paginas[c.p].join('');
        pie.innerHTML = paginas.length > 1 ? `<button class="redondo" data-pag="-1" aria-label="Anterior">${I.izq}</button><span class="pag">${c.p + 1} de ${paginas.length}</span><button class="redondo" data-pag="1" aria-label="Siguiente">${I.der}</button>` : '';
        pie.querySelectorAll('[data-pag]').forEach(b => b.onclick = () => { c.p = (c.p + Number(b.dataset.pag) + paginas.length) % paginas.length; dibuja(); });
        let x0 = null; hoja.ontouchstart = e => { x0 = e.touches[0].clientX; };
        hoja.ontouchend = e => { if (x0 == null || paginas.length < 2) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) { c.p = (c.p + (dx < 0 ? 1 : -1) + paginas.length) % paginas.length; dibuja(); } };
      }
      dibuja(); alCambiarTamano = dibuja;
    }, () => { hoja.innerHTML = '<p>No se pudo mostrar el documento. Revisa tu internet.</p>'; });
  }
  if (enviar) document.getElementById('accion').onclick = () => compartir(d.titulo, d.compartir);
}

function capaLector(c) {
  marco(c.titulo, '', `<div class="cuerpo" style="grid-template-rows:minmax(0,1fr) auto"><div class="hoja" id="hoja"><p id="txt" style="font-weight:600;white-space:pre-line;line-height:1.5"></p></div><div class="pie"></div></div>`);

    const palabras = String(c.texto || '').split(/(\s+)/);
    const paginas = []; let i = 0;
    txt.style.fontSize = '16px';
    while (i < palabras.length) {
      let j = i; txt.textContent = '';
      while (j < palabras.length) { txt.textContent += palabras[j]; if (hoja.scrollHeight > hoja.clientHeight + 1 && j > i) { txt.textContent = txt.textContent.slice(0, -palabras[j].length); break; } j++; }
      paginas.push(txt.textContent); i = j === i ? i + 1 : j;

    c.p = Math.min(c.p || 0, paginas.length - 1);
    txt.textContent = paginas[c.p];
    pie.innerHTML = paginas.length > 1 ? `<button class="redondo" data-pag="-1" aria-label="Anterior">${I.izq}</button><span class="pag">${c.p + 1} de ${paginas.length}</span><button class="redondo" data-pag="1" aria-label="Siguiente">${I.der}</button>` : '';

// Acomoda las credenciales al tamaño más grande que quepa completo, sin scroll (1, 2 o 3 por renglón).
function acomodarCreds(cont) {
  const n = cont.children.length, gap = 12, W = cont.clientWidth, H = cont.clientHeight;
  let mejor = 0;
  for (let cols = 1; cols <= n; cols++) {
    const filas = Math.ceil(n / cols);
    const w = Math.min((W - (cols - 1) * gap) / cols, (H - (filas - 1) * gap) / filas * 86 / 54, 560);
    if (w > mejor) mejor = w;
  }
  cont.style.setProperty('--cw', Math.max(120, Math.floor(mejor)) + 'px');
  cont.style.setProperty('--hc', gap + 'px');
}

  marco('Mi frase', '', `<form class="hoja editando" id="f" style="align-self:start">
    <label class="eti" for="rol">Lo que hago en MOON</label><input class="campo" id="rol" maxlength="40" value="${esc(u.rol || '')}" placeholder="Ej. Construye y diseña">
    <label class="eti" for="lema">Mi frase (sale atrás de la credencial)</label><input class="campo" id="lema" maxlength="90" value="${esc(u.lema || '')}" placeholder="Una frase que te represente">
    <button class="boton">Guardar</button><div class="aviso" id="aviso"></div></form>`);
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    const datos = { rol: document.getElementById('rol').value, lema: document.getElementById('lema').value };
    const r = await api('mi_perfil', datos);
    if (r.ok) { Object.assign(u, datos); cerrar(); } else document.getElementById('aviso').textContent = 'No se pudo guardar. Intenta de nuevo.';
  };
}

// Acomodar la foto nueva: se arrastra con un dedo y se acerca pellizcando o con la barrita.
function capaFoto(c) {
  marco('Acomoda tu foto', '', `<div class="cuerpo" style="grid-template-rows:minmax(0,1fr) auto auto auto">
    <div class="recorte" id="rec"><img id="img" alt="Tu foto nueva"></div>
    <label class="mini" style="display:flex;align-items:center;gap:10px">Acercar<input type="range" id="zoom" min="1" max="3" step="0.01" value="${c.s || 1}" style="flex:1;accent-color:var(--cobalto)"></label>
    <div class="botones"><button class="boton dos" id="cancelar">Cancelar</button><button class="boton" id="guardar">Usar esta foto</button></div>
    <div class="aviso" id="aviso" style="text-align:center"></div></div>`);
  const rec = document.getElementById('rec'), img = document.getElementById('img'), zoom = document.getElementById('zoom');
  c.s = c.s || 1; c.x = c.x || 0; c.y = c.y || 0;
  let base = 1;
  function limites() {
    const fw = rec.clientWidth, fh = rec.clientHeight, iw = img.naturalWidth * base * c.s, ih = img.naturalHeight * base * c.s;
    c.x = Math.max(-(iw - fw) / 2, Math.min((iw - fw) / 2, c.x));
    c.y = Math.max(-(ih - fh) / 2, Math.min((ih - fh) / 2, c.y));
  }
  function dibuja() {
    if (!img.naturalWidth) return;
    base = Math.max(rec.clientWidth / img.naturalWidth, rec.clientHeight / img.naturalHeight);
    limites();
    img.style.width = img.naturalWidth + 'px';
    img.style.transform = `translate(-50%,-50%) translate(${c.x}px,${c.y}px) scale(${base * c.s})`;
    zoom.value = c.s;
  }
  img.onload = dibuja; img.src = c.src;
  alCambiarTamano = dibuja;
  zoom.oninput = () => { c.s = Number(zoom.value); dibuja(); };
  const dedos = new Map(); let inicio = null;
  const escala = () => rec.offsetWidth / rec.getBoundingClientRect().width;   // de la pantalla al tamaño elegido
  rec.onpointerdown = e => { rec.setPointerCapture(e.pointerId); dedos.set(e.pointerId, [e.clientX, e.clientY]); inicio = null; };
  rec.onpointermove = e => {
    if (!dedos.has(e.pointerId)) return;
    const antes = dedos.get(e.pointerId); dedos.set(e.pointerId, [e.clientX, e.clientY]);
    const k = escala();
    if (dedos.size === 1) { c.x += (e.clientX - antes[0]) * k; c.y += (e.clientY - antes[1]) * k; }
    else if (dedos.size === 2) {
      const [a, b] = [...dedos.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (!inicio) inicio = { d, s: c.s }; else c.s = Math.max(1, Math.min(3, inicio.s * d / inicio.d));
    }
    dibuja();
  };
  rec.onpointerup = rec.onpointercancel = e => { dedos.delete(e.pointerId); inicio = null; };
  rec.onwheel = e => { e.preventDefault(); c.s = Math.max(1, Math.min(3, c.s * (e.deltaY < 0 ? 1.06 : 0.94))); dibuja(); };
  document.getElementById('cancelar').onclick = cerrar;
  document.getElementById('guardar').onclick = async () => {
    if (!img.naturalWidth) return;
    const b = document.getElementById('guardar'); b.disabled = true; b.textContent = 'Guardando…';
    const cv = document.createElement('canvas'); cv.width = 360; cv.height = 450;
    const k = 360 / rec.clientWidth, dw = img.naturalWidth * base * c.s * k, dh = img.naturalHeight * base * c.s * k;
    cv.getContext('2d').drawImage(img, 180 + c.x * k - dw / 2, 225 + c.y * k - dh / 2, dw, dh);
    const foto = cv.toDataURL('image/jpeg', 0.85);
    const r = await api('mi_perfil', { foto });
    if (r.ok) { Object.assign(FOTOS, await prepararFotos({ [yo()]: foto })); URL.revokeObjectURL(c.src); cerrar(); }
    else { b.disabled = false; b.textContent = 'Usar esta foto'; document.getElementById('aviso').textContent = 'No se pudo guardar. Intenta de nuevo.'; }
  };
}
