<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<title>Armar un demo · MOON Digital</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3efe9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171b" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Misma familia que el Centro MOON: marfil, cobalto, Manrope y orillas redondas.
   Regla de esta página: todo cabe en UNA pantalla, sin scroll. Lo que no cabe se abre con un botón en una hoja aparte. */
:root{
  --fondo:#f3efe9; --tarjeta:#f6f3ee; --campo:#ece7e0; --tinta:#1d1d22; --suave:#5d5d66; --tenue:#8b8a92;
  --cobalto:#0b4fd6; --verde:#2f9e5a; --verdef:#e6f4ea; --rojo:#c0392b;
  --sombra:0 14px 28px -12px rgba(120,105,85,.35),0 2px 6px rgba(120,105,85,.10),inset 0 1px 0 rgba(255,255,255,.85);
  --hundido:inset 0 2px 5px rgba(120,105,85,.22),inset 0 -1px 0 rgba(255,255,255,.7);
  --velo:rgba(29,29,34,.38);
  --ease:cubic-bezier(.22,.8,.24,1); --r:28px;
  --alto:46px; --hueco:12px; --pad:18px;
}
@media (prefers-color-scheme:dark){:root{
  --fondo:#16171b; --tarjeta:#1d1e23; --campo:#25262c; --tinta:#efedea; --suave:#b3b1b8; --tenue:#85848c;
  --cobalto:#3a78ff; --verde:#5cc283; --verdef:#183026; --rojo:#ef7b72;
  --sombra:0 14px 28px -12px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);
  --hundido:inset 0 2px 5px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.04);
  --velo:rgba(0,0,0,.55);
}}
/* Pantallas bajitas: todo se compacta un poco para seguir cabiendo. */
@media (max-height:620px){:root{--alto:42px;--hueco:9px;--pad:14px}.nota{font-size:14px}.listo{font-size:16px}.link{padding:10px 14px;font-size:14px}}
@media (max-height:520px){:root{--alto:40px;--hueco:7px;--pad:12px}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--fondo);color:var(--tinta);font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
[hidden]{display:none!important}
main{height:100%;max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:var(--hueco)}
main>.vista{flex:1 1 auto;min-height:0}
.dentro main{padding:0 0 2px;max-width:none}
.eti{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--suave)}
h1{font-size:clamp(22px,6.4vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.nota{color:var(--suave);font-size:15px;line-height:1.35}
.tarjeta{min-height:0;background:var(--tarjeta);border-radius:var(--r);box-shadow:var(--sombra);padding:var(--pad);display:flex;flex-direction:column;gap:var(--hueco);overflow:hidden}
.campo{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:14px}
input,textarea{background:var(--campo);box-shadow:var(--hundido);border-radius:18px;padding:0 16px;height:var(--alto);font-size:16px;width:100%}
textarea{height:auto;padding:13px 16px;resize:none;line-height:1.4}
input:focus,textarea:focus{outline:2px solid var(--cobalto);outline-offset:1px}
/* Pastillas que abren una hoja: dicen si ya tienen algo o si faltan. */
.pastillas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pastilla{min-height:calc(var(--alto) + 12px);border-radius:20px;background:var(--campo);box-shadow:var(--hundido);padding:8px 14px;text-align:start;display:flex;flex-direction:column;justify-content:center;gap:2px}
.pastilla b{font-size:14px;line-height:1.2}
.pastilla span{font-size:12px;font-weight:600;color:var(--tenue)}
.pastilla.lleno span{color:var(--verde)}
.voz-fila{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px}
.voz{border-radius:999px;height:var(--alto);padding:0 16px;font-weight:700;font-size:15px;background:var(--campo);box-shadow:var(--hundido);transition:background .25s var(--ease),color .25s var(--ease)}
.voz[aria-pressed="true"]{background:var(--cobalto);color:#fff;box-shadow:none}
.boton{border-radius:999px;height:calc(var(--alto) + 6px);padding:0 16px;font-weight:800;font-size:clamp(15px,4.6vw,17px);white-space:nowrap;background:var(--cobalto);color:#fff;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px;flex:none;transition:transform .2s var(--ease),background .2s var(--ease)}
.boton:active{transform:scale(.97)}
.boton.dos{background:var(--campo);color:var(--tinta);box-shadow:var(--hundido);font-size:clamp(14px,4.2vw,15px)}
.boton.wa{background:#1f9d55}
.boton svg{width:22px;height:22px;flex:none}
.par{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#forma,#resultado,#paso1{justify-content:space-between}
.aviso{font-size:14px;font-weight:600;color:var(--rojo)}
.link{background:var(--campo);box-shadow:var(--hundido);border-radius:18px;padding:12px 16px;font-weight:700;font-size:15px;color:var(--cobalto)}
.listo{display:flex;align-items:center;gap:10px;color:var(--verde);font-weight:800;font-size:18px}
.listo svg{width:26px;height:26px}
/* Botón de abajo: mis demos y cuántas pláticas van hoy. */
.mis{height:calc(var(--alto) + 6px);border-radius:999px;background:var(--tarjeta);box-shadow:var(--sombra);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 8px 0 20px;font-weight:700;font-size:15px}
.mis small{font-weight:700;font-size:13px;color:var(--suave);background:var(--campo);border-radius:999px;padding:6px 12px;white-space:nowrap}
/* Hoja que sube desde abajo: nunca más alta que la pantalla. */
.velo{position:fixed;inset:0;background:var(--velo);opacity:0;transition:opacity .3s var(--ease);z-index:5}
.velo.ver{opacity:1}
.hoja{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:calc(100% - 24px);overflow:hidden;background:var(--fondo);border-radius:var(--r) var(--r) 0 0;padding:20px 16px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:var(--hueco);transform:translateY(100%);transition:transform .35s var(--ease);z-index:6}
.hoja.ver{transform:none}
@media (prefers-reduced-motion:reduce){.hoja{transition:transform .35s var(--ease)}}
.hoja h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
.hoja .cuerpo{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:var(--hueco)}
.hoja textarea{min-height:0;flex:1 1 auto;height:clamp(110px,32vh,220px)}
.fila{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid rgba(127,127,127,.15);min-height:58px}
.fila:first-child{border-top:0}
.fila div{min-width:0}
.fila b{display:block;overflow-wrap:anywhere;line-height:1.25}
.fila small{color:var(--tenue);font-size:13px}
.fila a{color:var(--cobalto);font-weight:700;text-decoration:none;white-space:nowrap}
.lista{min-height:0;flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.entrar{text-align:center;justify-content:center;gap:14px}
.vista{animation:entra .35s var(--ease) both}
@keyframes entra{from{opacity:0}to{opacity:1}}
/* Pestañas de Dan: Armar demo · Tablero */
.pestanas{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--campo);box-shadow:var(--hundido);border-radius:999px;padding:5px}
.pestana{height:calc(var(--alto) - 6px);border-radius:999px;font-weight:800;font-size:15px;color:var(--suave);transition:background .25s var(--ease),color .25s var(--ease)}
.pestana[aria-selected="true"]{background:var(--tarjeta);color:var(--tinta);box-shadow:0 6px 14px -8px rgba(0,0,0,.35)}
/* Tablero: tres tarjetas que llenan la pantalla */
#tablero{min-height:0;display:grid;grid-template-rows:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr);gap:var(--hueco)}
.tt{min-height:0;background:var(--tarjeta);border-radius:var(--r);box-shadow:var(--sombra);padding:var(--pad);display:flex;flex-direction:column;gap:8px;text-align:start;overflow:hidden;width:100%}
.tt .eti{letter-spacing:.16em}
.embudo{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;align-items:center}
.paso{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.paso i{font-style:normal;width:min(100%,64px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:clamp(17px,5vw,24px);background:var(--campo);box-shadow:var(--hundido);color:var(--tinta)}
.paso.fuerte i{background:var(--cobalto);color:#fff;box-shadow:none}
.paso.verde i{background:var(--verde);color:#fff;box-shadow:none}
.paso span{font-size:12px;font-weight:700;color:var(--suave);text-align:center;line-height:1.15}
.cifra{font-size:clamp(26px,8vw,38px);font-weight:800;letter-spacing:-.02em;line-height:1}
.cifra small{font-size:14px;font-weight:700;color:var(--suave);letter-spacing:0;margin-left:6px}
.dos-cifras{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.dos-cifras b{display:block;font-size:clamp(20px,6vw,28px);font-weight:800;letter-spacing:-.02em}
.dos-cifras span{font-size:12px;font-weight:700;color:var(--suave)}
.renglon{font-size:13px;font-weight:600;color:var(--suave);margin-top:auto}
.tt-cab{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chico{height:36px;border-radius:999px;padding:0 16px;font-weight:800;font-size:14px;background:var(--cobalto);color:#fff;white-space:nowrap;flex:none}
.fila .monto{font-weight:800;white-space:nowrap}
.marca{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--campo);color:var(--suave);margin-left:6px;vertical-align:middle}
.marca.si{background:var(--verdef);color:var(--verde)}
.elegible{width:100%;text-align:start}
</style>
</head>
<body>
<main>
  <header id="cabeza" style="display:flex;flex-direction:column;gap:6px">
    <span class="eti" id="cabEti">MOON Digital</span>
    <h1 id="cabTitulo">Demos</h1>
  </header>

  <div class="pestanas" id="pestanas" role="tablist" hidden>
    <button class="pestana" role="tab" data-v="forma" aria-selected="true">Armar demo</button>
    <button class="pestana" role="tab" data-v="tablero" aria-selected="false">Tablero</button>
  </div>

  <!-- Puerta abierta, paso 1: quién eres -->
  <form class="tarjeta vista" id="paso1" hidden autocomplete="on">
    <p class="nota">En un minuto armas al asistente que contestaría a tus clientes, y le hablas tú mismo para ver cómo atiende.</p>
    <label class="campo">Tu nombre
      <input name="contacto" required maxlength="80" autocomplete="name" placeholder="Ej. Laura">
    </label>
    <label class="campo">Tu WhatsApp
      <input name="whatsapp" required type="tel" inputmode="tel" maxlength="20" autocomplete="tel" placeholder="10 dígitos">
    </label>
    <p class="aviso" id="aviso1" hidden></p>
    <button class="boton">Siguiente</button>
  </form>

  <!-- Formulario del negocio: cabe completo en una pantalla -->
  <form class="tarjeta vista" id="forma" hidden autocomplete="off">
    <label class="campo"><span id="lNegocio">Nombre del negocio</span>
      <input name="negocio" required maxlength="80" placeholder="Ej. Clínica Dental Sonrisa">
    </label>
    <label class="campo"><span id="lGiro">¿A qué se dedica?</span>
      <input name="giro" required maxlength="200" placeholder="Ej. Clínica dental en Cancún">
    </label>
    <div class="pastillas">
      <button type="button" class="pastilla" id="pServicios"><b>Servicios y precios</b><span>Opcional</span></button>
      <button type="button" class="pastilla" id="pHorario"><b>Horario y dirección</b><span>Opcional</span></button>
    </div>
    <div class="campo">Voz y nombre del asistente
      <div class="voz-fila">
        <button type="button" class="voz" data-voz="mujer" aria-pressed="true">Mujer</button>
        <button type="button" class="voz" data-voz="hombre" aria-pressed="false">Hombre</button>
        <input name="asistente" maxlength="30" value="Sofía" aria-label="Nombre del asistente">
      </div>
    </div>
    <input type="hidden" name="servicios"><input type="hidden" name="horario"><input type="hidden" name="ubicacion">
    <p class="aviso" id="aviso" hidden></p>
    <button class="boton" id="crear">Crear demo</button>
  </form>

  <!-- Resultado (Dan) -->
  <section class="tarjeta vista" id="resultado" hidden>
    <p class="listo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>Demo listo</p>
    <p class="nota" id="resTexto"></p>
    <div class="link" id="resLink"></div>
    <a class="boton wa" id="mandar" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4a.5.5 0 0 0 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>Mandar por WhatsApp</a>
    <div class="par">
      <button class="boton dos" id="copiar" type="button">Copiar link</button>
      <a class="boton dos" id="probar" target="_blank" rel="noopener">Probarlo yo</a>
    </div>
    <button class="boton dos" id="otro" type="button">Armar otro demo</button>
  </section>

  <!-- Tablero de Dan: se actualiza solo -->
  <section id="tablero" class="vista" hidden>
    <button class="tt" id="tEmbudo" type="button"><span class="eti">Cómo van los demos</span><div class="embudo" id="embudo"></div></button>
    <button class="tt" id="tGasto" type="button"><span class="eti">Gasto en llamadas</span><span class="cifra" id="gHoy"></span><span class="renglon" id="gRenglon"></span></button>
    <div class="tt" id="tCobro" role="button" tabindex="0">
      <div class="tt-cab"><span class="eti">Lo cobrado</span><button class="chico" id="anotar" type="button">Anotar un cierre</button></div>
      <div class="dos-cifras"><div><b id="cTotal"></b><span>pagos únicos</span></div><div><b id="cMes"></b><span>al mes</span></div></div>
    </div>
  </section>
</main>

<!-- Hoja que sube desde abajo -->
<div class="velo" id="velo" hidden></div>
<section class="hoja" id="hoja" hidden role="dialog" aria-modal="true" aria-labelledby="hojaTitulo">
  <h2 id="hojaTitulo"></h2>
  <div class="cuerpo" id="hojaCuerpo"></div>
  <button class="boton" id="hojaListo" type="button">Listo</button>
</section>

<script>
const PARAMS = new URLSearchParams(location.search);
function $(id) { return document.getElementById(id); }
// Dentro del Centro MOON el título ya lo pone el Centro: aquí no se repite, y la tarjeta es el único marco.
if (PARAMS.get('dentro')) { document.documentElement.classList.add('dentro'); $('cabeza').hidden = true; document.documentElement.style.background = 'transparent'; document.body.style.background = 'transparent'; }
const API = '/api/prueba';
const LLAVE = 'centro.moon.sesion'; // la misma sesión del Centro MOON
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sesion = () => { try { return localStorage.getItem(LLAVE) || ''; } catch (e) { return ''; } };
const pesos = n => '$' + Math.round(Number(n) || 0).toLocaleString('es-MX');
const F = () => $('forma');
let modo = 'dan', voz = 'mujer', contacto = null, T = null, reloj = 0;

async function api(accion, datos) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-sesion': sesion() }, body: JSON.stringify(Object.assign({ accion }, datos || {})) }).catch(() => null);
  if (!r) return { ok: false, error: 'red' };
  return r.json().catch(() => ({ ok: false, error: 'red' }));
}

function mostrar(id) {
  ['paso1', 'forma', 'resultado', 'tablero'].forEach(x => $(x).hidden = x !== id);
  document.querySelectorAll('.pestana').forEach(b => b.setAttribute('aria-selected', b.dataset.v === (id === 'tablero' ? 'tablero' : 'forma')));
  clearInterval(reloj);
  if (id === 'tablero') { cargarTablero(); reloj = setInterval(() => { if (!document.hidden && $('hoja').hidden) cargarTablero(); }, 20000); }
}
document.querySelectorAll('.pestana').forEach(b => b.onclick = () => mostrar(b.dataset.v === 'tablero' ? 'tablero' : ($('resultado').hidden ? 'forma' : 'resultado')));

document.querySelectorAll('.voz').forEach(b => b.onclick = () => {
  voz = b.dataset.voz;
  document.querySelectorAll('.voz').forEach(x => x.setAttribute('aria-pressed', x === b));
  const n = F().asistente;
  if (!n.value.trim() || n.value === 'Sofía' || n.value === 'Mateo') n.value = voz === 'hombre' ? 'Mateo' : 'Sofía';
});

/* ---------- Hoja ---------- */
let alListo = null;
function abrirHoja(titulo, html, listo, fn) {
  $('hojaTitulo').textContent = titulo;
  $('hojaCuerpo').innerHTML = html;
  $('hojaListo').textContent = listo || 'Listo';
  $('hojaListo').disabled = false;
  alListo = fn || null;
  $('velo').hidden = false; $('hoja').hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => { $('velo').classList.add('ver'); $('hoja').classList.add('ver'); }));
}
function cerrarHoja() {
  $('velo').classList.remove('ver'); $('hoja').classList.remove('ver');
  setTimeout(() => { $('velo').hidden = true; $('hoja').hidden = true; }, 350);
}
// Si la acción dice "todavía no" (falta un dato), la hoja se queda abierta.
$('hojaListo').onclick = async () => { if (alListo && (await alListo()) === false) return; cerrarHoja(); };
$('velo').onclick = cerrarHoja;

function pintarPastillas() {
  const s = F().servicios.value.trim(), h = F().horario.value.trim(), u = F().ubicacion.value.trim();
  $('pServicios').classList.toggle('lleno', !!s);
  $('pServicios').querySelector('span').textContent = s ? 'Listo ✓' : 'Opcional';
  $('pHorario').classList.toggle('lleno', !!(h || u));
  $('pHorario').querySelector('span').textContent = h && u ? 'Listo ✓' : h ? 'Horario ✓' : u ? 'Dirección ✓' : 'Opcional';
}
$('pServicios').onclick = () => {
  abrirHoja('Servicios y precios',
    `<p class="nota">Lo que el asistente puede decir. Si no sabes los precios, déjalo vacío y dirá que el equipo los confirma.</p>
     <textarea id="hServicios" maxlength="1500" placeholder="Ej. Limpieza $600, blanqueamiento $2,500, consulta de valoración gratis">${esc(F().servicios.value)}</textarea>`,
    'Listo', () => { F().servicios.value = $('hServicios').value.trim(); pintarPastillas(); });
};
$('pHorario').onclick = () => {
  abrirHoja('Horario y dirección',
    `<label class="campo">Horario<input id="hHorario" maxlength="200" placeholder="Ej. Lunes a sábado de 9 a 7" value="${esc(F().horario.value)}"></label>
     <label class="campo">Dirección o ciudad<input id="hUbicacion" maxlength="200" placeholder="Ej. Av. Tulum 200, Cancún" value="${esc(F().ubicacion.value)}"></label>`,
    'Listo', () => { F().horario.value = $('hHorario').value.trim(); F().ubicacion.value = $('hUbicacion').value.trim(); pintarPastillas(); });
};

/* ---------- Puerta abierta: paso 1 ---------- */
$('paso1').addEventListener('submit', e => {
  e.preventDefault();
  const f = new FormData($('paso1'));
  const tel = String(f.get('whatsapp') || '').replace(/\D/g, '');
  if (tel.length < 10) { $('aviso1').textContent = 'Escribe tu WhatsApp completo, con 10 dígitos.'; $('aviso1').hidden = false; return; }
  contacto = { contacto: String(f.get('contacto') || '').trim(), whatsapp: String(f.get('whatsapp') || '').trim() };
  mostrar('forma');
});

/* ---------- Crear ---------- */
F().addEventListener('submit', async e => {
  e.preventDefault();
  const datos = Object.assign(Object.fromEntries(new FormData(F()).entries()), contacto || {}, { voz });
  const texto = $('crear').textContent;
  $('crear').disabled = true; $('crear').textContent = 'Creando…'; $('aviso').hidden = true;
  const r = await api(modo === 'abierta' ? 'crear_abierta' : 'crear', datos);
  $('crear').disabled = false; $('crear').textContent = texto;
  if (!r.ok) {
    $('aviso').textContent = r.error === 'faltan' ? 'Falta el nombre del negocio o a qué se dedica.'
      : r.error === 'lleno' ? 'Por hoy ya se armaron muchos demos. Vuelve mañana, con gusto te esperamos.'
      : r.error === 'sesion' ? 'Tu sesión del Centro se cerró. Vuelve a entrar al Centro MOON.'
      : 'No se pudo crear. Revisa tu internet y vuelve a intentar.';
    $('aviso').hidden = false; return;
  }
  // Puerta abierta: directo a hablarle a su asistente.
  if (modo === 'abierta') { location.href = r.link; return; }
  const negocio = datos.negocio.trim();
  $('resTexto').textContent = `Mándale este link a ${negocio}. Lo abre en su celular, pica el botón y le habla a su asistente.`;
  $('resLink').innerHTML = esc(r.link.replace(/^https:\/\//, '')).replace(/([\/-])/g, '$1<wbr>'); // se ve corto y solo se parte en / o -; al mandarlo va completo con https://
  $('probar').href = r.link;
  const mensaje = `Hola, te preparé una muestra de cómo atendería un asistente virtual a los clientes de ${negocio}. Ábrela y háblale como si fueras un cliente: ${r.link}`;
  $('mandar').href = 'https://wa.me/?text=' + encodeURIComponent(mensaje);
  $('copiar').onclick = async () => { try { await navigator.clipboard.writeText(r.link); $('copiar').textContent = 'Copiado'; } catch (e) { $('copiar').textContent = 'Mantén presionado el link'; } setTimeout(() => $('copiar').textContent = 'Copiar link', 2200); };
  mostrar('resultado');
});
$('otro').onclick = () => { F().reset(); ['servicios', 'horario', 'ubicacion'].forEach(n => F()[n].value = ''); voz = 'mujer'; document.querySelectorAll('.voz').forEach(x => x.setAttribute('aria-pressed', x.dataset.voz === 'mujer')); pintarPastillas(); $('resultado').hidden = true; mostrar('forma'); };

/* ---------- Tablero ---------- */
function cuando(iso) {
  if (!iso) return '';
  const d = Math.floor((Date.now() - Date.parse(iso)) / 864e5);
  return d <= 0 ? 'hoy' : d === 1 ? 'ayer' : `hace ${d} días`;
}
const RESP = { quiero: 'Quiere uno', llamada: 'Quiere llamada', no: 'Ahorita no' };
const quien = x => x.contacto ? `${x.contacto} · ${x.negocio}` : x.negocio;
const filaDemo = x => `<div class="fila"><div><b>${esc(quien(x))}${x.cerrado ? '<span class="marca si">Cerrado</span>' : x.respuesta ? `<span class="marca${x.respuesta === 'no' ? '' : ' si'}">${RESP[x.respuesta]}</span>` : ''}</b><small>${x.puerta === 'abierta' ? 'Lo armó solo' : 'Lo armó el equipo'} · ${esc(cuando(x.creado))} · ${x.usos ? `le habló ${x.usos} ${x.usos === 1 ? 'vez' : 'veces'}` : 'aún no le habla'}</small></div><a href="/prueba/${esc(x.codigo)}" target="_blank" rel="noopener">Abrir</a></div>`;
const PASOS = [
  ['armados', 'Armados', x => true, 'Todos los demos, del más nuevo al más viejo.'],
  ['abiertos', 'Los abrieron', x => x.vistas > 0, 'Abrieron su link al menos una vez.'],
  ['hablaron', 'Le hablaron', x => x.usos > 0, 'Platicaron con su asistente.'],
  ['quieren', 'Quieren', x => x.respuesta === 'quiero' || x.respuesta === 'llamada', 'Picaron "quiero uno" o "agendar una llamada". Dan tiene una tarea por cada uno.'],
  ['cerrados', 'Cerrados', x => x.cerrado, 'Ya son clientes.'],
];
function pintarTablero() {
  if (!T) return;
  $('embudo').innerHTML = PASOS.map(([k, n, f], i) => `<div class="paso${i === 3 ? ' fuerte' : i === 4 ? ' verde' : ''}" data-paso="${k}"><i>${T.demos.filter(f).length}</i><span>${n}</span></div>`).join('');
  const g = T.gasto;
  $('gHoy').innerHTML = `${pesos(g.hoy.mxn)}<small>hoy · ${g.hoy.platicas} ${g.hoy.platicas === 1 ? 'plática' : 'pláticas'}</small>`;
  $('gRenglon').textContent = `Este mes ${pesos(g.mes.mxn)} · Demos de Dan ${T.hoy.dan} de ${T.topes.dan} · Puerta abierta ${T.hoy.abierta} de ${T.topes.abierta}`;
  const tot = T.cobros.reduce((a, x) => a + (x.cobro_total || 0), 0), mes = T.cobros.reduce((a, x) => a + (x.cobro_mensual || 0), 0);
  $('cTotal').textContent = pesos(tot); $('cMes').textContent = pesos(mes);
}
async function cargarTablero() {
  const r = await api('tablero');
  if (r.error === 'sesion') return entrarAbierta();
  if (r.ok) { T = r; pintarTablero(); }
}
$('tEmbudo').onclick = e => {
  const el = e.target.closest('[data-paso]'); const k = el ? el.dataset.paso : 'armados';
  const [, n, f, d] = PASOS.find(p => p[0] === k);
  const lista = T.demos.filter(f);
  abrirHoja(n, `<p class="nota">${d}</p><div class="lista">${lista.length ? lista.map(filaDemo).join('') : '<p class="nota">Todavía no hay ninguno aquí.</p>'}</div>`, 'Cerrar');
};
$('tGasto').onclick = () => {
  const g = T.gasto;
  const partes = g.hoy.todas && g.hoy.porAgente && g.hoy.porAgente.length
    ? g.hoy.porAgente.map(a => `<div class="fila"><div><b>${esc(a.nombre)}</b></div><span class="monto">${pesos(a.mxn)}</span></div>`).join('')
    : '<p class="nota">Por ahora solo se cuentan las pláticas de los demos.</p>';
  abrirHoja('Gasto en llamadas', `<div class="lista">
    <div class="fila"><div><b>Hoy</b><small>${g.hoy.platicas} pláticas</small></div><span class="monto">${pesos(g.hoy.mxn)}</span></div>
    <div class="fila"><div><b>Este mes</b><small>${g.mes.platicas} pláticas</small></div><span class="monto">${pesos(g.mes.mxn)}</span></div>
    ${g.hoy.todas ? '<p class="nota" style="margin-top:8px">Hoy, por asistente:</p>' + partes : partes}
    <p class="nota" style="margin-top:8px">Calculado por los minutos de cada plática, en pesos aproximados.</p></div>`, 'Cerrar');
};
$('tCobro').onclick = e => {
  if (e.target.closest('#anotar')) return;
  const filas = T.cobros.map(x => `<div class="fila"><div><b>${esc(x.negocio || x.nombre)}</b><small>${esc(cuando(x.cobro_fecha))}</small></div><span class="monto">${[x.cobro_total ? pesos(x.cobro_total) : '', x.cobro_mensual ? pesos(x.cobro_mensual) + '/mes' : ''].filter(Boolean).join(' · ')}</span></div>`).join('');
  abrirHoja('Lo cobrado', `<div class="lista">${filas || '<p class="nota">Todavía no hay cierres anotados. Cuando cierres un cliente, pica "Anotar un cierre".</p>'}</div>`, 'Cerrar');
};
$('anotar').onclick = e => {
  e.stopPropagation();
  let elegido = null;
  abrirHoja('Anotar un cierre', `<label class="campo">¿Quién es el cliente?<input id="busca" placeholder="Nombre, negocio o teléfono" autocomplete="off"></label>
    <div class="lista" id="resultados"></div>
    <div id="montos" hidden style="display:grid;gap:10px">
      <p class="nota" id="elegidoTxt"></p>
      <div class="par"><label class="campo">Pago único<input id="mTotal" type="number" inputmode="decimal" min="0" placeholder="$0"></label>
      <label class="campo">Al mes<input id="mMes" type="number" inputmode="decimal" min="0" placeholder="$0"></label></div>
      <p class="aviso" id="avisoCierre" hidden></p>
    </div>`, 'Guardar cierre', async () => {
      if (!elegido) { $('busca').focus(); return false; }
      const total = Number($('mTotal').value) || 0, mensual = Number($('mMes').value) || 0;
      if (!total && !mensual) { $('avisoCierre').textContent = 'Escribe cuánto se cobró: pago único, al mes o los dos.'; $('avisoCierre').hidden = false; return false; }
      $('hojaListo').disabled = true;
      const r = await api('cobro', { tel: elegido.tel, total, mensual });
      $('hojaListo').disabled = false;
      if (!r.ok) { $('avisoCierre').textContent = 'No se pudo guardar. Vuelve a intentar.'; $('avisoCierre').hidden = false; return false; }
      cargarTablero();
    });
  let espera = 0, lista = [];
  const buscar = async () => {
    const r = await api('buscar_persona', { q: $('busca').value });
    lista = r.lista || [];
    $('resultados').innerHTML = lista.map((x, i) => `<button class="fila elegible" type="button" data-i="${i}"><div><b>${esc(x.negocio || x.nombre || x.tel)}</b><small>${esc(x.nombre && x.negocio ? x.nombre : '')}${x.etapa ? ' · ' + esc(x.etapa) : ''}</small></div><span class="monto" style="color:var(--cobalto)">Elegir</span></button>`).join('') || '<p class="nota">No encontré a nadie con eso.</p>';
    $('resultados').querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
      elegido = lista[Number(b.dataset.i)];
      $('resultados').hidden = true; $('montos').hidden = false;
      $('elegidoTxt').innerHTML = `<b>${esc(elegido.negocio || elegido.nombre)}</b> pasa a "cerrado" en el CRM.`;
      if (elegido.cobro_total) $('mTotal').value = elegido.cobro_total;
      if (elegido.cobro_mensual) $('mMes').value = elegido.cobro_mensual;
    });
  };
  $('busca').oninput = () => { elegido = null; $('resultados').hidden = false; $('montos').hidden = true; clearTimeout(espera); espera = setTimeout(buscar, 250); };
  buscar();
};

/* ---------- Arranque: con sesión del Centro es Dan; sin sesión es la puerta abierta ---------- */
function entrarAbierta() {
  modo = 'abierta';
  $('pestanas').hidden = true; $('cabeza').hidden = false;
  $('cabEti').textContent = 'MOON Digital';
  $('cabTitulo').textContent = 'Prueba tu propio recepcionista';
  $('lNegocio').textContent = 'Nombre de tu negocio';
  $('lGiro').textContent = '¿A qué se dedica tu negocio?';
  $('crear').textContent = 'Crear mi demo y hablarle';
  document.title = 'Prueba tu propio recepcionista · MOON Digital';
  mostrar('paso1');
}
(async () => {
  if (!sesion() || PARAMS.has('abierta')) return entrarAbierta();
  const r = await api('mios');
  if (!r.ok) return entrarAbierta();
  $('cabEti').textContent = 'MOON Digital · Demos';
  $('cabTitulo').textContent = 'Arma el recepcionista de tu prospecto';
  $('pestanas').hidden = false;
  mostrar(PARAMS.get('ver') === 'tablero' ? 'tablero' : 'forma');
})();
</script>
</body>
</html>
