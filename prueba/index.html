<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tu asistente virtual · Demostración</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3efe9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171b" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* La página del prospecto: un solo botón redondo para hablar. Cabe en una pantalla, sin scroll. */
:root{
  --fondo:#f3efe9; --tarjeta:#f6f3ee; --campo:#ece7e0; --tinta:#1d1d22; --suave:#5d5d66; --tenue:#8b8a92;
  --cobalto:#0b4fd6; --rojo:#d9534a; --verde:#2f9e5a;
  --sombra:0 24px 48px -18px rgba(11,79,214,.45),0 4px 10px rgba(120,105,85,.12),inset 0 1px 0 rgba(255,255,255,.35);
  --ease:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme:dark){:root{
  --fondo:#16171b; --tarjeta:#1d1e23; --campo:#25262c; --tinta:#efedea; --suave:#b3b1b8; --tenue:#85848c;
  --cobalto:#3a78ff; --rojo:#ef7b72; --verde:#5cc283;
  --sombra:0 24px 48px -18px rgba(58,120,255,.55),0 4px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);
}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--fondo);color:var(--tinta);font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
[hidden]{display:none!important}
main{height:100%;max-width:520px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 1fr auto;text-align:center;gap:12px}
.eti{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--suave)}
.arriba{display:flex;flex-direction:column;gap:10px;align-items:center}
h1{font-size:clamp(28px,8vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.08;text-wrap:balance;overflow-wrap:anywhere}
.sub{color:var(--suave);font-size:16px;line-height:1.4;text-wrap:balance}
.centro{display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:22px;min-height:0}
/* El botón: un círculo cobalto. Mientras el asistente habla, un anillo crece con su voz. */
.disco{position:relative;width:min(56vw,230px,26vh);aspect-ratio:1;display:grid;place-items:center}
.anillo{position:absolute;inset:0;border-radius:50%;background:var(--cobalto);opacity:.16;transform:scale(var(--v,1));transition:transform .12s linear,opacity .4s var(--ease)}
.hablar{position:relative;width:78%;aspect-ratio:1;border-radius:50%;background:var(--cobalto);color:#fff;box-shadow:var(--sombra);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:min(17px,4.4vw);text-align:center;line-height:1.15;transition:background .35s var(--ease),transform .2s var(--ease)}
.hablar:active{transform:scale(.96)}
.hablar svg{width:38%;height:auto}
.hablar.colgar{background:var(--rojo)}
.estado{font-weight:700;font-size:17px;min-height:1.4em}
.pista{color:var(--tenue);font-size:15px;line-height:1.4;max-width:320px;text-wrap:balance}
.aviso{color:var(--rojo);font-weight:700;font-size:15px;line-height:1.4;max-width:340px}
.pie{font-size:13px;color:var(--tenue)}
.pie a{color:inherit;font-weight:700}
.entra{animation:entra .45s var(--ease) both}
/* Al terminar: el botón se hace chico y aparecen las tres opciones de seguimiento. */
.centro.fin{gap:14px}
.centro.fin .disco,.centro.fin #estado{display:none}
.fin-sub #sub{display:none}
.par2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seguir{width:100%;max-width:380px;display:grid;gap:10px}
.op{border-radius:999px;height:52px;padding:0 18px;font-weight:800;font-size:16px;background:var(--cobalto);color:#fff;white-space:nowrap;transition:transform .2s var(--ease)}
.op:active{transform:scale(.97)}
.op.dos{background:var(--tarjeta);color:var(--tinta);box-shadow:0 10px 22px -12px rgba(120,105,85,.4)}
.op.tres{background:none;color:var(--suave);height:40px;font-weight:700;font-size:15px}
.gracias{font-weight:700;font-size:17px;line-height:1.4;max-width:340px;text-wrap:balance}
/* Hoja para dejar nombre y WhatsApp (solo si no los conocemos). */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .3s var(--ease);z-index:5}
.velo.ver{opacity:1}
.hoja{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:var(--fondo);border-radius:28px 28px 0 0;padding:22px 16px max(16px,env(safe-area-inset-bottom));display:grid;gap:12px;transform:translateY(100%);transition:transform .35s var(--ease);z-index:6;text-align:start}
.hoja.ver{transform:none}
.hoja h2{font-size:20px;font-weight:800}
.hoja label{display:grid;gap:5px;font-weight:700;font-size:14px}
.hoja input{font:inherit;font-size:16px;color:inherit;border:0;background:var(--campo);border-radius:18px;height:48px;padding:0 16px;width:100%}
.hoja input:focus{outline:2px solid var(--cobalto)}
@keyframes entra{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<main>
  <div class="arriba entra">
    <span class="eti" id="eti">Demostración</span>
    <h1 id="titulo">Cargando…</h1>
    <p class="sub" id="sub"></p>
  </div>

  <div class="centro entra" id="zona" hidden>
    <div class="disco">
      <span class="anillo" id="anillo"></span>
      <button class="hablar" id="boton" aria-label="Hablar">
        <svg id="icoMic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <svg id="icoColgar" hidden viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-2.6 0-5.1.6-7.3 1.7-.6.3-1 .9-1 1.6v2.4c0 .8.7 1.4 1.5 1.3l3-.4c.6-.1 1.1-.6 1.2-1.2l.3-1.8c1.5-.4 3.1-.4 4.6 0l.3 1.8c.1.6.6 1.1 1.2 1.2l3 .4c.8.1 1.5-.5 1.5-1.3v-2.4c0-.7-.4-1.3-1-1.6A16.4 16.4 0 0 0 12 9z"/></svg>
        <span id="botonTexto">Hablar</span>
      </button>
    </div>
    <p class="estado" id="estado"></p>
    <p class="pista" id="pista"></p>
    <p class="aviso" id="aviso" hidden></p>
    <div class="seguir" id="seguir" hidden>
      <button class="op" data-op="quiero">Me gustó, quiero uno</button>
      <button class="op dos" data-op="llamada">Quiero agendar una llamada</button>
      <div class="par2"><button class="op tres" data-op="no">Ahorita no</button><button class="op tres" id="otraVez">Hablarle otra vez</button></div>
    </div>
    <p class="gracias" id="gracias" hidden></p>
  </div>

  <p class="pie">Demostración preparada por <a href="https://moondigitalia.com" target="_blank" rel="noopener">MOON Digital</a></p>
</main>

<div class="velo" id="velo" hidden></div>
<form class="hoja" id="hoja" hidden autocomplete="on">
  <h2>¿A dónde te escribimos?</h2>
  <label>Tu nombre<input name="nombre" maxlength="80" autocomplete="name" required></label>
  <label>Tu WhatsApp<input name="whatsapp" type="tel" inputmode="tel" maxlength="20" autocomplete="tel" placeholder="10 dígitos" required></label>
  <p class="aviso" id="hojaAviso" hidden></p>
  <button class="op" id="hojaListo">Listo</button>
</form>
<script src="https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.27.0/dist/lib.iife.js"></script>
<script>
const $ = id => document.getElementById(id);
const codigo = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '').toLowerCase();
let demo = null, agente = '', vozId = '', conv = null, estado = 'listo', anim = 0, conecto = false, inicio = '', t0 = 0, opElegida = '';

async function api(accion, extra) {
  const r = await fetch('/api/prueba', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ accion, codigo }, extra || {})) }).catch(() => null);
  if (!r) return { ok: false, error: 'red' };
  return r.json().catch(() => ({ ok: false, error: 'red' }));
}

function pintar(nuevo) {
  estado = nuevo;
  const enLlamada = estado === 'conectando' || estado === 'escuchando' || estado === 'hablando';
  $('boton').classList.toggle('colgar', enLlamada);
  $('icoMic').hidden = enLlamada; $('icoColgar').hidden = !enLlamada;
  $('botonTexto').textContent = enLlamada ? 'Colgar' : (estado === 'termino' ? 'Hablar otra vez' : 'Hablar');
  $('boton').setAttribute('aria-label', $('botonTexto').textContent);
  $('zona').classList.toggle('fin', estado === 'termino' && !opElegida);
  document.body.classList.toggle('fin-sub', estado === 'termino');
  $('seguir').hidden = estado !== 'termino' || !!opElegida;
  $('gracias').hidden = estado !== 'termino' || !opElegida;
  $('estado').textContent = { listo: '', conectando: 'Conectando…', escuchando: 'Te escucho', hablando: `${demo.asistente} está hablando`, termino: 'Llamada terminada' }[estado] || '';
  $('pista').hidden = estado === 'termino' && !!opElegida;
  $('pista').textContent = estado === 'termino'
    ? (opElegida ? '' : `¿Qué te pareció cómo atendió ${demo.asistente}?`)
    : estado === 'listo' ? 'Pica el botón y, si tu celular pregunta, permite el micrófono. Luego háblale como cliente: pregunta precios, horarios o pide una cita.'
    : 'Háblale como si fueras un cliente: pregunta precios u horarios, o pide una cita.';
}

// El anillo crece con la voz del asistente.
function latir() {
  cancelAnimationFrame(anim);
  const paso = () => {
    let v = 0;
    try { v = conv && estado === 'hablando' ? conv.getOutputVolume() : 0; } catch (e) {}
    $('anillo').style.setProperty('--v', (1 + Math.min(v * 1.6, .32)).toFixed(3));
    anim = requestAnimationFrame(paso);
  };
  paso();
}

function aviso(t) { $('aviso').textContent = t; $('aviso').hidden = !t; }

async function empezar() {
  aviso('');
  conecto = false;
  pintar('conectando');
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true }).then(s => s.getTracks().forEach(t => t.stop()));
  } catch (e) {
    pintar('listo');
    aviso('Para hablar con el asistente, permite el uso del micrófono cuando tu celular te lo pregunte.');
    return;
  }
  try {
    conv = await ElevenLabsClient.Conversation.startSession({
      agentId: agente,
      connectionType: 'websocket', // la voz por websocket sí manda de qué página viene (el candado de origen la deja pasar; por webrtc se rechazaba)
      dynamicVariables: { negocio: demo.negocio, asistente: demo.asistente, giro: demo.giro || '', servicios: demo.servicios || 'No hay lista de servicios todavía.', horario: demo.horario || 'No se indicó.', ubicacion: demo.ubicacion || 'No se indicó.' },
      overrides: { tts: { voiceId: vozId } },
      onConnect: () => { conecto = true; t0 = Date.now(); pintar('escuchando'); api('uso').then(r => { inicio = (r && r.inicio) || ''; }); },
      onModeChange: m => { if (estado !== 'termino') pintar(m && m.mode === 'speaking' ? 'hablando' : 'escuchando'); },
      // Si nunca llegó a conectar, no es "llamada terminada": se dice qué pasó y el botón queda listo para reintentar.
      onDisconnect: () => { conv = null; terminar(); if (conecto) pintar('termino'); else { pintar('listo'); aviso(`${demo.asistente} está atendiendo a otras personas en este momento. Intenta de nuevo en unos minutos.`); } },
      onError: () => { aviso('Se cortó la conexión. Pica el botón para volver a intentar.'); },
    });
    latir();
  } catch (e) {
    conv = null;
    pintar('listo');
    aviso('No se pudo conectar. Revisa tu internet y vuelve a picar el botón.');
  }
}

// Cuánto duró la plática (para el gasto del día en el tablero de Dan).
function terminar() {
  if (!inicio || !t0) return;
  const cuerpo = JSON.stringify({ accion: 'fin', codigo, inicio, segundos: Math.round((Date.now() - t0) / 1000) });
  inicio = ''; t0 = 0;
  try { navigator.sendBeacon('/api/prueba', new Blob([cuerpo], { type: 'application/json' })); } catch (e) {}
}
addEventListener('pagehide', terminar);

/* ---------- Seguimiento: qué le pareció ---------- */
const GRACIAS = {
  quiero: '¡Qué gusto! El equipo de MOON Digital te escribe por WhatsApp para armar el tuyo.',
  llamada: 'Listo. El equipo de MOON Digital te escribe por WhatsApp para agendar la llamada.',
  no: 'Gracias por probarlo. Aquí sigue tu demo cuando quieras volver a hablarle.',
};
async function elegir(op, extra) {
  const r = await api('respuesta', Object.assign({ opcion: op }, extra || {}));
  if (r.error === 'whatsapp') return pedirDatos(op);
  if (!r.ok) { aviso('No se pudo enviar. Revisa tu internet y vuelve a picar.'); return false; }
  opElegida = op; aviso('');
  $('gracias').textContent = GRACIAS[op]; $('gracias').hidden = false;
  pintar(estado);
  return true;
}
function pedirDatos(op) {
  $('velo').hidden = false; $('hoja').hidden = false; $('hojaAviso').hidden = true;
  requestAnimationFrame(() => requestAnimationFrame(() => { $('velo').classList.add('ver'); $('hoja').classList.add('ver'); }));
  $('hoja').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData($('hoja'));
    if (String(f.get('whatsapp') || '').replace(/\D/g, '').length < 10) { $('hojaAviso').textContent = 'Escribe tu WhatsApp completo, con 10 dígitos.'; $('hojaAviso').hidden = false; return; }
    $('hojaListo').disabled = true;
    const ok = await elegir(op, { nombre: f.get('nombre'), whatsapp: f.get('whatsapp') });
    $('hojaListo').disabled = false;
    if (ok) cerrarHoja();
  };
}
function cerrarHoja() { $('velo').classList.remove('ver'); $('hoja').classList.remove('ver'); setTimeout(() => { $('velo').hidden = true; $('hoja').hidden = true; }, 350); }
$('velo').onclick = cerrarHoja;
$('otraVez').onclick = () => { aviso(''); empezar(); };
document.querySelectorAll('[data-op]').forEach(b => b.onclick = () => {
  const op = b.dataset.op;
  if (op !== 'no' && !demo.conocido) return pedirDatos(op);
  elegir(op);
});

async function colgar() {
  const c = conv; conv = null;
  try { if (c) await c.endSession(); } catch (e) {}
  terminar();
  pintar('termino');
}

$('boton').onclick = () => (estado === 'conectando' || estado === 'escuchando' || estado === 'hablando') ? colgar() : empezar();

(async () => {
  const r = codigo ? await api('datos') : { ok: false, error: 'no_existe' };
  if (!r.ok) {
    $('titulo').textContent = r.error === 'red' ? 'Sin conexión' : 'Este link no existe';
    $('sub').textContent = r.error === 'red' ? 'Revisa tu internet y vuelve a abrir el link.' : 'Revisa que el link esté completo, tal como te lo mandaron.';
    return;
  }
  demo = r.demo; agente = r.agente; vozId = r.voz_id;
  document.title = `${demo.asistente} · ${demo.negocio}`;
  $('eti').textContent = 'Demostración para';
  $('titulo').textContent = demo.negocio;
  $('sub').textContent = `Habla con ${demo.asistente}, el asistente virtual que atendería a tus clientes.`;
  $('zona').hidden = false;
  if (!window.ElevenLabsClient) aviso('No se pudo cargar la voz. Revisa tu internet y vuelve a abrir el link.');
  pintar('listo');
})();
</script>
</body>
</html>
