<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16161a">
<title>Oficina MOON</title>
<style>
/* OFICINA MOON — paso 1 (sistemas). La piel 3D se pone encima después sin tocar esto.
   REGLAS (las mide el juez de la oficina en todas las pantallas):
   1. Nada se mueve con el teclado: la página mide lo que mide la pantalla, nunca lo que deja el teclado.
   2. Ningún texto se tapa ni se corta: en el mapa cada texto vive dentro de su cuarto y se acomoda solo (crece con
      el zoom: para leer de cerca, se acerca); en el panel, el texto se parte en renglones, nunca se sale.
   3. Nítido en cualquier zoom: el mapa se vuelve a dibujar a su tamaño real al soltar los dedos.
   4. El mapa es para mirar (mapa + información); lo que es para trabajar (CRM, Librería) usa la pantalla completa.
      Las alertas solo viven en el mapa.
   5. Un toque, una acción.
   6. Nada aparece de golpe: cada vista entra ya lista, con un fundido corto. */
:root{
  --fondo:#16161a; --piso:#1e2b2d; --cuarto:#2b2b33; --linea:#3a3a43; --tinta:#f3f2ee; --suave:#b4b3bb;
  --verde:#3ccf7a; --amarillo:#f2c230; --rojo:#ef4b4b; --naranja:#ff7a1a; --azul:#8fb6ff;
  --alto:100vh; --t:160ms;
}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--fondo);color:var(--tinta);
  font:700 16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{position:fixed;left:0;top:0;right:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;font-size:16px}
a{color:var(--azul)}
small{font-size:15px;font-weight:600}
.vista{position:absolute;left:0;top:0;width:100%;height:var(--alto);background:var(--fondo);transition:opacity var(--t) ease}
.vista.sale{opacity:0;pointer-events:none}

/* ---------- Mapa + información ---------- */
#mapa{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
@media (min-aspect-ratio:1/1) and (min-width:640px){#mapa{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) minmax(320px,38%)}}
#oficina{position:relative;overflow:hidden;touch-action:none;background:var(--piso);cursor:grab;user-select:none;-webkit-user-select:none}
#mundo{position:absolute;left:0;top:0;width:1200px;height:800px;transform-origin:0 0}
#mundo.mueve{will-change:transform}
.cuarto{position:absolute;background:var(--cuarto);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.cuarto.sel{box-shadow:inset 0 0 0 3px var(--tinta)}
.cuarto.gris{background:#26262b}
.cuarto.cerrado{background:#1b1b20}
.cuarto h3{font-size:20px;font-weight:900}
.cuarto .gente{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.mono{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 7px;border-radius:16px;background:#3a3a44;font-size:17px;max-width:100%}
.mono span.n{min-width:0;overflow-wrap:anywhere}
.mono.muerto{background:#2e2e33;color:var(--suave)}
.mono.fuera{opacity:.45}
.claude{background:var(--naranja);color:#141414;padding:7px 12px;border-radius:16px;font-size:17px;overflow-wrap:anywhere}
.cuarto p{font-size:16px;color:var(--suave)}
.luz{display:inline-block;width:13px;height:13px;border-radius:50%;flex:none}
.verde{background:var(--verde)} .amarillo{background:var(--amarillo)} .rojo{background:var(--rojo)} .gris{background:#6b6b73}
/* Piel 3D: los nombres solo aparecen cuando ya se pueden leer (nivel de acercamiento) */
#mundo svg .nom{display:none}
#mundo.leer svg .nom{display:inline}
#mundo svg [data-c],#mundo svg [data-a]{cursor:pointer}
.suena{animation:suena .9s ease-in-out 6}
#mundo.mueve .suena{animation-play-state:paused}   /* mientras se mueve el mapa no se vuelve a pintar todo por el teléfono */
@keyframes suena{0%,60%,100%{transform:rotate(0)}10%,30%,50%{transform:rotate(-14deg)}20%,40%{transform:rotate(14deg)}}
.globo{background:#ff7a1a;color:#141414;font:800 12px/1.25 system-ui,sans-serif;padding:6px 9px;border-radius:12px;display:inline-block;max-width:200px}
#hud{position:absolute;right:8px;top:8px;display:flex;gap:6px;pointer-events:none}
#hud span{background:#000b;padding:4px 10px;border-radius:12px;font-size:14px}

#info{display:flex;flex-direction:column;min-height:0;border-top:2px solid var(--linea)}
@media (min-aspect-ratio:1/1) and (min-width:640px){#info{border-top:0;border-left:2px solid var(--linea)}}
.cab{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:52px;border-bottom:1px solid #2a2a31}
.cab h2{font-size:18px;font-weight:900;flex:1;min-width:0;overflow-wrap:anywhere}
.cuerpo{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 14px 18px;-webkit-overflow-scrolling:touch;overflow-wrap:anywhere}
.fila{display:block;width:100%;padding:10px 0;border-bottom:1px solid #2a2a31}
.fila small{display:block;color:var(--suave);font-size:15px;font-weight:600}
.acciones{display:flex;gap:10px;margin:6px 0 4px;flex-wrap:wrap}
.accion{flex:1 1 0;min-width:140px;text-align:center;padding:12px 14px;border-radius:999px;background:var(--azul);color:#101317;font-weight:800;font-size:16px;text-decoration:none}
.accion+.accion{background:#2a2a31;color:#f3f2ee}
.contexto{margin:10px 0 6px;font-size:16px;line-height:1.45;font-weight:600;color:#e9e8e3}
.contexto.chico{font-size:14px;color:var(--suave);margin-top:4px}
.titulo{font-size:14px;color:var(--suave);margin:14px 0 2px;letter-spacing:.03em}
.vida{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:baseline;padding:8px 0}
.vida small{color:var(--suave);font-size:15px;font-weight:600}
.barra{grid-column:1/-1;height:10px;border-radius:5px;background:#2a2a31;overflow:hidden;margin-top:5px}
.barra i{display:block;height:100%;border-radius:5px}
.aviso{color:var(--amarillo)}
.etq{display:inline-block;font-size:14px;padding:2px 9px;border-radius:10px;background:#33333b;color:var(--suave);margin-right:4px}
.etq.cli{background:#1f3357;color:var(--azul)}
.alerta{color:var(--rojo)}

/* ---------- Pantalla completa (trabajar) ---------- */
#herramienta{display:flex;flex-direction:column;background:var(--fondo)}
#volver{color:var(--azul);font-weight:800;padding:6px 4px;white-space:nowrap}
.escribe{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid #2a2a31}
.escribe input{flex:1;min-width:0;background:#24242b;border:0;border-radius:14px;padding:12px 14px;color:var(--tinta);outline:none}
.escribe button{background:var(--tinta);color:#141414;border-radius:14px;padding:0 16px;font-weight:900}
.msj{padding:10px 12px;border-radius:14px;margin:8px 0;background:#24242b;white-space:pre-wrap}
.msj.yo{background:#33333b;color:var(--suave)}

/* ---------- Entrada ---------- */
#entrada{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
#entrada h1{font-size:24px;font-weight:900;text-align:center}
#personajes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#personajes button{width:96px;padding:14px 0;border-radius:18px;background:#24242b;font-weight:900;text-align:center;box-shadow:inset 0 0 0 2px transparent}
#personajes button.si{box-shadow:inset 0 0 0 2px var(--tinta)}
#entrada form{display:flex;gap:8px;width:min(340px,100%)}
#entrada input{flex:1;min-width:0;background:#24242b;border:0;border-radius:14px;padding:12px 14px;color:var(--tinta)}
#entrada form button{background:var(--tinta);color:#141414;border-radius:14px;padding:0 16px;font-weight:900}
</style>
</head>
<body>
<div id="mapa" class="vista" hidden>
  <div id="oficina"><div id="mundo"></div><div id="hud"></div></div>
  <section id="info"><div class="cab"><h2 id="infoT"></h2></div><div class="cuerpo" id="infoC"></div></section>
</div>
<div id="herramienta" class="vista" hidden>
  <div class="cab"><button id="volver">‹ Oficina</button><h2 id="herrT"></h2></div>
  <form class="escribe" id="escribe" autocomplete="off"><input id="texto" enterkeyhint="send" maxlength="600"><button>Preguntar</button></form>
  <div class="cuerpo" id="herrC"></div>
</div>
<div id="entrada" class="vista" hidden>
  <h1>¿Quién entra a la oficina?</h1>
  <div id="personajes"></div>
  <form id="clave" hidden><input type="password" id="pass" placeholder="Tu contraseña" autocomplete="current-password"><button>Entrar</button></form>
  <p id="error" class="aviso"></p>
</div>
<script src="/oficina/piel.js"></script>
<script>
'use strict';
const LLAVE = 'centro.moon.sesion';   // la misma sesión del Tablero
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const ses = () => { try { return localStorage.getItem(LLAVE) || ''; } catch (e) { return ''; } };
async function pide(api, accion, datos) {
  try {
    const r = await fetch(api, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-sesion': ses() }, body: JSON.stringify(Object.assign({ accion }, datos || {})) });
    const j = await r.json().catch(() => ({ ok: false, error: 'red' }));
    if (r.status === 401 || j.error === 'sesion') salir();
    return j;
  } catch (e) { return { ok: false, error: 'red', mensaje: 'Sin conexión. Se vuelve a intentar solo.' }; }
}
const centro = (a, d) => pide('/api/centro', a, d);
const oficina = (a, d) => pide('/api/oficina', a, d);
const NOMBRE = { kid: 'Kid', daniel: 'Papá', dan: 'Dan' };

// ---------- Regla 1: la página mide lo que mide la pantalla; el teclado nunca la cambia ----------
// Solo se vuelve a medir cuando cambia el ANCHO (girar el aparato o cambiar la ventana), nunca por el teclado.
let anchoMedido = 0;
function medir() {
  if (window.innerWidth === anchoMedido) return false;
  anchoMedido = window.innerWidth;
  document.documentElement.style.setProperty('--alto', window.innerHeight + 'px');
  return true;
}
medir();
addEventListener('resize', () => { if (medir() && !$('#mapa').hidden) ajustarVista(); });

function mostrar(id) {
  // Como en el Tablero: la vista nueva ya está completa DEBAJO y la anterior se desvanece ENCIMA.
  // Nunca se aparece "desde transparente" (eso se ve como parpadeo).
  const nueva = document.getElementById(id);
  const vieja = ['mapa', 'herramienta', 'entrada'].map(v => document.getElementById(v)).find(e => e !== nueva && !e.hidden);
  nueva.hidden = false; nueva.style.zIndex = 1;
  if (!vieja) return;
  vieja.style.zIndex = 2; vieja.classList.add('sale');
  setTimeout(() => { vieja.hidden = true; vieja.classList.remove('sale'); vieja.style.zIndex = ''; }, 170);
}

// ---------- Entrada ----------
let elegido = null;
async function entrada() {
  mostrar('entrada');
  const j = await centro('quienes');
  $('#personajes').innerHTML = (j.usuarios || []).filter(u => NOMBRE[u.id]).map(u => `<button data-id="${u.id}">${NOMBRE[u.id]}</button>`).join('');
}
$('#personajes').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  elegido = b.dataset.id; [...$('#personajes').children].forEach(x => x.classList.toggle('si', x === b));
  $('#clave').hidden = false; $('#pass').focus({ preventScroll: true });
};
$('#clave').onsubmit = async e => {
  e.preventDefault();
  const j = await centro('entrar', { usuario: elegido, clave: $('#pass').value });
  if (!j.ok) { $('#error').textContent = j.error === 'pausa' ? 'Muchos intentos. Espera 15 minutos.' : j.error === 'sin_clave' ? 'Primero crea tu contraseña en el Tablero.' : 'Esa contraseña no es.'; return; }
  try { localStorage.setItem(LLAVE, j.sesion); } catch (x) {}
  $('#pass').blur(); arrancar();
};
function salir() { try { localStorage.removeItem(LLAVE); } catch (e) {} entrada(); }

// ---------- Datos ----------
let O = null, C = null, sel = { tipo: 'resumen' }, reloj = null;
async function cargar() {
  const [a, b] = await Promise.all([oficina('estado'), centro('inicio')]);
  if (a.ok) O = a.oficina;
  if (b.ok) C = b;
  // Lo que se está usando no se toca: el mapa se refresca solo si está a la vista; la pantalla completa, nunca.
  if (!$('#mapa').hidden) { dibujarMundo(); pintarInfo(true); }
}
async function arrancar() {
  if (!ses()) return entrada();
  await cargar();
  if (!O) return;
  mostrar('mapa'); ajustarVista(); dibujarMundo(); pintarInfo();
  clearInterval(reloj); reloj = setInterval(cargar, 60e3);   // leer la base no cuesta: cada minuto
}
addEventListener('popstate', () => {
  const h = history.state || {};
  if (h.herramienta) abrirHerramienta(h.herramienta, h.tel, true);
  else if (O) { mostrar('mapa'); dibujarMundo(); pintarInfo(true); ajustarVista(); }
});

// ---------- Alertas: solo en el mapa ----------
function alertas() {
  if (!O) return [];
  const l = [];
  // Cada alerta trae su porqué: qué está pasando y qué conviene hacer (cualquiera la entiende sin preguntar).
  const A = (t, por) => { const x = new String(t); x.por = por; return x; };
  ((O.asistentes && O.asistentes.lista) || []).forEach(a => { if (a.estado === 'rojo') l.push(A(a.nombre + ': ' + (a.nota || 'falla'), 'Este asistente está fallando y la gente que le escribe puede quedarse sin respuesta. Pídele a Claude que lo revise.')); });
  ((O.tareas && O.tareas.lista) || []).forEach(t => { const tarde = t.siguiente && Date.now() - Date.parse(t.siguiente) > 2 * 3600e3;
    if (t.resultado !== 'bien' || tarde) l.push(A('Robot con falla: ' + t.nombre, (tarde ? 'Le tocaba trabajar y no ha corrido.' : 'La última vez que trabajó algo le salió mal.') + ' Mientras no se arregle, lo que hace ese robot no se está haciendo. Pídele a Claude que lo revise.')); });
  ((O.suscripciones && O.suscripciones.lista) || []).forEach(s => { if (s.color === 'rojo') l.push(A(s.nombre + (s.faltan < 0 ? ': se pasó la fecha de pago' : ': se cobra ' + (s.faltan === 0 ? 'hoy' : s.faltan === 1 ? 'mañana' : 'en ' + s.faltan + ' días')), 'Es un servicio que pagamos cada mes. Revisa que haya saldo en la tarjeta o decide si todavía lo necesitamos.')); });
  if (O.publicaciones && O.publicaciones.fallidas) l.push(A(O.publicaciones.fallidas + ' publicaciones fallaron hoy', 'Un cambio a una página no se subió a internet: la página sigue con la versión anterior.'));
  if (O.medicionAtrasada) l.push(A('La medición de cada hora no ha corrido', 'El robot que llena esta oficina no ha trabajado: los números que ves pueden ser viejos.'));
  return l;
}

// ---------- El mundo: cada texto vive dentro de su cuarto y se acomoda solo ----------
const CUARTOS = [
  { id: 'recepcion', t: 'Recepción · Jason', x: 20, y: 20, w: 260, h: 170 },
  { id: 'clientes', t: 'Clientes que pagan', x: 300, y: 20, w: 560, h: 330 },
  { id: 'demos', t: 'Demos', x: 880, y: 20, w: 300, h: 230 },
  { id: 'cubiculos', t: 'Cubículos', x: 20, y: 210, w: 260, h: 230 },
  { id: 'robots', t: 'Robots', x: 880, y: 270, w: 300, h: 200 },
  { id: 'crm', t: 'CRM', x: 300, y: 370, w: 270, h: 200, herramienta: 'crm' },
  { id: 'libreria', t: 'Librería', x: 590, y: 370, w: 270, h: 200, herramienta: 'libreria' },
  { id: 'crea', t: 'Crea tu recepcionista', x: 20, y: 460, w: 260, h: 110, herramienta: 'crea' },
  { id: 'gris', t: 'Cuarto gris', x: 300, y: 590, w: 560, h: 190 },
  { id: 'oracion', t: 'Oración', x: 880, y: 490, w: 140, h: 290 },
  { id: 'cerrado', t: 'Puerta cerrada', x: 1040, y: 490, w: 140, h: 290 },
];
function dibujarMundo() {
  if (!O) return;
  if (window.Piel) {
    const luz = new URLSearchParams(location.search).get('luz');
    const hora = luz === 'morada' ? 21 : luz === 'amarilla' ? 15 : luz === 'mostaza' ? 9 : (O.ahora ? O.ahora.hora : 12);
    const r = Piel.dibuja(O, C, sel, hora);
    const cambio = MUNDO.w !== r.ancho; MUNDO.w = r.ancho; MUNDO.h = r.alto; MUNDO.mono = r.monito;
    const m = $('#mundo'); m.style.width = r.ancho + 'px'; m.style.height = r.alto + 'px'; m.innerHTML = r.svg;
    Piel.vida(m, O, C);   // los monitos siguen donde iban aunque se vuelva a dibujar
    if (Piel.cargar && !Piel.cargado) Piel.cargar().then(dibujarMundo);   // los monitos 3D llegan después; mientras, los dibujados
    if (cambio) ajustarVista();
    const al = alertas().length;
    $('#hud').innerHTML = `<span>Semana $${(O.gasto || {}).usd7d || 0}</span>` + (al ? `<span class="alerta">● ${al}</span>` : '');
    return;
  }
  const as = (O.asistentes && O.asistentes.lista) || [];
  const mono = (a, clase) => `<span class="mono ${clase || ''}" data-a="${esc(a.id)}"><span class="luz ${a.estado || 'gris'}"></span><span class="n">${clase === 'muerto' ? '✕✕ ' : ''}${esc(a.nombre)}${a.platicas7d ? ' · ' + a.platicas7d : ''}</span></span>`;
  const ult = O.actividad && O.actividad.lineas && O.actividad.lineas[0];
  const ll = (C && C.llamadas) || [], hoy = ll.filter(l => Date.now() - Date.parse(l.fecha) < 864e5).length;
  const dentro = {
    recepcion: `<div class="gente">${as.filter(a => a.id === 'jason').map(a => mono(a)).join('')}</div><p>${hoy} llamada${hoy === 1 ? '' : 's'} hoy</p>`,
    clientes: `<div class="gente">${as.filter(a => a.tipo === 'cliente').map(a => mono(a)).join('')}</div>${ult ? `<div class="claude">🤖 ${esc(ult.texto)}</div>` : ''}`,
    demos: `<div class="gente">${as.filter(a => a.tipo === 'demo').map(a => mono(a)).join('')}</div>`,
    cubiculos: `<div class="gente">${(O.cubiculos || []).map(u => `<span class="mono${u.presente ? '' : ' fuera'}"><span class="luz ${u.presente ? 'verde' : 'gris'}"></span><span class="n">${NOMBRE[u.id]}${u.presente ? '' : ' · silla vacía'}</span></span>`).join('')}</div>`,
    robots: `<div class="gente">${((O.tareas && O.tareas.lista) || []).map(t => `<span class="mono"><span class="luz ${t.resultado !== 'bien' ? 'rojo' : 'verde'}"></span><span class="n">🤖</span></span>`).join('')}</div>`,
    crm: `<p>${((C && C.personas) || []).length} personas</p>`,
    libreria: `<div class="gente"><span class="mono"><span class="luz verde"></span><span class="n">Jason</span></span></div><p>${O.libreria.hoy} de ${O.libreria.tope} preguntas hoy</p>`,
    crea: '',
    gris: `<div class="gente">${as.filter(a => a.tipo === 'dijo_no' || a.tipo === 'archivado' || a.id === 'donde').map(a => mono(a, 'muerto')).join('')}</div>`,
    oracion: `<div class="gente"><span class="mono"><span class="n">Jesús</span></span></div>`,
    cerrado: `<p>Pruebas y copias (${as.filter(a => ['prueba', 'base', 'copia'].includes(a.tipo) && a.id !== 'donde').length})</p>`,
  };
  $('#mundo').innerHTML = CUARTOS.map(c => `<div class="cuarto${c.id === 'gris' ? ' gris' : ''}${c.id === 'cerrado' ? ' cerrado' : ''}${sel.cuarto === c.id ? ' sel' : ''}" data-c="${c.id}" style="left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px"><h3>${esc(c.t)}</h3>${dentro[c.id]}</div>`).join('');
  const al = alertas().length;
  $('#hud').innerHTML = `<span>Semana $${(O.gasto || {}).usd7d || 0}</span>` + (al ? `<span class="alerta">● ${al}</span>` : '');
}

// ---------- Zoom y arrastre solo en el mapa ----------
const vista = { x: 0, y: 0, z: 1 };
const MUNDO = { w: 1200, h: 800, mono: 0 };   // con la piel 3D, toma las medidas de su dibujo
const dedos = new Map(); let movido = false, ini = null, nitido = null;
function aplicar() {
  const m = $('#mundo'); m.classList.add('mueve');
  m.style.transform = `translate(${vista.x}px,${vista.y}px) scale(${vista.z})`;
  m.classList.toggle('leer', vista.z * 12 >= 11);
  // Regla 3: al detenerse, el navegador vuelve a pintar a tamaño real (nada borroso al acercar).
  clearTimeout(nitido); nitido = setTimeout(() => m.classList.remove('mueve'), 150);
}
function ajustarVista() {
  const r = $('#oficina').getBoundingClientRect(); if (!r.width) return;
  vista.z = Math.min(r.width / MUNDO.w, r.height / MUNDO.h); vista.x = (r.width - MUNDO.w * vista.z) / 2; vista.y = (r.height - MUNDO.h * vista.z) / 2; aplicar();
}
function zoomEn(px, py, nuevo) {
  // Lo más lejos: la oficina completa. Lo más cerca: un monito de 160 px de alto (con la piel) o 6 veces la vista completa.
  const r = $('#oficina').getBoundingClientRect(), min = Math.min(r.width / MUNDO.w, r.height / MUNDO.h);
  const max = MUNDO.mono ? 160 / MUNDO.mono : Math.max(min * 6, 1.5);
  nuevo = Math.max(min, Math.min(Math.max(max, min), nuevo));
  vista.x = px - (px - vista.x) * nuevo / vista.z; vista.y = py - (py - vista.y) * nuevo / vista.z; vista.z = nuevo; aplicar();
}
const of = $('#oficina');
of.addEventListener('pointerdown', e => { if (window.Piel && Piel.pausa) Piel.pausa(true); of.setPointerCapture(e.pointerId); dedos.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY }); if (dedos.size === 1) movido = false; ini = null; });
of.addEventListener('pointermove', e => { if (dedos.size && window.Piel && Piel.pausa) Piel.pausa(true);
  const d0 = dedos.get(e.pointerId); if (!d0) return;
  const ax = d0.x, ay = d0.y; d0.x = e.clientX; d0.y = e.clientY;
  const r = of.getBoundingClientRect();
  if (dedos.size === 1) {
    if (Math.abs(e.clientX - d0.x0) + Math.abs(e.clientY - d0.y0) > 6) movido = true;
    if (movido) { vista.x += e.clientX - ax; vista.y += e.clientY - ay; aplicar(); }
  } else if (dedos.size === 2) {
    const [a, b] = [...dedos.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), cx = (a.x + b.x) / 2 - r.left, cy = (a.y + b.y) / 2 - r.top;
    if (ini) { zoomEn(cx, cy, vista.z * d / ini.d); vista.x += cx - ini.cx; vista.y += cy - ini.cy; aplicar(); }
    ini = { d, cx, cy }; movido = true;
  }
});
const suelta = e => { dedos.delete(e.pointerId); ini = null; if (!dedos.size && window.Piel && Piel.pausa) Piel.pausa(false); };
// El toque se atiende en "click" (después de soltar el dedo): si se atendiera al soltar, el "click" que el celular
// manda justo después caería sobre la pantalla nueva y abriría otra cosa sin querer.
of.addEventListener('click', e => { if (!movido) tocar(e.clientX, e.clientY); });
of.addEventListener('pointerup', suelta); of.addEventListener('pointercancel', suelta);
of.addEventListener('wheel', e => { e.preventDefault(); const r = of.getBoundingClientRect(); zoomEn(e.clientX - r.left, e.clientY - r.top, vista.z * Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
['gesturestart', 'gesturechange'].forEach(n => document.addEventListener(n, e => e.preventDefault()));

// Un toque: el monito que está ahí; si no, el cuarto.
function tocar(cx, cy) {
  const el = document.elementFromPoint(cx, cy); if (!el) return;
  const m = el.closest('[data-a]'), c = el.closest('[data-c]');
  if (m && m.dataset.a === 'claude') return elegir({ tipo: 'cubiculos', cuarto: 'cubiculos' });   // el robot naranja: lo último que pasó
  if (m && /^equipo-/.test(m.dataset.a)) return elegir({ tipo: 'cubiculos', cuarto: 'cubiculos' });
  if (m && m.dataset.a === 'jason') return elegir({ tipo: 'recepcion', cuarto: 'recepcion' });   // Jason: lo útil de Jason (llamarle, sus citas y llamadas)
  if (m && /^robot-/.test(m.dataset.a)) return elegir({ tipo: 'robot', i: Number(m.dataset.a.slice(6)), cuarto: 'robots' });   // cada robot dice qué hace
  let cid = c ? c.dataset.c : null;
  if (!cid && window.Piel) { const r = of.getBoundingClientRect(); cid = Piel.cuartoEn((cx - r.left - vista.x) / vista.z, (cy - r.top - vista.y) / vista.z); }   // un mueble o el piso: el cuarto que está debajo
  if (!cid) return;
  const cuarto = CUARTOS.find(k => k.id === cid); if (!cuarto) return;
  if (cuarto.herramienta) return abrirHerramienta(cuarto.herramienta);
  if (m) return elegir({ tipo: 'asistente', id: m.dataset.a, cuarto: cuarto.id });
  elegir({ tipo: cuarto.id, cuarto: cuarto.id });
}
function elegir(s) { sel = s; if (window.Piel) dibujarMundo(); else $('#mundo').querySelectorAll('.cuarto').forEach(x => x.classList.toggle('sel', x.dataset.c === s.cuarto)); pintarInfo(); }

// ---------- Información (abajo o a la derecha) ----------
const hace = f => { if (!f) return ''; const m = Math.round((Date.now() - Date.parse(f)) / 6e4); return m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} días`; };
const fechaC = f => f ? new Date(Date.parse(f)).toLocaleString('es-MX', { timeZone: 'America/Cancun', weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';
const COLOR = { verde: 'var(--verde)', amarillo: 'var(--amarillo)', rojo: 'var(--rojo)', gris: '#6b6b73' };
const liga = p => { if (!p) return ''; const u = /^https:\/\//.test(p) ? p : /^[a-z0-9-]+$/.test(p) ? `https://${p}.vercel.app` : ''; return u ? `<small><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></small>` : ''; };
// CONTEXTO (Kid, 13-nov-2026): todo lo que se toca dice qué es y para qué sirve, para que cualquiera lo entienda.

const LEYENDA = '<p class="contexto chico">La luz de cada uno: verde, todo bien; amarilla, algo que vigilar; roja, está fallando y hay que revisarlo. "Pláticas" son las conversaciones que tuvo en 7 días y "fallas" las que salieron mal.</p>';
function filaAsistente(a, conPara) {
  return `<div class="fila"><span class="luz ${a.estado || 'gris'}"></span> ${esc(a.nombre)} · ${esc(a.de)}${conPara && a.para ? `<small style="color:#e9e8e3">${esc(a.para)}</small>` : ''}<small>${a.platicas7d || 0} pláticas · ${a.fallas7d || 0} fallas · $${a.usd7d || 0} USD en 7 días${a.emergencias === false && (a.tipo === 'cliente' || a.tipo === 'demo') ? ' · sin reglas de emergencia' : ''}</small>${a.nota ? `<small>${esc(a.nota)}</small>` : ''}${liga(a.pagina)}</div>`;
}
function datosLlamada(l) { try { return JSON.parse(l.datos || '{}'); } catch (e) { return {}; } }

    if (tel) h += `<p class="contexto chico">Su número es ${esc(telBonito)}: es el que se le da a los clientes. Llámale para escuchar cómo contesta.</p><div class="acciones"><a class="accion" href="tel:${esc(tel)}">Llamar a Jason</a><a class="accion" href="/tablero?abrir=citas&volver=/oficina">Citas que apartó</a></div>`;
    const prox = ((C && C.citas) || []).filter(c => Date.parse(c.inicio) > Date.now() - 36e5 && !Number(c.prueba)).slice(0, 3);
    h += '<p class="titulo">Próximas citas</p>' + (prox.length ? prox.map(c => `<div class="fila">${esc(c.negocio || c.nombre || 'Sin nombre')}<small>${fechaC(c.inicio)} · ${esc(c.tipo || c.canal || '')}${c.necesidad ? ' · ' + esc(c.necesidad) : ''}</small></div>`).join('') : '<div class="fila">No hay citas próximas.<small>Cuando Jason aparte una, aparece aquí.</small></div>');
    h += '<p class="titulo">Sus llamadas</p><p class="contexto chico">Las que dicen Prueba las hicimos nosotros.</p>';
    const ll = ((C && C.llamadas) || []).slice(0, 12);
    h += ll.length ? ll.map(l => { const d = datosLlamada(l); const per = ((C && C.personas) || []).find(p => p.tel === l.quien) || {};
      return `<div class="fila"><span class="etq${Number(l.prueba) ? '' : ' cli'}">${Number(l.prueba) ? 'Prueba' : 'Cliente'}</span> ${esc(per.negocio || d.negocio || per.nombre || d.nombre || 'Sin nombre')}<small>${esc(l.resumen || '')} · ${hace(l.fecha)}</small></div>`; }).join('') : '<p class="fila">Todavía no hay llamadas.</p>';

  $('#infoT').textContent = t; k.innerHTML = h; k.scrollTop = y;

const TABLERO = { crm: 'crm', crea: 'demo' };
let charla = [];
function abrirHerramienta(cual, tel, desdeHistoria) {
  if (TABLERO[cual]) { location.href = '/tablero?abrir=' + TABLERO[cual] + '&volver=/oficina'; return; }
  if (!desdeHistoria) history.pushState({ herramienta: cual }, '');
  $('#herrT').textContent = 'Jason · Librería'; $('#texto').placeholder = 'Pregúntale a Jason lo que sea'; $('#texto').value = '';

}
$('#volver').onclick = () => history.back();
function pintarLibreria() {
  // La respuesta más nueva va arriba, pegada al cuadro de escribir: el teclado nunca la tapa.
  const pares = []; for (let i = 0; i < charla.length; i += 2) pares.push(charla.slice(i, i + 2));
  const k = $('#herrC');
  k.innerHTML = pares.length ? pares.reverse().map(([q, r]) => `<div class="msj yo">${esc(q.texto)}</div><div class="msj">${esc(r ? r.texto : '')}</div>`).join('') : '<p class="contexto">Jason vive en la Librería: sabe todo lo de MOON y, si algo no lo sabe, lo busca en internet. Pregúntale lo que sea con tus palabras; si usa una palabra técnica, te la explica con un ejemplo.</p><p class="fila"><small>Ejemplos: ¿Se puede poner un asistente en Instagram? · ¿Qué diferencia hay entre créditos y tokens? · ¿Podemos hacer un asistente para un dentista?</small></p>';
  k.scrollTop = 0;
}
$('#escribe').onsubmit = async e => {
  e.preventDefault();
  const q = $('#texto').value.trim(); if (!q) return;
  $('#texto').value = '';
  const antes = charla.map(m => ({ yo: !!m.yo, texto: m.texto })).slice(-6);
  charla.push({ yo: true, texto: q }, { texto: 'Jason está investigando…' }); pintarLibreria();
  const j = await oficina('libreria', { pregunta: q, antes });
  charla[charla.length - 1] = { texto: j.ok ? j.respuesta : (j.mensaje || 'No se pudo contestar. Intenta de nuevo.') };
  pintarLibreria();
};
