<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0c347c">
<meta property="og:type" content="website">
<meta property="og:title" content="Tu recepcionista · MOON Digital">
<meta property="og:description" content="Unas preguntas para preparar la recepcionista de tu consultorio.">
<meta property="og:url" content="https://moondigitalia.com/cuestionario/dentxlife">
<meta property="og:image" content="https://moondigitalia.com/img/logo.webp">
<link rel="icon" href="/img/logo.webp">
<title>MOON Digital</title>
<link rel="preload" as="image" href="/img/logo-blanco.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&display=swap">
<style>
/* MUESTRA (25-nov-2026): pantallas 0, 1, 2 y 13 del cuestionario de Dentxlife, con la voz de Jason y karaoke.
   Reglas de Kid: sin scroll, letra grande que una persona de más de 50 lea sin esfuerzo, nada brinca,
   cada pregunta máximo 4 renglones, el cambio de pantalla es un fundido (la anterior se desvanece encima de la nueva). */
:root{--azul:#0c347c;--blanco:#ffffff;--tenue:rgba(255,255,255,.42);--linea:rgba(255,255,255,.55);
  --letra:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--azul);color:var(--blanco);font-family:var(--letra)}
/* El marco mide lo que de verdad se ve (teclado incluido): la página nunca se recorre. */
#marco{position:fixed;left:0;top:0;width:100%;height:100dvh;overflow:hidden}
.pantalla{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--azul);
  padding:max(12px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}
.pantalla.sale{z-index:2;transition:opacity .38s ease;pointer-events:none}
.pantalla.sale.ya{opacity:0}

/* Pantalla 0: el logo al centro, con aire, y un solo botón */
.inicio{align-items:center;justify-content:center;gap:clamp(40px,9vh,72px)}
.inicio img{width:min(58vw,260px);height:auto;display:block}

/* Barra de arriba: atrás · avance · silenciar y repetir */
.barra{display:flex;align-items:center;justify-content:space-between;height:52px;flex:none}
.icono{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:56px;background:none;border:0;color:var(--blanco);
  font:600 12px/1 var(--letra);padding:6px 4px;cursor:pointer;border-radius:12px}
.icono svg{width:24px;height:24px}
.icono[hidden]{visibility:hidden;display:flex!important}
.grupo{display:flex;gap:4px}
.avance{height:5px;border-radius:5px;background:rgba(255,255,255,.22);flex:none;overflow:hidden}
.avance i{display:block;height:100%;background:var(--blanco);border-radius:5px}

/* La pregunta: lugar fijo para 4 renglones, así nada se mueve cuando cambia el texto */
.pregunta{flex:none;margin:22px 0 0;min-height:calc(4 * 1.3em);font:700 clamp(22px,6.2vw,27px)/1.3 var(--letra);letter-spacing:-.005em}
.pregunta span{transition:color .12s linear}
.pregunta.hablando span{color:var(--tenue)}
.pregunta.hablando span.dicha{color:var(--blanco)}

/* Respuestas */
.respuestas{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;min-height:0;padding-top:16px}
.boton{width:100%;min-height:56px;border-radius:999px;border:2px solid var(--linea);background:transparent;color:var(--blanco);
  font:600 18px/1.25 var(--letra);padding:12px 22px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.boton .sug{font:600 13px/1 var(--letra);border:1.5px solid currentColor;border-radius:999px;padding:5px 9px;flex:none}
.boton.elegido{background:var(--blanco);border-color:var(--blanco);color:var(--azul)}
.lleno{background:var(--blanco);border-color:var(--blanco);color:var(--azul);justify-content:center;text-align:center;font-weight:700}
.inicio .lleno{width:min(72vw,300px);font-size:19px}
textarea{width:100%;min-height:96px;resize:none;border-radius:22px;border:2px solid var(--blanco);background:rgba(255,255,255,.08);
  color:var(--blanco);font:500 18px/1.4 var(--letra);padding:14px 18px;outline:none}
textarea::placeholder{color:rgba(255,255,255,.72)}
.mini{background:none;border:0;color:var(--blanco);font:600 15px/1 var(--letra);text-decoration:underline;align-self:center;padding:10px;cursor:pointer}
.nota{font:500 18px/1.45 var(--letra);margin:24px 0 0}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--blanco);outline-offset:3px}
</style>
</head>
<body>
<div id="marco"></div>

<script>
(function(){
  // Las frases (iguales a api/_voces/catalogo.js). Si la voz no llega, el texto sale igual y nunca se atora.
  var PANTALLAS = [
    { id: 'inicio' },
    { id: '01', texto: 'Hola, Doctora. Soy Jason, de MOON Digital. Gracias por tu confianza.', tipo: 'va' },
    { id: '02', texto: 'Con tus respuestas preparamos la recepcionista de Dentxlife. Si alguna no la sabes, no pasa nada.', tipo: 'va' },
    { id: '13', texto: 'Si un paciente pregunta precios, ¿qué quieres que diga tu recepcionista?', tipo: 'opciones', opciones: [
      { t: 'Precio de la valoración y lo demás en consulta', sug: true },
      { t: 'Rangos de precios', escribir: 'Escribe los rangos. Ejemplo: limpieza de 500 a 800 pesos' },
      { t: 'No da precios' },
      { t: 'Otro', escribir: 'Escribe qué quieres que diga' } ] },
    { id: 'fin', texto: 'Hasta aquí llega la muestra. Así se verán y escucharán todas las preguntas.' }
  ];
  var CUESTIONARIO = 'dentxlife';
  var marco = document.getElementById('marco');
  var audio = new Audio(); audio.preload = 'auto';
  var voces = {}, respuestas = {}, actual = -1, silencio = false, ocupado = false, raf = 0;

  // El marco mide lo que de verdad se ve, también con el teclado abierto.
  function medir(){ var vv = window.visualViewport; marco.style.height = (vv ? vv.height : innerHeight) + 'px'; if (vv) marco.style.top = vv.offsetTop + 'px'; }
  if (window.visualViewport){ visualViewport.addEventListener('resize', medir); visualViewport.addEventListener('scroll', medir); }
  addEventListener('resize', medir); medir();

  // Pide la voz de una pantalla una sola vez (y la tiene lista antes de mostrarla).
  function pedirVoz(p){
    if (!p || !p.texto || p.id === 'fin') return Promise.resolve(null);
    if (voces[p.id]) return voces[p.id];
    voces[p.id] = fetch('/api/voz?c=' + CUESTIONARIO + '&f=' + p.id).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        if (!j || !j.ok) return null;
        var bin = atob(j.audio), b = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
        return { url: URL.createObjectURL(new Blob([b], { type: 'audio/mpeg' })), palabras: j.palabras };
      }).catch(function(){ voces[p.id] = null; return null; });
    return voces[p.id];
  }
  function conTope(prom, ms){ return Promise.race([prom, new Promise(function(r){ setTimeout(function(){ r(null); }, ms); })]); }

  var ICONOS = {
    atras: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    voz: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>',
    mudo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>',
    repetir: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>'
  };

  function el(html){ var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }

  function armar(i){
    var p = PANTALLAS[i];
    if (p.id === 'inicio'){
      var s0 = el('<section class="pantalla inicio"><img src="/img/logo-blanco.webp" alt="MOON Digital" width="640" height="169"><button class="boton lleno" type="button">Empezar</button></section>');
      s0.querySelector('button').onclick = function(){ ir(1); };
      return s0;
    }
    var total = PANTALLAS.length - 2, paso = Math.min(i, total);
    var s = el('<section class="pantalla">' +
      '<div class="barra"><button class="icono" data-a="atras" type="button">' + ICONOS.atras + 'Atrás</button>' +
      '<div class="grupo"><button class="icono" data-a="voz" type="button">' + (silencio ? ICONOS.mudo + 'Sin voz' : ICONOS.voz + 'Silenciar') + '</button>' +
      '<button class="icono" data-a="repetir" type="button">' + ICONOS.repetir + 'Repetir</button></div></div>' +
      '<div class="avance"><i style="width:' + Math.round(paso / total * 100) + '%"></i></div>' +
      '<p class="pregunta">' + p.texto.split(' ').map(function(w){ return '<span>' + esc(w) + '</span>'; }).join(' ') + '</p>' +
      '<div class="respuestas"></div></section>');
    var r = s.querySelector('.respuestas');
    if (p.tipo === 'va') r.appendChild(boton('Va', 'lleno', function(){ ir(i + 1); }));
    if (p.tipo === 'opciones') p.opciones.forEach(function(o){
      var b = boton(o.t, '', function(){ elegir(s, p, o, b, i); });
      if (o.sug) b.insertAdjacentHTML('beforeend', '<span class="sug">Sugerido</span>');
      if (respuestas[p.id] && respuestas[p.id].opcion === o.t) b.classList.add('elegido');
      r.appendChild(b);
    });
    if (p.id === 'fin'){ r.appendChild(boton('Volver a empezar', 'lleno', function(){ respuestas = {}; ir(1); })); s.querySelector('[data-a="voz"]').hidden = true; s.querySelector('[data-a="repetir"]').hidden = true; }
    s.querySelector('[data-a="atras"]').onclick = function(){ ir(i - 1 < 1 ? 0 : i - 1); };
    s.querySelector('[data-a="voz"]').onclick = function(){ silencio = !silencio; audio.muted = silencio; this.innerHTML = silencio ? ICONOS.mudo + 'Sin voz' : ICONOS.voz + 'Silenciar'; if (silencio) iluminarTodo(s); };
    s.querySelector('[data-a="repetir"]').onclick = function(){ hablar(s, p); };
    return s;
  }

  function boton(t, clase, fn){ var b = el('<button class="boton ' + clase + '" type="button"></button>'); b.textContent = t; b.onclick = fn; return b; }

  // Opciones: las de un toque avanzan solas; las que piden escribir abren su espacio en el mismo lugar.
  function elegir(s, p, o, b, i){
    if (ocupado) return;
    s.querySelectorAll('.respuestas .boton').forEach(function(x){ x.classList.remove('elegido'); });
    b.classList.add('elegido');
    respuestas[p.id] = { opcion: o.t };
    if (!o.escribir){ setTimeout(function(){ ir(i + 1); }, 260); return; }
    var r = s.querySelector('.respuestas');
    r.innerHTML = '';
    r.appendChild(b);
    var ta = el('<textarea rows="3"></textarea>'); ta.placeholder = o.escribir; ta.setAttribute('aria-label', o.escribir);
    ta.oninput = function(){ respuestas[p.id].texto = ta.value; };
    r.appendChild(ta);
    r.appendChild(boton('Siguiente', 'lleno', function(){ ir(i + 1); }));
    var cambiar = el('<button class="mini" type="button">Elegir otra opción</button>');
    cambiar.onclick = function(){ var n = armar(i); s.replaceWith(n); };
    r.appendChild(cambiar);
    ta.focus();
  }

  function iluminarTodo(s){ cancelAnimationFrame(raf); var q = s.querySelector('.pregunta'); if (q) q.classList.remove('hablando'); }

  // Jason dice la pregunta y cada palabra se ilumina justo cuando la dice; al terminar queda completa.
  function hablar(s, p){
    cancelAnimationFrame(raf); audio.pause();
    var q = s.querySelector('.pregunta'); if (!q || !p.texto) return;
    pedirVoz(p).then(function(v){
      if (!v || silencio){ q.classList.remove('hablando'); return; }
      var spans = q.querySelectorAll('span');
      spans.forEach(function(x){ x.classList.remove('dicha'); });
      audio.src = v.url; audio.currentTime = 0; audio.muted = silencio;
      var pr = audio.play();
      if (pr && pr.catch) pr.catch(function(){ q.classList.remove('hablando'); });
      q.classList.add('hablando');
      (function paso(){
        var t = audio.currentTime;
        v.palabras.forEach(function(w, k){ if (spans[k] && t >= w.ini - 0.03) spans[k].classList.add('dicha'); });
        if (audio.ended || audio.paused && t > 0){ q.classList.remove('hablando'); return; }
        raf = requestAnimationFrame(paso);
      })();
    });
  }
  audio.addEventListener('ended', function(){ var q = marco.querySelector('.pantalla:not(.sale) .pregunta'); if (q) q.classList.remove('hablando'); });

  // Cambio de pantalla: la voz se pide ANTES; la nueva se arma completa debajo y la anterior se desvanece encima.
  function ir(i){
    if (ocupado || i < 0 || i >= PANTALLAS.length) return;
    ocupado = true;
    var p = PANTALLAS[i];
    // El toque de "Empezar" es el que permite que la página hable (los celulares no dejan antes).
    if (actual === 0) desbloquear();
    conTope(pedirVoz(p), 4000).then(function(){
      var vieja = marco.querySelector('.pantalla'), nueva = armar(i);
      marco.appendChild(nueva);
      actual = i;
      pedirVoz(PANTALLAS[i + 1]);
      if (vieja){
        cancelAnimationFrame(raf); audio.pause();
        vieja.classList.add('sale'); marco.appendChild(vieja);
        requestAnimationFrame(function(){ requestAnimationFrame(function(){ vieja.classList.add('ya'); }); });
        setTimeout(function(){ vieja.remove(); }, 420);
      }
      setTimeout(function(){ ocupado = false; hablar(nueva, p); }, vieja ? 380 : 0);
    });
  }

  // Un silencio de un instante, tocado dentro del toque de "Empezar": desde ahí el celular deja hablar a Jason.
  function desbloquear(){
    var n = 800, b = new DataView(new ArrayBuffer(44 + n));
    function txt(o, s){ for (var k = 0; k < s.length; k++) b.setUint8(o + k, s.charCodeAt(k)); }
    txt(0, 'RIFF'); b.setUint32(4, 36 + n, true); txt(8, 'WAVE'); txt(12, 'fmt '); b.setUint32(16, 16, true);
    b.setUint16(20, 1, true); b.setUint16(22, 1, true); b.setUint32(24, 8000, true); b.setUint32(28, 8000, true);
    b.setUint16(32, 1, true); b.setUint16(34, 8, true); txt(36, 'data'); b.setUint32(40, n, true);
    for (var k = 0; k < n; k++) b.setUint8(44 + k, 128);
    audio.src = URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
    var pr = audio.play(); if (pr && pr.catch) pr.catch(function(){});
  }

  marco.appendChild(armar(0)); actual = 0;
  pedirVoz(PANTALLAS[1]);
})();
</script>
</body>
</html>
